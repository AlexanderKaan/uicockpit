/* ══════════════════════════════════════════════════════════════════════════
 * A SPECIMEN SHEET.
 *
 * The page had nine sections in a column and every one of them was the same
 * shape — eyebrow, heading, lede, grid of tiles — so it read as a pile rather
 * than an argument, and the bento in the middle held six unrelated kinds of
 * object at once. This is the answer to that: the page is NEUTRAL PAPER with
 * hairline rules, and the only things on it with a look are the kits' own
 * previews. No panels, no tinted tiles, no cards floating on a ground.
 *
 * And one gesture, repeated deeper each time: ONE INPUT, NINE ANSWERS. The
 * kit picker over the wall is the page's only control — pick a kit there or
 * in either table, and every band below restates itself in that kit's terms.
 * That is the product in one sentence, so it is the page in one interaction.
 * ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* The ground is warm off-white paper. Ink is near-black, not black: at this
     size a true #000 serif buzzes against a warm ground. */
  /* the three neutrals are given, not derived: paper, the bar a control sits
     in, and the line. The same three the app uses. */
  --r:10px; --r-lg:14px;
  --ground:#f1f0ee;
  --paper:#f7f6f4;
  --bar:#e4e2df;
  --ink:#111112;
  --ink-2:#5b5a5e;                       /* 5.9:1 on the ground */
  /* THE FAINT INK IS NOT DECORATIVE GREY. It carries every eyebrow, every
     column head, every fine line and the whole HOW column — all of it under
     18.66px, so it needs 4.5:1 and the #8e8d91 it started at measured 2.84.
     This project's own positioning is measurable accessibility; its front page
     does not get to be the exception. */
  --ink-3:#6b6a6e;                       /* 4.63:1 */
  /* Hairlines, in two weights: one that separates bands and one that separates
     rows inside a table. Both are the ink at low alpha rather than a grey, so
     they sit on any surface without a seam. */
  --rule:#dad9d7;
  --rule-2:#0000000f;
  /* THE BRAND SET, and what each one is allowed to do.
     Measured on this ground, because two of the three cannot carry text and a
     palette nobody wrote the limits down for gets used wrongly in a week:
       violet  4.77:1 on the paper, and white on violet is 5.53:1
       pink    2.93:1
       coral   2.68:1
     So VIOLET is the one that may be ink or a filled button. Pink and coral are
     marks and fills only, never small text. The gradient runs coral into violet
     and is the one place all three meet. */
  --accent:#6644FC;
  --accent-2:#ED46BA;
  --accent-3:#FE5A48;
  --gradient:linear-gradient(90deg,#FE5A48 42.04%,#6645FD 100%);
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font:400 16.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,p,ul,ol,dl,figure{margin:0}
::selection{background:#111112;color:#efeeec}

/* ONE COLUMN, AND A NAMED WAY OUT OF IT.
 * Three columns — gutter, content, gutter — so a section that wants the whole
 * width asks for the outer line instead of measuring the viewport. 100vw counts
 * the scrollbar and a bleed nested in a bleed compounds; a grid line can do
 * neither. */
.app{display:grid;column-gap:0;width:100%;
  grid-template-columns:[full-start] minmax(20px,1fr) [wide-start] minmax(0,74rem) [wide-end] minmax(20px,1fr) [full-end]}
.app>*{grid-column:wide;min-width:0}
.bleed{grid-column:full}

/* ── MASTHEAD ─────────────────────────────────────────────────────────────
 * A rule, not a floating white pill. It is the page's own edge. */
.top{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--rule);
  background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(9px) saturate(1.4)}
/* the rule runs the whole width because it is the page's own edge; the contents
   still sit on the content column, so the mark lines up with everything below */
.top__in{max-width:74rem;margin:0 auto;padding:15px 20px 14px;display:flex;align-items:center;gap:26px}
.top__mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15.5px;letter-spacing:-.015em}
.top nav{display:flex;gap:22px;margin-left:auto;font-size:14px;color:var(--ink-2)}
.top nav a{text-decoration:none;padding-bottom:2px;border-bottom:1px solid transparent;transition:border-color .18s,color .18s}
.top nav a:hover{color:var(--ink);border-bottom-color:var(--accent)}
@media(max-width:760px){.top nav{display:none}}

.btn{font:500 14px var(--sans);min-height:38px;padding:0 15px;border-radius:var(--r);cursor:pointer;
  border:1px solid var(--ink);background:0;color:var(--ink);text-decoration:none;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  transition:background .16s,color .16s,transform .16s}
.btn:hover{background:var(--ink);color:var(--ground)}
.btn:active{transform:translateY(1px)}
/* THE GRADIENT IS A BORDER AND NEVER A FILL. Two backgrounds: the solid one
   clipped to the padding box, the gradient to the border box, so the ring
   follows the radius the way a real border does. */
.btn--go{color:#fff;border:2px solid transparent;
  background:linear-gradient(var(--ink),var(--ink)) padding-box,var(--gradient) border-box}
.btn--go:hover{background:linear-gradient(#2b2a30,#2b2a30) padding-box,var(--gradient) border-box}
.btn--lg{min-height:48px;padding:0 22px;font-size:15.5px}

/* ── 1 · THE NAME ─────────────────────────────────────────────────────────── */
.name{padding:clamp(3.5rem,9vw,7rem) 0 0;text-align:center}
.eyebrow{font:500 11px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
/* THE HEADLINE SAYS WHAT THIS IS, in one read. A clever two-part construction
   made you work out the product from a negation; the name of the thing does
   not. The only shaping left is tonal: the qualifier sits back and the noun
   arrives, which costs the sentence nothing. */
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.75rem,6.6vw,5rem);line-height:1;
  letter-spacing:-.042em;text-wrap:balance;max-width:min(20ch,100%);margin:1.1rem auto 0;
  color:var(--ink)}
/* the two halves each take a line, so the break can never fall inside "design
   system" the way a balanced wrap kept choosing to put it */
h1 em{display:block;font-style:normal}
/* the hyphenated word is one word: a phone was breaking it as "The open-" /
   "source", and a compound split mid-hyphen reads as a typo */
.nb{white-space:nowrap}
@media (max-width:430px){h1{font-size:2.35rem}}
/* three short checkable facts where the slogan stood, drawn as quiet pills */
.ticks{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0;
  font:500 13px var(--sans);color:var(--ink)}
.ticks span{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 13px;
  background:#fff;border:1px solid var(--rule);border-radius:99px}
.ticks svg{width:13px;height:13px;color:var(--accent)}
.name .lede{margin:1.15rem auto 0;max-width:34rem;font-size:clamp(1rem,1.6vw,1.1875rem);
  line-height:1.55;color:var(--ink);text-wrap:balance}
.name .lede b{color:var(--ink);font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin:2.25rem 0 0}

/* ── THE WALL ─────────────────────────────────────────────────────────────
 * The one picture the page is built on, so it runs the whole width with no
 * frame, no card and no edge — feathered at the top and both sides so it
 * settles into the paper instead of ending at a line. Two masks composited:
 * one for the top, one for the sides, intersected so a corner gets both. */
.wall{margin:clamp(2.5rem,5vw,4rem) 0 0;position:relative}
.wall__pick{display:flex;gap:5px;overflow-x:auto;padding:0 20px 16px;scrollbar-width:none;
  max-width:74rem;margin:0 auto;justify-content:safe center}
.wall__pick::-webkit-scrollbar{display:none}
.wall__pick button{flex:none;display:inline-flex;align-items:baseline;gap:6px;cursor:pointer;
  border:1px solid var(--rule);background:0;color:var(--ink-2);border-radius:99px;
  font:450 13px var(--sans);padding:6px 13px;white-space:nowrap;
  transition:color .14s,border-color .14s,background .14s}
.wall__pick button:hover{color:var(--ink);border-color:var(--ink-3)}
/* INK, NOT VIOLET. The board inside the frame is themed with our violet now, so
   a violet chip a centimetre above it reads as part of the same thing. The
   chrome says "this one" in ink; the colour inside the picture is the kit's. */
.wall__pick button[aria-checked=true]{background:var(--ink);border-color:var(--ink);color:var(--ground);font-weight:500}
.wall__pick small{font:400 10.5px var(--mono);opacity:.6;letter-spacing:0}
/* the wall shows one; the tool shows six. The page never said so, and it is the
   thing the app is actually built around. */
.wall__after{max-width:74rem;margin:1.25rem auto 0;padding:0 20px;text-align:center;
  font-size:13.5px;color:var(--ink-2)}
.wall__after a{color:var(--accent);text-underline-offset:3px}
.wall__stage{position:relative;isolation:isolate;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 9%),
    linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 9%),
    linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
/* tall enough that no kit's board scrolls inside the shot: the tallest
   (Material, 873px) fits with room, measured across widths. A picture of an
   app that scrolls inside itself reads as a broken window, not a picture. */
.wall iframe{width:100%;height:900px;border:0;background:#fff;display:block;
  /* it is a PICTURE of an app: with pointer events on, the wheel lands in the
     frame's document, which has nothing to scroll, and the page under your
     cursor goes dead. Nothing inside is clickable anyway. */
  pointer-events:none}
/* phones see the WHOLE board at half scale instead of the left third of it:
   the frame lays out at double width and is scaled back into the viewport,
   so the shot stays a complete picture of an app */
@media (max-width:720px){
  .wall__stage{height:900px;overflow:hidden}
  .wall iframe{width:200%;height:1800px;transform:scale(.5);transform-origin:0 0}
}

/* ── THE LIGHT SWEEP ──────────────────────────────────────────────────────
 * Not decoration: the light is the thing DOING the change. It travels from the
 * side the switch came from so it reads as following your hand, and the frame
 * swaps in one frame of animation underneath it — the light is what the cut
 * hides behind. */
.sweep{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;display:none}
.sweep[data-dir]{display:block}
.sweep::before{content:"";position:absolute;top:-25%;bottom:-25%;width:38%;
  transform:skewX(-13deg);filter:blur(12px);
  background:linear-gradient(90deg,rgb(255 255 255/0) 0%,rgb(255 255 255/.55) 32%,
    rgb(255 255 255/.98) 50%,rgb(255 255 255/.55) 68%,rgb(255 255 255/0) 100%);
  animation-duration:1s;animation-timing-function:cubic-bezier(.32,.06,.22,1);animation-fill-mode:forwards}
.sweep[data-dir=ltr]::before{left:-45%;animation-name:sweep-ltr}
.sweep[data-dir=rtl]::before{left:107%;animation-name:sweep-rtl}
@keyframes sweep-ltr{to{left:107%}}
@keyframes sweep-rtl{to{left:-45%}}
.sweep::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;
  animation:sweep-bloom 1s ease-out forwards}
@keyframes sweep-bloom{0%{opacity:0}16%{opacity:.34}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.sweep[data-dir]{display:none}}

/* ── 2 · THE TURN ─────────────────────────────────────────────────────────
 * The one place the page breathes, on the paper and in the display face. */
.turn{padding:clamp(4rem,9vw,7.5rem) 0;text-align:center}
.turn p{font-family:var(--display);font-weight:600;margin:0 auto;max-width:min(26ch,100%);
  font-size:clamp(1.625rem,3.6vw,2.625rem);line-height:1.2;letter-spacing:-.035em;color:var(--ink-3)}
.turn b{color:var(--ink);font-weight:700}

/* ── BANDS ────────────────────────────────────────────────────────────────
 * Separated by a rule, never by a box. */
.band{padding:clamp(3rem,6vw,5rem) 0 clamp(3rem,6vw,4.5rem);border-top:1px solid var(--rule)}
/* HEADING LEFT, LEDE RIGHT. One column left the right half of every band empty
   while the tables beneath them ran the full width, so the page listed to one
   side. This is the horizontal rhythm every band now shares. */
.band__head{display:grid;gap:.9rem 3.5rem;margin-bottom:2.75rem;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.band__head>.eyebrow{grid-column:1/-1}
.band__head .lede{margin-top:.35rem}
@media(max-width:900px){.band__head{grid-template-columns:1fr;gap:.9rem}.band__head .lede{margin-top:0}}
h2{font-family:var(--display);font-weight:700;font-size:clamp(1.625rem,2.9vw,2.375rem);
  line-height:1.12;letter-spacing:-.038em;text-wrap:balance;max-width:20ch}
.band__head .lede{color:var(--ink-2);font-size:1.0625rem;max-width:40rem;line-height:1.55}
.fine{font-size:13px;line-height:1.55;color:var(--ink-3)}
code,.mono{font-family:var(--mono);font-size:.86em;font-variant-ligatures:none}

/* ── THE SPECIMEN TABLE ───────────────────────────────────────────────────
 * The page's whole argument, and the only object it repeats: nine rows, one
 * per kit, read from the same route() the generator runs. Every row is also a
 * CONTROL — picking one here picks it in the wall, and the reverse. */
.spec{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.spec th{text-align:left;font:500 10.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);padding:0 14px 10px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
.spec th:last-child,.spec td:last-child{padding-right:0}
.spec td{padding:13px 14px 13px 0;border-bottom:1px solid var(--rule-2);vertical-align:baseline}
.spec tbody tr{cursor:pointer;transition:background .14s}
.spec tbody tr:hover{background:#00000008}
.spec tbody tr[aria-selected=true]{background:#00000010}
.spec tbody tr[aria-selected=true] .spec__kit{font-weight:600}
/* the selected row grows a bar in the gutter rather than a border, which would
   shift every cell in it by a pixel */
/* The bar sits in the first cell's own padding, so nothing shifts when a row is
   picked and nothing hangs out into the page margin. td.spec__kit, not
   .spec__kit: the `.spec td` shorthand above sets padding-left to 0 and wins on
   specificity, which put the kit's name flat against the bar. */
.spec th:first-child,.spec td.spec__kit{padding-left:13px}
.spec__kit{white-space:nowrap;font-weight:450}
/* the ghost: same text, already bold, zero height. The column is as wide as
   the bold name from the start, so the selection's weight change moves
   nothing. */
.spec__kit::after{content:attr(data-name);display:block;font-weight:600;height:0;overflow:hidden;visibility:hidden}
.spec tbody tr[aria-selected=true] .spec__kit{box-shadow:inset 3px 0 0 var(--accent)}
.spec__v{font-family:var(--mono);font-size:12.5px;color:var(--ink);word-break:break-all}
.spec__muted{color:var(--ink-2)}
.spec__num{color:var(--ink-2)}
/* HOW A KIT ANSWERS. Two of these four are the interesting ones — a kit that
   derives from a seed, and a kit that will not take a value at all — so those
   two carry the warm ink and the ordinary ones stay quiet. */
.kind{font:500 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.kind[data-k=seed],.kind[data-k=choice]{color:var(--accent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--ink);vertical-align:.05em}
.dot[data-off]{background:0;box-shadow:inset 0 0 0 1px var(--ink-3)}
/* A REFERENCE TABLE SCROLLS INSIDE ITS OWN BOX.
 * Nine rows of real variable names do not fit a phone, and the two ways out are
 * both worse than this one: hiding columns takes away the half of the table
 * that is the argument, and letting it push the page means the whole document
 * slides sideways. It keeps every column and moves on its own. */
.scroller{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
@media(max-width:820px){
  .spec{font-size:13px;min-width:34rem}
}

/* THE RAIL IS THE ANSWER, not an ornament.
 * It held a colour swatch and a rounded square, and neither did anything: the
 * column headings already say whose colour and whose corner it is, so the two
 * were a picture of a knob rather than a control. What belongs beside the table
 * is the thing the table cannot fit, which is what the kit you picked actually
 * DOES with the value. It wears the same violet bar as the selected row,
 * because that is the whole claim of the pairing: this paragraph belongs to
 * that line. */
.split{display:grid;grid-template-columns:17rem 1fr;gap:3rem;align-items:start}
/* a grid item's min-width is auto, so the table's min-content width pushed this
   column — and the whole page — past the viewport instead of scrolling inside
   the box built for it */
.split>*{min-width:0}
@media(max-width:900px){.split{grid-template-columns:1fr;gap:2rem}}
.answer{position:sticky;top:5.5rem;display:grid;gap:.45rem;
  border-left:3px solid var(--accent);padding-left:16px}
@media(max-width:900px){.answer{position:static;margin-bottom:.5rem}}
.answer__kit{font-family:var(--display);font-weight:700;font-size:1.375rem;
  letter-spacing:-.035em;line-height:1.1}
.answer__kind{font:500 10.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.answer__note{font-size:14px;line-height:1.62;color:var(--ink-2);margin-top:.4rem}
.answer code{font-family:var(--mono);font-size:12px;color:var(--ink)}


/* ── WHAT IT WILL NOT DO ──────────────────────────────────────────────────
 * The three principles and the five real manifest lines, in one place. They
 * were two boxes saying one thing. */
.nots{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:2rem 2.5rem;
  padding-bottom:2.5rem;border-bottom:1px solid var(--rule-2)}
.nots h3{font-family:var(--display);font-weight:700;font-size:1.1875rem;letter-spacing:-.03em;line-height:1.2}
.nots p{margin-top:.5rem;font-size:14px;line-height:1.6;color:var(--ink-2)}
.caveats{list-style:none;padding:0;display:grid;gap:1rem;margin-top:2.25rem;max-width:46rem}
.caveats li{font-size:14.5px;line-height:1.6;color:var(--ink-2);padding-left:1.4rem;position:relative}
.caveats li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;background:var(--accent-3)}
.caveats b{color:var(--ink);font-weight:500}
.caveats code{color:var(--ink)}

/* ── WHAT YOU GET ─────────────────────────────────────────────────────────── */
.files{list-style:none;padding:0;margin:0;display:grid}
.files{max-width:58rem}
.files li{display:grid;grid-template-columns:14rem 1fr;gap:1.5rem;align-items:baseline;
  padding:15px 0;border-bottom:1px solid var(--rule-2)}
.files code{font-size:13px;font-weight:500;color:var(--ink)}
.files span{font-size:14px;color:var(--ink-2)}
@media(max-width:560px){.files li{grid-template-columns:1fr;gap:.3rem}}

/* ── THE DOOR ─────────────────────────────────────────────────────────────
 * The last thing on the page is the thing to do. It is the one place the ink
 * inverts, because it is the one place you act. */
.door{margin-top:clamp(2.5rem,5vw,4rem);background:var(--ink);color:var(--ground);
  border-radius:var(--r-lg);padding:clamp(3rem,6vw,4.5rem) 2rem;text-align:center}
.door h2{color:#fff;margin:0 auto;max-width:16ch}
.door p{margin:1rem auto 0;max-width:34rem;color:#a3a2a6;font-size:1.0625rem}
.door .acts{margin-top:2rem}
.door .btn{color:var(--ink);border:2px solid transparent;
  background:linear-gradient(#fff,#fff) padding-box,var(--gradient) border-box}
.door .btn:hover{background:linear-gradient(var(--ground),var(--ground)) padding-box,var(--gradient) border-box}
.door .fine{color:#8a898e;margin-top:1.5rem}

/* ── FOOTER ───────────────────────────────────────────────────────────────
 * A switchboard, not a site map: this is the only place all nine can be
 * checked at once, so every link opens the tool already on the answer. */
.foot{margin-top:clamp(2rem,4vw,3rem);padding:2.5rem 0;border-top:1px solid var(--rule)}
.foot__cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:2.25rem;
  padding-bottom:2.25rem;border-bottom:1px solid var(--rule-2)}
.foot__col{display:flex;flex-direction:column;gap:8px}
.foot__head{font:500 10.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink);margin-bottom:2px}
.foot__head--sub{margin-top:14px}
.foot__list,.foot__kits{display:flex;flex-direction:column;gap:7px}
.foot a{color:var(--ink-2);text-decoration:none;font-size:13px;transition:color .14s}
.foot a:hover{color:var(--ink)}
.foot__list a{display:flex;align-items:baseline;gap:6px}
.foot__list em{font-style:normal;font-size:11px;color:var(--ink-3)}
#footruns a{flex-direction:column;align-items:flex-start;gap:1px}
.foot__kit{margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.foot__kit>a:first-child{font-size:13px;color:var(--ink);font-weight:450}
.foot__ver{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.foot__bottom{padding-top:18px}
.foot__bottom p{margin:0;font-size:12.5px;color:var(--ink-3)}
.foot__bottom a{font-size:inherit}
.foot__bottom .wm{margin-right:7px}
.wm{vertical-align:-2px}
.foot{--wm-glyph:var(--ground)}

/* ── MOTION ───────────────────────────────────────────────────────────────
 * One orchestrated arrival at the top, and rows that arrive as you reach them.
 * Nothing else moves on its own. */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.25,1) both}
.name .eyebrow{animation-delay:.02s}
h1{animation-delay:.09s}
.name .lede{animation-delay:.19s}
.name .acts{animation-delay:.28s}
.wall{animation-delay:.38s}
[data-reveal]{opacity:0;transform:translateY(10px)}
[data-reveal][data-in]{opacity:1;transform:none;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.25,1)}
@media (prefers-reduced-motion:reduce){
  .rise{animation:none}
  [data-reveal]{opacity:1;transform:none;transition:none}
}
/* and on paper there is no scrolling to reveal anything with */
@media print{.rise,[data-reveal]{opacity:1;transform:none;animation:none;transition:none}}
</style>
<!--BODY-->
<script type="module">
const KITS = /*KITS*/;
const HEAD = /*HEAD*/;
const BODY = /*BODY*/;
const TAIL = /*TAIL*/;
const SHOTFIRST = /*SHOTFIRST*/;
const CARDS = /*CARDS*/, PARTS = /*PARTS*/;
const CARDLIST = /*CARDLIST*/;
const CAVEATS = /*CAVEATS*/;
const VOCAB = /*VOCAB*/;
const KNOB = /*KNOB*/;
const $ = (s) => document.querySelector(s)
const ALLK = Object.values(KITS)
const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten']
const word = (n) => WORDS[n] ?? String(n)

/* THE SWITCH.
 * Every frame is compiled into this page, so switching is instantaneous and
 * nothing is fetched to prove the claim. The ampersand matters: srcdoc is an
 * ATTRIBUTE, entity-decoded before the document is parsed, and Radix's
 * stylesheet is full of them — escape only the quotes and 800 kB of CSS
 * arrives mangled with nothing in the console to say why. */
const srcdoc = (html) => html.replace(/&/g, '&amp;').replace(/"/g, '&quot;')
const doc = (id, board) => `<!doctype html>${HEAD[id]}<body>${BODY[id][board]}${TAIL[id]}`
const frame = (id, board, title) => `<iframe title="${title}" loading="lazy" srcdoc="${srcdoc(doc(id, board))}"></iframe>`

/* ── ONE SELECTION, AND THE WHOLE PAGE ANSWERS ─────────────────────────────
 * The page has exactly one piece of state: which kit you are looking at. The
 * picker over the wall sets it and so does any row in either table, and every
 * band restates itself when it changes. That is the product — one value, nine
 * vocabularies — made into the way the page WORKS rather than a claim it makes
 * about itself.
 *
 * Only the eight that RENDER can be in the wall; Open Props ships no
 * components, so selecting it moves the tables and leaves the picture on the
 * last kit that had one. The caption says so rather than showing a blank. */
const ORDER = Object.keys(HEAD)
let picked = null            // the selection, over all nine
let showing = null           // what the wall is holding, over the eight

function pick(id, dir) {
  if (!KITS[id] || id === picked) return
  picked = id
  for (const el of document.querySelectorAll('[data-k]')) {
    el.setAttribute(el.tagName === 'TR' ? 'aria-selected' : 'aria-checked', String(el.dataset.k === id))
  }
  writeNote(id)
  if (HEAD[id]) showKit(id, dir ?? (ORDER.indexOf(id) >= ORDER.indexOf(showing) ? 'ltr' : 'rtl'))

}

function showKit(id, dir) {
  if (id === showing) return
  /* THE LIGHT IS WHAT THE CUT HIDES BEHIND.
     An iframe swaps in one frame of animation, which reads as a flicker. The
     sweep's bloom peaks at 16% of a second, so the swap happens under it —
     the light appears to be doing the change rather than playing after it. */
  const sweep = $('#sweep')
  const swap = () => { $('#wallshot').innerHTML = frame(id, 'data', `${KITS[id].name}, rendered`); showing = id }
  if (showing === null || matchMedia('(prefers-reduced-motion: reduce)').matches) return swap()
  sweep.removeAttribute('data-dir')
  void sweep.offsetWidth                       // restart the animation, not resume it
  sweep.setAttribute('data-dir', dir)
  setTimeout(swap, 160)
  setTimeout(() => sweep.removeAttribute('data-dir'), 1050)
}

$('#wallpick').innerHTML = ORDER.map((id) => `<button role="radio" data-k="${id}" aria-checked="false">
  ${KITS[id].name}<small>${KITS[id].runsIn?.framework ?? 'any'}</small></button>`).join('')
$('#wallpick').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  /* the light leaves from the side the switch came from, so it reads as
     following your hand rather than playing at it */
  pick(b.dataset.k, ORDER.indexOf(b.dataset.k) >= ORDER.indexOf(showing) ? 'ltr' : 'rtl')
})

/* the two values the table is the answer to, named where a fact belongs rather
   than drawn as a swatch that does nothing */
$('#knobbrand').textContent = KNOB.brand
$('#knobradius').textContent = KNOB.radius

/* ── THE VOCABULARY ───────────────────────────────────────────────────────
 * One value, and the name each kit has for it — read out of the same router
 * the generator runs, never typed. Four kinds of answer, and the two that are
 * not a plain variable are the whole reason the manifest exists. */
const KIND = { var: 'variable', token: 'token', seed: 'seed', choice: 'choice' }
const cell = (a) => a.kind === 'choice'
  ? `<span class="spec__v">${a.name}="${a.value}"</span>`
  : `<span class="spec__v">${a.name}</span>`
$('#vocab').innerHTML = ALLK.map((k) => {
  const v = VOCAB[k.id]
  return `<tr data-k="${k.id}" aria-selected="false" tabindex="0">
    <td class="spec__kit" data-name="${k.name}">${k.name}</td>
    <td>${cell(v.brand)}</td>
    <td>${cell(v.radius)}</td>
    <td><span class="kind" data-k="${v.brand.kind}">${KIND[v.brand.kind]}</span></td>
  </tr>`
}).join('')

/* ── THE FOUR BANDS ───────────────────────────────────────────────────────
 * Behaviour, an engine, tokens and components. A kit fills some and leans on
 * the rest, and this is where you can see that at a glance instead of reading
 * nine cards that all look the same. */
$('#bands').innerHTML = ALLK.map((k) => {
  const b = k.bands ?? {}
  const dot = (on) => `<span class="dot"${on ? '' : ' data-off'}></span>`
  return `<tr data-k="${k.id}" aria-selected="false" tabindex="0">
    <td class="spec__kit" data-name="${k.name}">${k.name}</td>
    <td class="spec__muted">${k.runsIn?.framework ?? 'anything'}</td>
    <td class="spec__muted">${b.behaviour?.by ?? 'none'}</td>
    <td class="spec__muted">${b.engine ?? 'none'}</td>
    <td class="spec__num">${b.tokens ?? 'none'}</td>
    <td>${dot(b.components)}</td>
  </tr>`
}).join('')

/* both tables are the same control as the picker */
for (const t of ['#vocab', '#bands']) {
  $(t).addEventListener('click', (e) => { const r = e.target.closest('tr'); if (r) pick(r.dataset.k) })
  $(t).addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return
    const r = e.target.closest('tr'); if (!r) return
    e.preventDefault(); pick(r.dataset.k)
  })
}

/* THE NOTE IS THE KIT'S OWN. Every one of these sentences is written by the
   router while it works out what it can and cannot do with your value — which
   is why they say things a marketing page would not dare to, like a brand
   colour that is compiled and cannot be set at runtime at all. */
/* ── EACH TABLE ANSWERS WHERE YOU CLICKED ──────────────────────────────────
 * One selection still drives the whole page, but the FEEDBACK has to be next to
 * the thing you touched. Clicking a row in the bands table changed a paragraph
 * a thousand pixels above it, which is a click with no visible result.
 *
 * The second rail is built from the same four bands its table prints, so it is
 * the same facts in a sentence rather than a second opinion about them. */
const bandsLine = (k) => {
  const b = k.bands ?? {}
  const engine = b.engine === 'own' ? 'its own engine'
    : b.engine ? `${KITS[b.engine]?.name ?? b.engine}'s engine`
    : 'no engine of its own'
  return [
    b.behaviour ? `Behaviour from ${b.behaviour.by}` : 'No behaviour of its own',
    engine,
    `${b.tokens} variables`,
    b.components ? 'and the components it ships' : 'and no components',
  ].join(', ') + '.'
}
/* FILLED means BRINGS IT ITSELF. An engine it leans on is the opposite of a
   band it fills, which is the whole reason the column is worth printing. */
const fills = (k) => {
  const b = k.bands ?? {}
  return [!!b.behaviour, b.engine === 'own', (b.tokens ?? 0) > 0, !!b.components].filter(Boolean).length
}
const cap = (t) => t ? t[0].toUpperCase() + t.slice(1) : ''

function writeNote(id) {
  const k = KITS[id], v = VOCAB[id]
  $('#answerkit').textContent = k.name
  $('#answerkind').textContent = `takes it as a ${KIND[v.brand.kind]}`
  $('#answernote').innerHTML = v.note ?? `${k.name} takes the value straight into <code>${v.brand.name}</code>.`

  $('#bandskit').textContent = k.name
  $('#bandsfills').textContent = `fills ${word(fills(k))} of the four`
  $('#bandsnote').innerHTML = `${bandsLine(k)}${k.runsIn?.what ? ` ${cap(k.runsIn.what)}.` : ''}`
}

$('#files').innerHTML = [
  ['theme.css', 'every kit’s tokens, each in its own form'],
  ['install.md', 'the exact commands for what you enabled'],
  ['MANIFEST.md', 'versions, licences, contrast, and what could not be done'],
  ['DESIGN-SYSTEM.md', 'the brief you hand a coding agent'],
  ['_custom.scss', 'when a kit compiles its brand rather than reading it'],
].map(([f, w]) => `<li><code>${f}</code><span>${w}</span></li>`).join('')

$('#caveats').innerHTML = CAVEATS.map((c) => `<li>${c}</li>`).join('')

$('#nots').innerHTML = [
  ['No components of ours.', 'They come from the kit you picked. The day we start curating our own list is the day this becomes another library.'],
  ['No defaults of ours.', 'Switch a kit on and you get ITS values, read from what it publishes. A hand-typed default is wrong the day they change it.'],
  ['No model in the render path.', 'A brief maps words to numbers a standard already names, and the page shows you which values it moved.'],
].map(([t, d]) => `<div><h3>${t}</h3><p>${d}</p></div>`).join('')

/* THE NUMBERS ARE COUNTED, not typed into the markup. The page's whole claim is
   that it is generated from the same documents the tool reads, and a number
   typed into a marketing page is the first thing to go stale. */
const FREEK = ALLK.filter((k) => !k.runsIn?.framework)
for (const el of document.querySelectorAll('[data-count=kits]')) el.textContent = word(ALLK.length)
for (const el of document.querySelectorAll('[data-count=free]')) el.textContent = word(FREEK.length)
for (const el of document.querySelectorAll('[data-count=parts]')) el.textContent = String(PARTS)

/* ── THE FOOTER IS A SWITCHBOARD ───────────────────────────────────────────
 * Not a site map and not an SEO hub of pages that do not exist. This tool is
 * the only place where all nine can be checked and set at once, so somebody
 * arriving with one of those questions — what does Mantine call its brand,
 * how does Ant Design differ from Material, which of these run without React —
 * should land ON the answer rather than at a front door. */
const go = (q) => `/generator?${new URLSearchParams(q)}`

$('#footkits').innerHTML = ALLK.map((k) => `<p class="foot__kit">
  <a href="${go({ kits: k.id })}">${k.name}</a>
  <a class="foot__ver" href="${k.home}" rel="noopener">${k.version ? `v${k.version} · ` : ''}${k.license ?? 'licence unknown'}</a></p>`).join('')

/* THE PAIRS ARE DERIVED, not chosen. Two kits are a real question for the same
   reader only if the same reader could run both, so they are paired inside
   their own framework group. Tailwind with daisyUI or with shadcn is left out:
   those STACK, and offering them as a versus would be a comparison nobody has. */
const RENDERING = ALLK.filter((k) => k.layer !== 'tokens')
const STACKED = new Set(['tailwind|daisyui', 'tailwind|shadcn'])
const pairs = []
for (const group of ['any', 'React']) {
  const inGroup = RENDERING.filter((k) => (k.runsIn?.framework ?? 'any') === group)
  for (let i = 0; i < inGroup.length; i++) {
    for (let j = i + 1; j < inGroup.length; j++) {
      const [a, b] = [inGroup[i], inGroup[j]]
      if (STACKED.has(`${a.id}|${b.id}`) || STACKED.has(`${b.id}|${a.id}`)) continue
      pairs.push([a, b])
    }
  }
}
$('#footpairs').innerHTML = pairs.map(([a, b]) =>
  `<a href="${go({ compare: `${a.id},${b.id}` })}">${a.name} <em>vs</em> ${b.name}</a>`).join('')

/* Counted over ALL nine, not over the eight that render: counting only the
   renderable ones said four where the rest of the page says five, because Open
   Props is framework-free and has nothing to put in a pane. The number is about
   the kits, the link is about what can be shown, and the line says so. */
$('#footruns').innerHTML = [['any', 'Runs in anything'], ['React', 'React only']].map(([f, label]) => {
  const all = ALLK.filter((k) => (k.runsIn?.framework ?? 'any') === f)
  const shown = all.filter((k) => k.layer !== 'tokens')
  const note = all.length === shown.length ? `${all.length} systems` : `${all.length} systems · ${shown.length} to compare`
  return `<a href="${go({ compare: shown.map((k) => k.id).slice(0, 6).join(',') })}">${label}<em>${note}</em></a>`
}).join('')

/* the one link in the body that names kits: taken from the same list, so it
   cannot point at a kit we stopped shipping */
$('#wallsix').href = go({ compare: RENDERING.slice(0, 6).map((k) => k.id).join(',') })

/* By the card's OWN id, checked against the list the wall publishes — a title
   typed here would point at a card the wall may have renamed, and the filter
   drops anything that is not there rather than shipping a dead link. */
const ASK = ['actions', 'buttons', 'fields', 'queue', 'trail', 'rail']
$('#footcards').innerHTML = ASK.map((id) => {
  const card = CARDLIST.find((c) => c.id === id)
  if (!card) return ''
  return `<a href="${go({ compare: RENDERING.slice(0, 6).map((k) => k.id).join(','), card: id })}">${card.title}</a>`
}).filter(Boolean).join('')

/* ── ARRIVAL ──────────────────────────────────────────────────────────────
 * Rows arrive as you reach them, once. An observer rather than a scroll
 * handler, so nothing runs while you are sitting still. */
const io = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) { e.target.setAttribute('data-in', ''); io.unobserve(e.target) }
}, { rootMargin: '0px 0px -12% 0px' })
for (const el of document.querySelectorAll('#vocab tr, #bands tr, .files li, .nots > div, .caveats li')) {
  /* NOTHING ON SCREEN IS EVER HIDDEN. A row that starts at opacity 0 and waits
     for an observer is a row that can ship invisible — to a tall window, to a
     print, to a screenshot — and the rows ARE the argument on this page. So the
     effect only ever applies to what is below the fold, where it is the only
     place it can be seen anyway. */
  if (el.getBoundingClientRect().top < innerHeight) continue
  el.setAttribute('data-reveal', '')
  el.style.transitionDelay = `${Math.min([...el.parentNode.children].indexOf(el), 9) * 34}ms`
  io.observe(el)
}

pick(SHOTFIRST, 'ltr')
</script>
