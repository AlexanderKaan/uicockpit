<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIcockpit — The open-source design system generator</title>
<meta name="description" content="Not another design system — the machine that makes yours. Pick Tailwind, shadcn/ui, daisyUI, Bootstrap or Material, turn a handful of knobs, and install the result.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* The site's own style, read from what uicockpit.com serves — its palette, its
   type scale, its dot grid. One value changed on purpose: the ground is warm
   now instead of white, so the sections read as panels floating on it rather
   than as regions of one white page. Everything else is what was already here. */
:root{
  --mkt-bg:#efeeec;          /* was #fff — the one deliberate change */
  --mkt-surface:#fff;
  --mkt-sunken:#f7f7f8;
  --mkt-border:#ececef;
  --mkt-fg:#0a0a0b;
  --mkt-fg-muted:#6b6b73;
  --mkt-fg-faint:#9a9aa1;
  --mkt-accent:#007aff;
  --mkt-accent-hover:#006fe6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--mkt-bg);color:var(--mkt-fg);
     font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     -webkit-font-smoothing:antialiased}
a{color:inherit}
.app{display:flex;flex-direction:column;gap:12px;padding:12px;max-width:78rem;margin-inline:auto;width:100%}
.mkt__container{max-width:72rem;margin:0 auto;width:100%}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mkt-fg-faint);font-weight:600;margin:0}
.fine{font-size:13px;color:var(--mkt-fg-muted);margin:12px 0 0}
code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.85em}

/* sections float on the ground */
.nav,.hero,.claim,.band-sec{background:var(--mkt-surface);border-radius:14px}
.nav{padding:12px 18px;display:flex;align-items:center;gap:20px;position:sticky;top:12px;z-index:20}
.mark{display:flex;align-items:center;gap:9px;margin:0;font-weight:600;letter-spacing:-.02em;font-size:15px}
.nav__links{display:flex;gap:20px;margin-left:auto;font-size:14px}
.nav__links a{color:var(--mkt-fg-muted);text-decoration:none}
.nav__links a:hover{color:var(--mkt-fg)}
.btn{font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:0 16px;border-radius:10px;
     border:1px solid var(--mkt-border);background:var(--mkt-surface);color:var(--mkt-fg);cursor:pointer;
     display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--mkt-sunken)}
.btn--go{background:var(--mkt-accent);color:#fff;border-color:var(--mkt-accent)}
.btn--go:hover{background:var(--mkt-accent-hover)}
.btn--lg{min-height:48px;padding:0 22px;font-size:16px;border-radius:12px;font-weight:600}

/* the hero, at the scale the site already used */
.hero{text-align:center;padding:5rem 1.5rem 0;position:relative;overflow:hidden}
.hero>*{position:relative;z-index:1}
.mkt__hero-grid{pointer-events:none;z-index:0;position:absolute;inset:0;
  background-image:radial-gradient(circle,#0000001a 1px,#0000 1.6px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(#000 55%,#0000 100%);mask-image:linear-gradient(#000 55%,#0000 100%)}
.mkt__hero-grid::after{content:"";position:absolute;inset:0;transition:opacity .3s;
  background-image:radial-gradient(circle,var(--mkt-accent) 1.3px,transparent 1.8px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(circle 220px at var(--mx,-9999px) var(--my,-9999px),#000 0%,#0009 40%,transparent 100%);
  mask-image:radial-gradient(circle 220px at var(--mx,-9999px) var(--my,-9999px),#000 0%,#0009 40%,transparent 100%)}
.tag{display:inline-block;margin:0 0 1.5rem;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:99px;
     background:var(--mkt-sunken);color:var(--mkt-fg-muted)}
h1{letter-spacing:-.035em;text-wrap:balance;max-width:54rem;margin:0 auto 1.5rem;
   font-size:clamp(2.5rem,6vw,4.5rem);font-weight:600;line-height:1.02}
.sub{color:var(--mkt-fg-muted);text-wrap:balance;max-width:40rem;margin:0 auto 2rem;
     font-size:clamp(1.0625rem,2vw,1.25rem);line-height:1.5}
.sub strong{color:var(--mkt-fg);font-weight:600}
.hero__acts{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;margin:0 0 3.5rem}
.shot{margin:0;border-radius:14px 14px 0 0;overflow:hidden;background:var(--mkt-sunken);padding:10px 10px 0;
      box-shadow:0 -1px 0 var(--mkt-border) inset}
.shot figcaption{display:flex;justify-content:space-between;padding:2px 6px 10px}
.shot iframe{width:100%;height:460px;border:0;border-radius:10px 10px 0 0;background:#fff;display:block}

.claim{padding:3.5rem 2rem;text-align:center;background:var(--mkt-fg);color:#f2f2f3}
.claim p{margin:0;font-size:clamp(1.25rem,2.6vw,1.875rem);line-height:1.3;letter-spacing:-.03em;
         text-wrap:balance;max-width:44rem;margin-inline:auto}
.claim strong{color:#fff;font-weight:600}

.band-sec{padding:3.5rem 2rem}
h2{margin:0;font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.03em;font-weight:600;text-wrap:balance}
.lede{margin:.75rem 0 2rem;color:var(--mkt-fg-muted);max-width:44rem;font-size:1.0625rem}

.kitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kitcard{background:var(--mkt-sunken);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.kitcard h3{margin:0;font-size:16px;letter-spacing:-.01em}
.kitcard p{margin:0;font-size:13.5px;color:var(--mkt-fg-muted);line-height:1.5}
.kitcard dl{margin:auto 0 0;display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:12px;
            padding-top:12px;border-top:1px solid var(--mkt-border)}
.kitcard dt{color:var(--mkt-fg-faint)}
.kitcard dd{margin:0;font-family:'JetBrains Mono',monospace;font-size:11.5px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--mkt-sunken);border-radius:12px;padding:20px}
.panel--quiet{background:0;border:1px solid var(--mkt-border)}
.files,.caveats,.nots{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.files li{display:grid;grid-template-columns:max-content 1fr;gap:12px;align-items:baseline}
.files code{font-size:13px;font-weight:600}
.files span{color:var(--mkt-fg-muted);font-size:13px}
.caveats li{font-size:13px;color:var(--mkt-fg-muted);line-height:1.5;padding-left:16px;position:relative}
.caveats li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:99px;background:var(--mkt-accent)}
.caveats b{color:var(--mkt-fg)}
.nots{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.nots li{background:var(--mkt-sunken);border-radius:12px;padding:18px;font-size:13.5px;color:var(--mkt-fg-muted);line-height:1.55}
.nots b{display:block;color:var(--mkt-fg);font-size:15.5px;margin-bottom:5px;letter-spacing:-.01em}

.wm{flex:none;vertical-align:-2px}
.mark{--wm-glyph:var(--mkt-surface)}
.foot{--wm-glyph:var(--mkt-bg);background:var(--mkt-surface);border-radius:14px;padding:34px 30px 26px;color:var(--mkt-fg-muted)}
.foot__cols{display:grid;grid-template-columns:1fr 1.6fr 1.4fr;gap:36px;padding-bottom:26px;border-bottom:1px solid var(--mkt-line)}
.foot__col{display:flex;flex-direction:column;gap:9px;font-size:13.5px}
.foot__head{margin:0 0 3px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--mkt-fg)}
.foot__col a{color:var(--mkt-fg-muted);text-decoration:none}
.foot__col a:hover{color:var(--mkt-fg)}
.foot__note{margin:0;font-size:12.5px;line-height:1.6}
.foot__kits{display:grid;gap:9px}
.foot__kit{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px}
.foot__kit a{font-weight:600;color:var(--mkt-fg)}
.foot__kit small{font-size:11px;color:var(--mkt-fg-muted)}
.foot__kit code{font-family:ui-monospace,monospace;font-size:11px}
.foot__bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:20px}
.foot__bottom p{margin:0;display:flex;align-items:center;gap:8px}
.foot__bottom strong{color:var(--mkt-fg)}
.foot__bottom a{color:inherit}
@media(max-width:820px){.foot__cols{grid-template-columns:1fr}}
@media(max-width:820px){.two{grid-template-columns:1fr}.hero{padding:3rem 1.25rem 0}.band-sec,.claim{padding:2.25rem 1.25rem}}
</style>
<!--BODY-->
<script type="module">
const KITS = /*KITS*/;
const SHOT = /*SHOT*/;
const CAVEATS = /*CAVEATS*/;
const $ = (s) => document.querySelector(s)

/* The dot grid: two custom properties on pointermove, and the accent layer's
   mask does the rest. Nothing to animate, nothing to tear down. */
const hero = $('.hero')
hero.insertAdjacentHTML('afterbegin', '<div class="mkt__hero-grid" aria-hidden="true"></div>')
hero.addEventListener('pointermove', (e) => {
  const r = hero.getBoundingClientRect()
  hero.style.setProperty('--mx', `${e.clientX - r.left}px`)
  hero.style.setProperty('--my', `${e.clientY - r.top}px`)
})
hero.addEventListener('pointerleave', () => hero.style.setProperty('--mx', '-9999px'))

$('#shot').innerHTML = `<iframe title="A kit, rendered" srcdoc="${SHOT.replace(/"/g, '&quot;')}"></iframe>`

$('#kitgrid').innerHTML = Object.values(KITS).map((k) => `<article class="kitcard">
  <h3>${k.name}</h3>
  <p>${k.what}</p>
  <dl>
    <dt>version</dt><dd>${k.version ?? 'live'}</dd>
    <dt>licence</dt><dd>${k.license ?? '—'}</dd>
    <dt>read from</dt><dd>${(k.source ?? '').split('·')[0].trim()}</dd>
  </dl></article>`).join('')

$('#files').innerHTML = [
  ['theme.css', 'every kit’s tokens, each in its own form'],
  ['install.md', 'the exact commands for what you enabled'],
  ['MANIFEST.md', 'versions, licences, contrast, and what could not be done'],
  ['DESIGN-SYSTEM.md', 'the brief you hand a coding agent'],
  ['_custom.scss', 'when a kit compiles its brand rather than reading it'],
].map(([f, w]) => `<li><code>${f}</code><span>${w}</span></li>`).join('')

/* The footer credits every kit by name, with the version we read and the
   licence that travels with it. Generated from the same documents the tool
   uses, so it cannot claim a version we did not actually read. */
$('#footkits').innerHTML = Object.values(KITS).map((k) => `<p class="foot__kit">
  <a href="${k.home}" rel="noopener">${k.name}</a>
  <small>${k.version ? `v${k.version} · ` : ''}${k.license ?? 'licence unknown'}</small></p>`).join('')

$('#caveats').innerHTML = CAVEATS.map((c) => `<li>${c}</li>`).join('')

$('#nots').innerHTML = [
  ['No components of ours.', 'They come from the kit you picked. The day we start curating our own list is the day this becomes another library.'],
  ['No defaults of ours.', 'Switch a kit on and you get ITS values, read from what it publishes. A hand-typed default is wrong the day they change it.'],
  ['No model in the render path.', 'A brief maps words to numbers a standard already names, and the page shows you which values it moved.'],
].map(([t, d]) => `<li><b>${t}</b>${d}</li>`).join('')
</script>
