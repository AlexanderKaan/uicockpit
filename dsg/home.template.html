<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIcockpit — The open-source design system generator</title>
<meta name="description" content="Not another design system — the machine that makes yours. Pick Tailwind, shadcn/ui, daisyUI, Bootstrap or Material, turn a handful of knobs, and install the result.">
<style>
/* The chrome language lives in design.md: warm ground, floating panels,
   greyscale, one black button. Repeated here because this page ships alone. */
:root{--ground:#efeeec;--panel:#fff;--sunken:#e7e6e3;--ink:#1c1b19;--muted:#6b6862;--line:#00000014;--go:#1c1b19}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:1120px;margin:0 auto;padding:12px 12px 0;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.fine{font-size:12.5px;color:var(--muted);margin:10px 0 0}
a{color:inherit}

.nav{background:var(--panel);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:18px;position:sticky;top:12px;z-index:5}
.mark{display:flex;align-items:center;gap:8px;margin:0;font-weight:600;letter-spacing:-.01em;font-size:14px}
.nav__links{display:flex;gap:16px;margin-left:auto;font-size:13.5px}
.nav__links a{color:var(--muted);text-decoration:none}
.nav__links a:hover{color:var(--ink)}
.btn{font:inherit;font-size:13px;font-weight:500;min-height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line);
     background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn--go{background:var(--go);color:#fff;border-color:var(--go);font-weight:600}
.btn--lg{min-height:44px;padding:0 18px;font-size:14.5px;border-radius:10px}

.hero{background:var(--panel);border-radius:10px;padding:44px 32px 0;text-align:center}
.tag{display:inline-block;margin:0 0 16px;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--sunken);color:var(--muted)}
h1{margin:0;font-size:clamp(30px,5vw,46px);line-height:1.06;letter-spacing:-.03em;font-weight:700;text-wrap:balance}
.sub{margin:14px auto 0;max-width:52ch;color:var(--muted);font-size:16.5px;text-wrap:pretty}
.sub strong{color:var(--ink);font-weight:600}
.hero__acts{display:flex;gap:9px;justify-content:center;margin:22px 0 32px;flex-wrap:wrap}
.shot{margin:0;border-radius:10px 10px 0 0;overflow:hidden;background:var(--sunken);padding:10px 10px 0}
.shot figcaption{display:flex;justify-content:space-between;padding:0 4px 9px}
.shot__frame iframe{width:100%;height:440px;border:0;border-radius:8px 8px 0 0;background:#fff;display:block}

.claim{background:var(--ink);color:#f4f2ef;border-radius:10px;padding:34px 32px;text-align:center}
.claim p{margin:0;font-size:clamp(18px,2.6vw,26px);line-height:1.35;letter-spacing:-.02em;text-wrap:balance}
.claim strong{color:#fff}

.band-sec{background:var(--panel);border-radius:10px;padding:30px 32px}
h2{margin:0;font-size:24px;letter-spacing:-.02em}
.lede{margin:8px 0 22px;color:var(--muted);max-width:66ch;text-wrap:pretty}

.kitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kitcard{background:var(--sunken);border-radius:10px;padding:15px;display:flex;flex-direction:column;gap:7px}
.kitcard h3{margin:0;font-size:15px}
.kitcard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.kitcard dl{margin:auto 0 0;display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;font-size:11.5px;padding-top:9px;border-top:1px solid var(--line)}
.kitcard dt{color:var(--muted)}
.kitcard dd{margin:0;font-family:ui-monospace,monospace}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--sunken);border-radius:10px;padding:16px}
.panel--quiet{background:0;border:1px solid var(--line)}
.files,.caveats,.nots{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.files li{display:grid;grid-template-columns:max-content 1fr;gap:11px;align-items:baseline;font-size:13px}
.files code{font-family:ui-monospace,monospace;font-size:12.5px;font-weight:600}
.files span{color:var(--muted);font-size:12.5px}
.caveats li{font-size:12.5px;color:var(--muted);line-height:1.5;padding-left:15px;position:relative}
.caveats li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:99px;background:var(--muted);opacity:.5}
.caveats b{color:var(--ink)}
.nots{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.nots li{background:var(--sunken);border-radius:10px;padding:15px;font-size:13px;color:var(--muted);line-height:1.55}
.nots b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px}

.foot{padding:26px 32px 34px;text-align:center;color:var(--muted)}
.foot p{margin:0}
@media(max-width:820px){.two{grid-template-columns:1fr}.hero{padding:32px 18px 0}.band-sec{padding:24px 18px}}
</style>
<!--BODY-->
<script type="module">
const KITS = /*KITS*/;
const SHOT = /*SHOT*/;
const CAVEATS = /*CAVEATS*/;
const $ = (s) => document.querySelector(s)

$('#shot').innerHTML = `<iframe title="A kit, rendered" srcdoc="${SHOT.replace(/"/g, '&quot;')}"></iframe>`

$('#kitgrid').innerHTML = Object.values(KITS).map((k) => `<article class="kitcard">
  <h3>${k.name}</h3>
  <p>${k.what}</p>
  <dl>
    <dt>version</dt><dd>${k.version ?? 'live'}</dd>
    <dt>licence</dt><dd>${k.license ?? '—'}</dd>
    <dt>read from</dt><dd>${(k.source ?? '').split('·')[0].trim()}</dd>
  </dl></article>`).join('')

$('#files').innerHTML = [
  ['theme.css', 'every kit’s tokens, each in its own form'],
  ['install.md', 'the exact commands for what you enabled'],
  ['MANIFEST.md', 'versions, licences, and what could not be done'],
  ['_custom.scss', 'when a kit compiles its brand rather than reading it'],
  ['components.json', 'when a kit is driven by one'],
].map(([f, w]) => `<li><code>${f}</code><span>${w}</span></li>`).join('')

$('#caveats').innerHTML = CAVEATS.map((c) => `<li>${c}</li>`).join('')

$('#nots').innerHTML = [
  ['No components of ours', 'They come from the kit you picked. The day we start curating our own list is the day this becomes another library.'],
  ['No defaults of ours', 'Switch a kit on and you get ITS values, read from what it publishes. A hand-typed default is wrong the day they change it.'],
  ['No model in the render path', 'A brief maps words to numbers a standard already names, and the page shows which values it moved.'],
].map(([t, d]) => `<li><b>${t}</b>${d}</li>`).join('')
</script>
