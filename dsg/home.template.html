<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UIcockpit — The open-source design system generator</title>
<meta name="description" content="Not another design system — the machine that makes yours. Pick Tailwind, shadcn/ui, daisyUI, Bootstrap or Material, turn a handful of knobs, and install the result.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* The site's own style, read from what uicockpit.com serves — its palette, its
   type scale, its dot grid. One value changed on purpose: the ground is warm
   now instead of white, so the sections read as panels floating on it rather
   than as regions of one white page. Everything else is what was already here. */
:root{
  --mkt-bg:#efeeec;          /* was #fff — the one deliberate change */
  --mkt-surface:#fff;
  --mkt-sunken:#f7f7f8;
  --mkt-border:#ececef;
  --mkt-fg:#0a0a0b;
  --mkt-fg-muted:#6b6b73;
  --mkt-fg-faint:#9a9aa1;
  --mkt-accent:#007aff;
  --mkt-accent-hover:#006fe6;
  /* A SECOND COLOUR, so the page is not nine shades of grey with one blue in
     it. Warm amber against the cool accent — the two sit a half-turn apart in
     hue at the same lightness and chroma, which is the only way two accents
     read as a pair rather than as a collision. The tints are the same two at a
     twentieth, for a tile that needs to be a different tile and nothing more.
     This is the marketing page, which is ours: the rule against introducing a
     hue is about the chrome AROUND a kit's preview, and it still holds there. */
  --mkt-warm:#c2740c;
  --mkt-warm-hover:#a86408;
  --mkt-tint-cool:#eef4fe;
  --mkt-tint-warm:#fdf3e6;
  --mkt-tint-line:#0000000f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--mkt-bg);color:var(--mkt-fg);
     font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     -webkit-font-smoothing:antialiased}
a{color:inherit}
/* ONE COLUMN, AND A NAMED WAY OUT OF IT.
 * The page is three columns — gutter, content, gutter — so a section that wants
 * the whole width asks for the outer line instead of measuring the viewport.
 * 100vw counts the scrollbar, and a bleed nested inside a bleed doubles its own
 * offset; between them the page carried a sideways scroll of 31px. A grid line
 * cannot be off by a scrollbar, and it cannot compound. */
.app{display:grid;column-gap:0;row-gap:12px;padding-block:12px;width:100%;
     grid-template-columns:[full-start] minmax(12px,1fr) [wide-start] minmax(0,calc(78rem - 24px)) [wide-end] minmax(12px,1fr) [full-end]}
.app>*{grid-column:wide;min-width:0}
.bleed{grid-column:full}
.mkt__container{max-width:72rem;margin:0 auto;width:100%}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mkt-fg-faint);font-weight:600;margin:0}
.fine{font-size:13px;color:var(--mkt-fg-muted);margin:12px 0 0}
code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.85em}

/* NOT EVERY SECTION WEARS A JACKET.
 * "Everything floats on the ground" turned into nine white cards in a column,
 * and a page where every band is a panel has no rhythm — the panel stops
 * meaning anything. A section is a panel only when its content is PROSE that
 * needs framing; where the content is already made of cards, the cards are the
 * objects and the ground is the ground. */
.nav,.band-sec--panel,.foot{background:var(--mkt-surface);border-radius:14px}
.nav{padding:12px 18px;display:flex;align-items:center;gap:20px;position:sticky;top:12px;z-index:20}
.mark{display:flex;align-items:center;gap:9px;margin:0;font-weight:600;letter-spacing:-.02em;font-size:15px}
.nav__links{display:flex;gap:20px;margin-left:auto;font-size:14px}
.nav__links a{color:var(--mkt-fg-muted);text-decoration:none}
.nav__links a:hover{color:var(--mkt-fg)}
.btn{font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:0 16px;border-radius:10px;
     border:1px solid var(--mkt-border);background:var(--mkt-surface);color:var(--mkt-fg);cursor:pointer;
     display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--mkt-sunken)}
.btn--go{background:var(--mkt-accent);color:#fff;border-color:var(--mkt-accent)}
.btn--go:hover{background:var(--mkt-accent-hover)}
.btn--lg{min-height:48px;padding:0 22px;font-size:16px;border-radius:12px;font-weight:600}

/* the hero, at the scale the site already used. No pattern behind it: the one
   picture on this page is the wall, and a dot grid under the headline was a
   second texture competing with it for the same glance. */
.hero{text-align:center;padding:5.5rem 1.5rem 0}
.tag{display:inline-block;margin:0 0 1.5rem;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:99px;
     background:var(--mkt-sunken);color:var(--mkt-fg-muted)}
h1{letter-spacing:-.035em;text-wrap:balance;max-width:54rem;margin:0 auto 1.5rem;
   font-size:clamp(2.5rem,6vw,4.5rem);font-weight:600;line-height:1.02}
.sub{color:var(--mkt-fg-muted);text-wrap:balance;max-width:40rem;margin:0 auto 2rem;
     font-size:clamp(1.0625rem,2vw,1.25rem);line-height:1.5}
.sub strong{color:var(--mkt-fg);font-weight:600}
.hero__acts{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;margin:0}
/* THE PICTURE IS FULL BLEED AND FEATHERED.
 * It is the one thing the page is built on, so it runs the whole width — and it
 * has no frame, no card and no edge. It fades out at the top and both sides so
 * it settles into the ground instead of ending at a line. Two masks composited:
 * one for the top, one for the sides, intersected so a corner gets both. */
.shot{margin:2.5rem 0 0;padding:0;background:0;position:relative}
.shot figcaption{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  max-width:72rem;margin:0 auto;padding:0 1.5rem 10px}
.shot__stage{position:relative;isolation:isolate;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 9%),
    linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 9%),
    linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.shot iframe{width:100%;height:min(74vh,620px);border:0;background:#fff;display:block}
@media (max-width:720px){.shot iframe{height:60vh}}

/* ONE BOUQUET, EVERY SYSTEM. The same board and the same values in each kit's
   own stylesheet — the page's claim, switchable rather than asserted. The row
   scrolls on a phone rather than wrapping, so the frame below it never moves. */
.shot__pick{display:flex;gap:6px;overflow-x:auto;padding:0 1.5rem 14px;scrollbar-width:none;
  max-width:72rem;margin:0 auto;justify-content:center}
.shot__pick::-webkit-scrollbar{display:none}
.shot__pick button{flex:none;display:inline-flex;align-items:baseline;gap:6px;cursor:pointer;
  border:1px solid var(--mkt-border);background:#fff;color:var(--mkt-fg-muted);
  font:inherit;font-size:13px;padding:6px 11px;border-radius:8px;white-space:nowrap;
  transition:color .12s,border-color .12s,background .12s}
.shot__pick button:hover{color:var(--mkt-fg)}
.shot__pick button[aria-checked=true]{background:var(--mkt-fg);border-color:var(--mkt-fg);color:#fff;font-weight:600}
.shot__pick small{font-size:11px;opacity:.65;letter-spacing:0}
.shot__pick button[aria-checked=true] small{opacity:.8}

/* ── THE LIGHT SWEEP ───────────────────────────────────────────────────────
 * Recovered from the old page's before/after toggle, where it was not
 * decoration: the light is the thing DOING the change, and it travels from the
 * side the switch came from so it reads as following your hand. Here it has one
 * more job — the frame swaps in a single frame of animation, and the light is
 * what the cut hides behind. */
.shot__sweep{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;display:none}
.shot__sweep[data-dir]{display:block}
.shot__sweep::before{content:"";position:absolute;top:-25%;bottom:-25%;width:38%;
  transform:skewX(-13deg);filter:blur(12px);
  background:linear-gradient(90deg,rgb(255 255 255/0) 0%,rgb(255 255 255/.55) 32%,
    rgb(255 255 255/.98) 50%,rgb(255 255 255/.55) 68%,rgb(255 255 255/0) 100%);
  animation-duration:1s;animation-timing-function:cubic-bezier(.32,.06,.22,1);animation-fill-mode:forwards}
.shot__sweep[data-dir=ltr]::before{left:-45%;animation-name:sweep-ltr}
.shot__sweep[data-dir=rtl]::before{left:107%;animation-name:sweep-rtl}
@keyframes sweep-ltr{to{left:107%}}
@keyframes sweep-rtl{to{left:-45%}}
/* a short bloom over everything, so the whole frame lifts as the light passes */
.shot__sweep::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;
  animation:sweep-bloom 1s ease-out forwards}
@keyframes sweep-bloom{0%{opacity:0}16%{opacity:.34}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.shot__sweep[data-dir]{display:none}}

/* THE TURN — on the ground, not in a panel.
   This used to be a full-width black slab wedged between two white panels, and
   it read as one more panel with the lights off rather than as the sentence the
   page turns on. A page of panels needs one place to breathe; that is what this
   is, so it has no background of its own at all. */
.turn{padding:4.5rem 2rem 4rem;text-align:center}
.turn p{margin:0 auto;max-width:46rem;font-size:clamp(1.375rem,2.8vw,2.125rem);line-height:1.28;
        letter-spacing:-.035em;text-wrap:balance;color:var(--mkt-fg-muted)}
.turn strong{color:var(--mkt-fg);font-weight:600}

.band-sec{padding:3.5rem 2rem}
.band-sec--quiet{background:0;border:1px solid var(--mkt-border)}
.band-sec .eyebrow{margin-bottom:.6rem}
h2{margin:0;font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.03em;font-weight:600;text-wrap:balance}
.lede{margin:.75rem 0 2rem;color:var(--mkt-fg-muted);max-width:44rem;font-size:1.0625rem}

/* the mechanism, as three beats rather than a wall of prose */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;counter-reset:step}
.steps li{background:var(--mkt-sunken);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;position:relative}
.steps li::before{counter-increment:step;content:counter(step);display:flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:99px;background:var(--mkt-surface);border:1px solid var(--mkt-border);
  font-size:12px;font-weight:600;color:var(--mkt-warm);font-variant-numeric:tabular-nums}
.steps li:nth-child(2){background:var(--mkt-tint-cool)}
.steps li:nth-child(3){background:var(--mkt-tint-warm)}
.steps b{font-size:16px;letter-spacing:-.01em;font-weight:600}
.steps p{margin:0;font-size:13.5px;color:var(--mkt-fg-muted);line-height:1.55}
.steps .fine{margin-top:auto;padding-top:10px;border-top:1px solid var(--mkt-border);font-size:12.5px}
.steps .fine b{font-size:inherit;color:var(--mkt-fg)}
.steps code{font-size:12px;color:var(--mkt-fg)}

/* the last thing on the page is the thing to do */
.close{background:var(--mkt-fg);color:#e9e9ec;border-radius:14px;padding:4rem 2rem;text-align:center}
.close h2{color:#fff}
.close p{margin:.75rem auto 0;max-width:36rem;color:#a7a7b0;font-size:1.0625rem}
.close__acts{margin:1.75rem 0 0}
.close .fine{color:#7d7d87;margin-top:1.25rem}
.close .btn--go{background:#fff;border-color:#fff;color:var(--mkt-fg)}
.close .btn--go:hover{background:#e9e9ec;border-color:#e9e9ec}

.kitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kitcard{background:var(--mkt-sunken);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.kitcard h3{margin:0;font-size:16px;letter-spacing:-.01em}
.kitcard p{margin:0;font-size:13.5px;color:var(--mkt-fg-muted);line-height:1.5}
.kitcard dl{margin:auto 0 0;display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:12px;
            padding-top:12px;border-top:1px solid var(--mkt-border)}
.kitcard dt{color:var(--mkt-fg-faint)}
.kitcard dd{margin:0;font-family:'JetBrains Mono',monospace;font-size:11.5px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--mkt-sunken);border-radius:12px;padding:20px}
.panel--quiet{background:0;border:1px solid var(--mkt-border)}
.files,.caveats,.nots{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.files li{display:grid;grid-template-columns:max-content 1fr;gap:12px;align-items:baseline}
.files code{font-size:13px;font-weight:600}
.files span{color:var(--mkt-fg-muted);font-size:13px}
.caveats li{font-size:13px;color:var(--mkt-fg-muted);line-height:1.5;padding-left:16px;position:relative}
.caveats li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:99px;background:var(--mkt-warm)}
.caveats b{color:var(--mkt-fg)}
.nots{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.nots li{background:var(--mkt-sunken);border-radius:12px;padding:18px;font-size:13.5px;color:var(--mkt-fg-muted);line-height:1.55}
.nots b{display:block;color:var(--mkt-fg);font-size:15.5px;margin-bottom:5px;letter-spacing:-.01em}

/* ── THE BENTO ─────────────────────────────────────────────────────────────
 * Tiles of different weights on one grid: two of them are the product's own
 * output at a smaller size, the rest are the numbers and the names the page has
 * already earned. A picture here is never a photograph of something else. */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(158px,auto);gap:14px}
.bento>*{background:var(--mkt-sunken);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;
  min-width:0;border:1px solid transparent}
.bento h3{margin:0;font-size:16.5px;letter-spacing:-.015em;font-weight:600}
.bento p{margin:0;font-size:13.5px;line-height:1.55;color:var(--mkt-fg-muted)}
.bento .num{font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--mkt-fg-faint);
  font-variant-numeric:tabular-nums}
.bento .big{font-size:clamp(2.25rem,4.5vw,3.25rem);line-height:1;letter-spacing:-.04em;font-weight:600;margin:auto 0 0}
.bento .big small{display:block;font-size:13px;letter-spacing:0;font-weight:400;color:var(--mkt-fg-muted);margin-top:8px}
.b--cool{background:var(--mkt-tint-cool);border-color:var(--mkt-tint-line)}
.b--cool .num{color:var(--mkt-accent)}
.b--warm{background:var(--mkt-tint-warm);border-color:var(--mkt-tint-line)}
.b--warm .num{color:var(--mkt-warm)}
.b--w2{grid-column:span 2}
.b--w3{grid-column:span 3}
.b--h2{grid-row:span 2}
/* a frozen frame: the product at a smaller size, not a control you can poke */
.b--shot{padding:0;overflow:hidden;background:#fff;border-color:var(--mkt-border);position:relative}
/* A frozen frame is a PICTURE, so it is cropped like one: the wall is a wide
   strip and a whole board shrunk to fit would be a thumbnail of a thumbnail.
   Shown at 62% and pulled up-left, so a tile holds real components at a size
   you can read rather than a whole board you cannot. */
.b--shot iframe{width:161%;height:161%;border:0;display:block;transform:scale(.62);transform-origin:top left;
  pointer-events:none;background:#fff;margin:-14px 0 0 -12px}
.b--shot figcaption{position:absolute;left:12px;top:12px;z-index:2;display:inline-flex;align-items:center;gap:7px;
  background:#ffffffe6;backdrop-filter:blur(6px);border:1px solid var(--mkt-border);border-radius:99px;
  padding:5px 11px;font-size:11.5px;font-weight:600;letter-spacing:-.005em}
.b--shot figcaption small{font-weight:400;color:var(--mkt-fg-muted)}
.bento .fine{margin-top:auto;padding-top:10px;border-top:1px solid var(--mkt-tint-line);font-size:12.5px}
.bento .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:12px}
.bento .chips span{font-size:11.5px;padding:4px 9px;border-radius:99px;background:#fff;border:1px solid var(--mkt-border);
  color:var(--mkt-fg-muted)}
.bento .chips span[data-free]{border-color:var(--mkt-warm);color:var(--mkt-warm)}
@media (max-width:940px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.b--w3{grid-column:span 2}}
@media (max-width:560px){.bento{grid-template-columns:1fr}.b--w2,.b--w3{grid-column:span 1}.b--h2{grid-row:span 1}}

.wm{flex:none;vertical-align:-2px}
.mark{--wm-glyph:var(--mkt-surface)}
.foot{--wm-glyph:var(--mkt-bg);background:var(--mkt-surface);border-radius:14px;padding:34px 30px 26px;color:var(--mkt-fg-muted)}
.foot__cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:32px;
  padding-bottom:26px;border-bottom:1px solid var(--mkt-border)}
.foot__col{display:flex;flex-direction:column;gap:9px;font-size:13.5px}
.foot__head{margin:0 0 3px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--mkt-fg)}
.foot__col a{color:var(--mkt-fg-muted);text-decoration:none}
.foot__col a:hover{color:var(--mkt-fg)}
.foot__head--sub{margin-top:16px}
.foot__list{display:flex;flex-direction:column;gap:7px}
.foot__list a{display:flex;align-items:baseline;gap:6px;color:var(--mkt-fg-muted);text-decoration:none;font-size:13px}
.foot__list a:hover{color:var(--mkt-fg)}
/* label and count do not fit side by side in a fifth of the footer: beside it
   the note wrapped mid-phrase and broke the label with it. */
#footruns a{flex-direction:column;align-items:flex-start;gap:1px}
.foot__list em{font-style:normal;font-size:11.5px;color:var(--mkt-fg-faint)}
.foot__ver{font-size:11.5px;color:var(--mkt-fg-faint);text-decoration:none}
.foot__ver:hover{color:var(--mkt-fg-muted)}
.foot__kits{display:grid;gap:9px}
.foot__kit{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;margin:0 0 7px}
.foot__kit a{font-weight:600;color:var(--mkt-fg);text-decoration:none}
.foot__kit a:hover{text-decoration:underline}
.foot__kit code{font-family:ui-monospace,monospace;font-size:11px}
.foot__bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:20px}
/* inline, not flex: a flex container makes every text node its own item, so
   the gap lands INSIDE the sentence — "Pageminds ." with a space before the
   full stop, and daylight after the name. The glyph aligns itself. */
.foot__bottom p{margin:0}
.foot__bottom .wm{margin-right:7px}
.foot__bottom strong{color:var(--mkt-fg)}
.foot__bottom a{color:inherit}
@media(max-width:820px){.foot__cols{grid-template-columns:1fr}}
@media(max-width:820px){.two{grid-template-columns:1fr}.hero{padding:3rem 1.25rem 0}.band-sec,.claim{padding:2.25rem 1.25rem}}
</style>
<!--BODY-->
<script type="module">
const KITS = /*KITS*/;
const HEAD = /*HEAD*/;
const BODY = /*BODY*/;
const TAIL = /*TAIL*/;
const SHOTFIRST = /*SHOTFIRST*/;
const CARDS = /*CARDS*/, PARTS = /*PARTS*/;
const CARDLIST = /*CARDLIST*/;
const CAVEATS = /*CAVEATS*/;
const $ = (s) => document.querySelector(s)

/* & before ", because srcdoc is an ATTRIBUTE and its value is entity-decoded
   before the document is parsed. A stylesheet with an & in it arrives mangled
   and the frame renders as bare text, with nothing in the console. */
/* THE SWITCH.
 * Every frame is compiled into this page, so switching is instantaneous and
 * nothing is fetched to prove the claim. The ampersand matters: srcdoc is an
 * ATTRIBUTE, entity-decoded before the document is parsed, and Radix's
 * stylesheet is full of them — escape only the quotes and 800 kB of CSS
 * arrives mangled with nothing in the console to say why. */
const srcdoc = (html) => html.replace(/&/g, '&amp;').replace(/"/g, '&quot;')
const doc = (id, board) => `<!doctype html>${HEAD[id]}<body>${BODY[id][board]}${TAIL[id]}`
const frame = (id, board, title) => `<iframe title="${title}" loading="lazy" srcdoc="${srcdoc(doc(id, board))}"></iframe>`

const ORDER = Object.keys(HEAD)
let showing = null
function showKit(id, dir) {
  if (id === showing || !HEAD[id]) return
  const k = KITS[id]
  for (const b of document.querySelectorAll('#shotpick button')) b.setAttribute('aria-checked', String(b.dataset.k === id))
  $('#shotwho').textContent = `Live · ${k.name} · ${k.version ? `v${k.version}` : 'read live'} · ${k.license ?? ''}`

  /* THE LIGHT IS WHAT THE CUT HIDES BEHIND.
     An iframe swaps in one frame of animation, which reads as a flicker. The
     sweep's bloom peaks at 16% of a second, so the swap happens under it —
     the light appears to be doing the change rather than playing after it. */
  const sweep = $('#shotsweep')
  const swap = () => { $('#shot').innerHTML = frame(id, 'data', `${k.name}, rendered`); showing = id }
  const still = showing === null || matchMedia('(prefers-reduced-motion: reduce)').matches
  if (still) return swap()
  sweep.removeAttribute('data-dir')
  void sweep.offsetWidth                       // restart the animation, not resume it
  sweep.setAttribute('data-dir', dir)
  setTimeout(swap, 160)
  setTimeout(() => sweep.removeAttribute('data-dir'), 1050)
}
$('#shotpick').innerHTML = ORDER.map((id) => `<button role="radio" data-k="${id}" aria-checked="false">
  ${KITS[id].name}<small>${KITS[id].runsIn?.framework ?? 'any'}</small></button>`).join('')
$('#shotpick').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  /* the light leaves from the side the switch came from, so it reads as
     following your hand rather than playing at it */
  showKit(b.dataset.k, ORDER.indexOf(b.dataset.k) >= ORDER.indexOf(showing) ? 'ltr' : 'rtl')
})
showKit(SHOTFIRST, 'ltr')
$('#shotmeta').textContent = `the same board · ${CARDS} cards · ${PARTS} parts`

/* the bento's pictures are the product's own output — the same kits, other
   boards, frozen. Nothing on this page is a photograph of something else. */
for (const el of document.querySelectorAll('[data-frame]')) {
  const [id, board] = el.dataset.frame.split(':')
  /* APPENDED, not assigned. innerHTML wiped the caption the tile was carrying,
     so two of the pictures came up unlabelled — which on a page whose whole
     point is whose kit you are looking at is the one thing they must say. */
  el.insertAdjacentHTML('beforeend', frame(id, board, `${KITS[id].name}, rendered`))
}

$('#kitgrid').innerHTML = Object.values(KITS).map((k) => `<article class="kitcard">
  <h3>${k.name}</h3>
  <p>${k.what}</p>
  <dl>
    <dt>version</dt><dd>${k.version ?? 'live'}</dd>
    <dt>licence</dt><dd>${k.license ?? '—'}</dd>
    <dt>read from</dt><dd>${(k.source ?? '').split('·')[0].trim()}</dd>
  </dl></article>`).join('')

$('#files').innerHTML = [
  ['theme.css', 'every kit’s tokens, each in its own form'],
  ['install.md', 'the exact commands for what you enabled'],
  ['MANIFEST.md', 'versions, licences, contrast, and what could not be done'],
  ['DESIGN-SYSTEM.md', 'the brief you hand a coding agent'],
  ['_custom.scss', 'when a kit compiles its brand rather than reading it'],
].map(([f, w]) => `<li><code>${f}</code><span>${w}</span></li>`).join('')

/* ── THE FOOTER IS A SWITCHBOARD ───────────────────────────────────────────
 * Not a site map and not an SEO hub of pages that do not exist. This tool is
 * the only place where all nine can be checked and set at once, so somebody
 * arriving with one of those questions — what does Mantine call its brand,
 * how does Ant Design differ from Material, which of these run without React —
 * should land ON the answer rather than at a front door.
 *
 * Every row is generated from the kit documents and every link opens the
 * generator already in that state. Nothing here is typed, so nothing here can
 * point at a kit we do not have or a version we did not read. */
const go = (q) => `/generator?${new URLSearchParams(q)}`

/* the name opens the tool on that kit; the version opens the kit's own site,
   which is the credit it is owed */
$('#footkits').innerHTML = Object.values(KITS).map((k) => `<p class="foot__kit">
  <a href="${go({ kits: k.id })}">${k.name}</a>
  <a class="foot__ver" href="${k.home}" rel="noopener">${k.version ? `v${k.version} · ` : ''}${k.license ?? 'licence unknown'}</a></p>`).join('')

/* THE PAIRS ARE DERIVED, not chosen. Two kits are a real question for the same
   reader only if the same reader could run both, so they are paired inside
   their own framework group. Tailwind with daisyUI or with shadcn is left out:
   those STACK, and offering them as a versus would be a comparison nobody has. */
const RENDERING = Object.values(KITS).filter((k) => k.layer !== 'tokens')
const STACKED = new Set(['tailwind|daisyui', 'tailwind|shadcn'])
const pairs = []
for (const group of ['any', 'React']) {
  const inGroup = RENDERING.filter((k) => (k.runsIn?.framework ?? 'any') === group)
  for (let i = 0; i < inGroup.length; i++) {
    for (let j = i + 1; j < inGroup.length; j++) {
      const [a, b] = [inGroup[i], inGroup[j]]
      if (STACKED.has(`${a.id}|${b.id}`) || STACKED.has(`${b.id}|${a.id}`)) continue
      pairs.push([a, b])
    }
  }
}
$('#footpairs').innerHTML = pairs.map(([a, b]) =>
  `<a href="${go({ compare: `${a.id},${b.id}` })}">${a.name} <em>vs</em> ${b.name}</a>`).join('')

/* THE SPLIT THE WHOLE POSITIONING RESTS ON, as two doors — and counted over
   ALL nine, not over the eight that render. Counting only the renderable ones
   said four where the rest of the page says five, because Open Props ships no
   components at all: it is framework-free and there is nothing to put in a
   pane. The number is about the kits; the link is about what can be shown, and
   the line says so when those differ. */
$('#footruns').innerHTML = [['any', 'Runs in anything'], ['React', 'React only']].map(([f, label]) => {
  const all = Object.values(KITS).filter((k) => (k.runsIn?.framework ?? 'any') === f)
  const shown = all.filter((k) => k.layer !== 'tokens')
  const note = all.length === shown.length ? `${all.length} systems` : `${all.length} systems · ${shown.length} to compare`
  return `<a href="${go({ compare: shown.map((k) => k.id).slice(0, 6).join(',') })}">${label}<em>${note}</em></a>`
}).join('')

/* and the question this tool answers that nothing else does: the same element,
   in every kit at once. Straight from the wall's own cards. */
/* By the card's OWN id, checked against the list the wall publishes — a title
   typed here would point at a card the wall may have renamed, and the filter
   below drops anything that is not there rather than shipping a dead link. */
const ASK = ['actions', 'buttons', 'fields', 'queue', 'trail', 'rail']
$('#footcards').innerHTML = ASK.map((id) => {
  const card = CARDLIST.find((c) => c.id === id)
  if (!card) return ''
  return `<a href="${go({ compare: RENDERING.slice(0, 6).map((k) => k.id).join(','), card: id })}">${card.title}</a>`
}).filter(Boolean).join('')

$('#caveats').innerHTML = CAVEATS.map((c) => `<li>${c}</li>`).join('')

/* THE NUMBERS ARE COUNTED, not typed into the markup. The page's whole claim is
   that it is generated from the same documents the tool reads, and a number
   typed into a marketing page is the first thing to go stale. */
const ALLK = Object.values(KITS)
const FREEK = ALLK.filter((k) => !k.runsIn?.framework)
const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten']
const word = (n) => WORDS[n] ?? String(n)
$('#bkits').firstChild.textContent = String(ALLK.length)
$('#bparts').firstChild.textContent = String(PARTS)
$('#bcards').textContent = String(CARDS)
$('#bfree').textContent = `${word(FREEK.length)} of the ${word(ALLK.length)} ask nothing of your app.`
$('#bchips').innerHTML = ALLK.map((k) => `<span${k.runsIn?.framework ? '' : ' data-free'}>${k.name}</span>`).join('')
$('#howfree').textContent = word(FREEK.length)
$('#howcount').textContent = word(ALLK.length)

$('#nots').innerHTML = [
  ['No components of ours.', 'They come from the kit you picked. The day we start curating our own list is the day this becomes another library.'],
  ['No defaults of ours.', 'Switch a kit on and you get ITS values, read from what it publishes. A hand-typed default is wrong the day they change it.'],
  ['No model in the render path.', 'A brief maps words to numbers a standard already names, and the page shows you which values it moved.'],
].map(([t, d]) => `<li><b>${t}</b>${d}</li>`).join('')
</script>
