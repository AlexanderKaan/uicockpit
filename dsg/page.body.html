<div class="app">
<aside class="rail">
  <a class="mark" href="/" title="UIcockpit — home"><!--MARK--> Design System Generator</a>

  <label class="brief">
    <!--I:sparkles-->
    <input id="brief" placeholder="Describe it — “calm, readable”" autocomplete="off">
  </label>
  <div class="rail__acts">
    <span class="chips" id="chips"></span>
    <button class="btn" id="shuffle"><!--I:shuffle-->Shuffle <kbd>S</kbd></button>
  </div>

  <details class="grp" open>
    <summary><span class="grp__name">Stack</span><span class="grp__sum" id="sum_stack"></span></summary>
    <div class="stack" id="stack" role="group" aria-label="Your stack"></div>
  </details>

  <details class="grp" open>
    <summary><span class="grp__name">Colour</span><span class="grp__sum grp__dots" id="sum_colour"></span></summary>
    <div class="swatches" id="swatches"></div>
  </details>

  <details class="grp" open>
    <summary><span class="grp__name">Typography</span><span class="grp__sum" id="sum_type"></span></summary>
    <div class="typo" id="typo"></div>
    <button class="mini" id="typeshuffle" title="Shuffle the type"><!--I:shuffle-->Shuffle the type</button>
  </details>

  <details class="grp" open>
    <summary><span class="grp__name">Shape &amp; space</span><span class="grp__sum" id="sum_shape"></span></summary>
    <div class="knobs" id="knobs"></div>
  </details>
</aside>

<main class="wall">
  <div class="wall__bar">
    <p class="eyebrow" id="wallhead">This is what your app will look like</p>
    <div class="seg" id="rungs" role="radiogroup" aria-label="What to show"></div>
    <div class="seg" id="modes" role="radiogroup" aria-label="Light or dark"></div>
    <p class="wall__count" id="wallcount"></p>
  </div>
  <div class="frames" id="frames"></div>
  <p class="wall__note" id="wallnote"></p>
</main>

<footer class="dock">
  <div class="dock__what" id="receipt"></div>
  <div class="dock__acts">
    <button class="btn btn--ghost" id="manifest"><!--I:circle-alert-->What could not be done</button>
    <button class="btn btn--go" id="download"><!--I:download-->Use this kit</button>
  </div>
</footer>

<dialog id="fontpick"><div class="pick">
  <header class="pick__top">
    <div><h2 id="pickrole">Headings</h2><p class="pick__sum" id="picksum"></p></div>
    <button class="sheet__x" id="pickx" aria-label="Close"><!--I:x--></button>
  </header>
  <label class="pick__search"><!--I:search--><input id="picksearch" placeholder="Search" autocomplete="off"></label>
  <div class="seg" id="picktabs" role="radiogroup" aria-label="Where from"></div>
  <div class="pick__list" id="picklist"></div>
  <footer class="pick__foot">
    <button class="btn" id="pickshuffle"><!--I:shuffle-->Shuffle</button>
    <p class="pick__now" id="picknow"></p>
  </footer>
</div></dialog>

<dialog id="sheet"><div class="sheet">
  <header class="sheet__top">
    <div><h2>Use this kit</h2><p class="sheet__sum" id="sum"></p></div>
    <button class="sheet__x" id="sheetx" aria-label="Close"><!--I:x--></button>
  </header>
  <section><p class="eyebrow">In this kit</p><div class="facts" id="facts"></div></section>
  <section><p class="eyebrow">Where do you want it?</p><div class="dests" id="dests"></div></section>
  <section><p class="eyebrow" id="clabel">Contrast</p><ul class="pairs" id="pairs"></ul></section>
  <section id="csection"><p class="eyebrow">What could not be done</p><ul class="caveats" id="caveats"></ul></section>
</div></dialog>
</div>
