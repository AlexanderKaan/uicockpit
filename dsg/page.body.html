<div class="app">
<header class="band">
  <div class="band__top">
    <a class="mark" href="/"><!--MARK--> Design System Generator</a>
    <label class="brief">
      <!--I:sparkles-->
      <input id="brief" placeholder="Describe it — “calm, readable, good for older users” — or just hit Shuffle" autocomplete="off">
    </label>
    <div class="band__acts">
      <span class="chips" id="chips"></span>
      <button class="btn" id="shuffle"><!--I:shuffle-->Shuffle <kbd>S</kbd></button>
    </div>
  </div>

  <div class="band__kits">
    <span class="eyebrow">Stack</span>
    <div class="stack" id="stack" role="group" aria-label="Your stack"></div>
  </div>

  <div class="band__knobs">
    <section>
      <p class="eyebrow">Colour</p>
      <div class="swatches" id="swatches"></div>
    </section>
    <section>
      <p class="eyebrow">Shape &amp; size</p>
      <div class="knobs" id="knobs"></div>
    </section>
  </div>
</header>

<main class="wall">
  <div class="wall__bar">
    <p class="eyebrow" id="wallhead">This is what your app will look like</p>
    <p class="wall__count" id="wallcount"></p>
  </div>
  <div class="frames" id="frames"></div>
  <p class="wall__note" id="wallnote"></p>
</main>

<footer class="dock">
  <div class="dock__what" id="receipt"></div>
  <div class="dock__acts">
    <button class="btn btn--ghost" id="manifest"><!--I:circle-alert-->What could not be done</button>
    <button class="btn btn--go" id="download"><!--I:download-->Use this kit</button>
  </div>
</footer>

<dialog id="sheet"><div class="sheet">
  <header class="sheet__top">
    <div><h2>Use this kit</h2><p class="sheet__sum" id="sum"></p></div>
    <button class="sheet__x" id="sheetx" aria-label="Close"><!--I:x--></button>
  </header>
  <section><p class="eyebrow">In this kit</p><div class="facts" id="facts"></div></section>
  <section><p class="eyebrow">Where do you want it?</p><div class="dests" id="dests"></div></section>
  <section><p class="eyebrow" id="clabel">Contrast</p><ul class="pairs" id="pairs"></ul></section>
  <section id="csection"><p class="eyebrow">What could not be done</p><ul class="caveats" id="caveats"></ul></section>
</div></dialog>
</div>
