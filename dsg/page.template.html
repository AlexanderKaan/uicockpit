<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design System Generator</title>
<style>
:root{--ground:#efeeec;--panel:#fff;--sunken:#e7e6e3;--ink:#1c1b19;--muted:#6b6862;--line:#00000014;--go:#1c1b19}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{min-height:100vh;display:flex;flex-direction:column;gap:12px;padding:12px}
.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
kbd{font:10px/1 ui-monospace,monospace;padding:2px 5px;border-radius:4px;background:var(--sunken);color:var(--muted)}

/* everything floats on the ground — no full-width bars */
.band,.wall,.dock{background:var(--panel);border-radius:10px}
.band{padding:12px 14px}
.band__top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:8px;margin:0;font-weight:600;letter-spacing:-.01em;flex:none;font-size:13.5px}
.brief{flex:1;min-width:240px;display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;
       border-radius:9px;background:var(--sunken);color:var(--muted)}
.brief input{flex:1;border:0;background:0;font:inherit;font-size:13px;color:var(--ink);outline:0;min-width:0}
.band__acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip,.btn{font:inherit;font-size:12.5px;font-weight:500;min-height:36px;padding:0 12px;border-radius:9px;
           border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
           display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed=true]{background:var(--sunken);border-color:transparent;font-weight:600}
.btn--ghost{border-color:transparent;background:0;color:var(--muted)}
.btn--go{background:var(--go);color:#fff;border-color:var(--go);font-weight:600}

.band__kits{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.kits{display:flex;gap:5px;flex-wrap:wrap}
.kit{font:inherit;font-size:12.5px;min-height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--line);
     background:var(--panel);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.kit b{font-weight:600}
.kit[aria-pressed=true]{background:var(--sunken);border-color:transparent;color:var(--ink)}
.kit i{width:12px;height:12px;border-radius:4px;background:currentColor;opacity:.28;flex:none;font-style:normal}
.kit[aria-pressed=true] i{opacity:1;background:var(--ink)}
.kit small{font-size:10.5px;opacity:.65}

.band__knobs{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:12px}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:7px}
.sw{display:flex;flex-direction:column;gap:5px}
.sw input{-webkit-appearance:none;appearance:none;border:0;padding:0;height:36px;width:100%;border-radius:9px;cursor:pointer;background:0}
.sw input::-webkit-color-swatch-wrapper{padding:0}
.sw input::-webkit-color-swatch{border:1px solid var(--line);border-radius:9px}
.sw span{font-size:10.5px;font-weight:600}
.sw code{font-size:9.5px;color:var(--muted);font-family:ui-monospace,monospace}
.knobs{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:7px}
.knob label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.knob b{color:var(--ink);font-family:ui-monospace,monospace;font-size:11px}
.knob input[type=range]{width:100%;accent-color:var(--ink);min-height:24px}

.wall{flex:1;padding:12px 14px;display:flex;flex-direction:column}
.wall__bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.seg{display:flex;gap:2px;background:var(--sunken);padding:3px;border-radius:10px}
.seg button{font:inherit;font-size:12.5px;padding:0 12px;min-height:30px;border:0;border-radius:8px;background:0;color:var(--muted);cursor:pointer}
.seg button[aria-checked=true]{background:var(--panel);color:var(--ink);font-weight:600}
.frames{flex:1}
.frames iframe{width:100%;height:70vh;min-height:480px;border:0;border-radius:10px;background:#fff;display:block}
.frames iframe[hidden]{display:none}
.wall__note{margin:9px 0 0;font-size:11.5px;color:var(--muted);min-height:17px}
.wall__note b{color:var(--ink);font-weight:600}

.dock{position:sticky;bottom:12px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dock__what{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;align-items:center;color:var(--muted)}
.dock__what b{color:var(--ink);font-weight:600}
.dock__what .ok{display:inline-flex;align-items:center;gap:6px}
.dock__acts{display:flex;gap:6px}

dialog{border:0;border-radius:12px;padding:0;max-width:min(720px,92vw);background:var(--panel)}
dialog::backdrop{background:#1c1b1966}
.sheet{padding:20px 22px;position:relative}
.sheet__x{position:absolute;top:12px;right:12px;border:0;background:0;cursor:pointer;color:var(--muted);min-height:36px;min-width:36px;border-radius:9px}
.sheet__x:hover{background:var(--sunken)}
.sheet h2{margin:0;font-size:17px;letter-spacing:-.01em}
.sheet__top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.sheet__sum{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.sheet section{margin-bottom:18px}
.sheet section .eyebrow{margin-bottom:9px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:6px 10px;border-radius:8px;background:var(--sunken)}
.fact i{width:11px;height:11px;border-radius:3px;flex:none;font-style:normal;border:1px solid #0000001a}
.fact b{font-weight:600}
.dests{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dest{text-align:left;font:inherit;border:1px solid var(--line);background:var(--panel);border-radius:10px;
      padding:11px 13px;cursor:pointer;min-height:56px;display:flex;flex-direction:column;gap:2px}
.dest:hover{background:var(--sunken)}
.dest b{font-size:13px;font-weight:600}
.dest span{font-size:11.5px;color:var(--muted);line-height:1.4}
.pairs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5px 16px}
.pairs li{display:grid;grid-template-columns:13px 1fr max-content;gap:8px;align-items:baseline;font-size:12px}
.pairs .ok{color:#1e6b37;font-weight:700}
.pairs .no{color:#8e2c21;font-weight:700}
.pairs em{font-style:normal;color:var(--muted);font-family:ui-monospace,monospace;font-size:11.5px}
.pairs li[data-bad] em{color:#8e2c21;font-weight:600}
.sheet h3{margin:15px 0 6px;font-size:12.5px}
.sheet p,.sheet li{font-size:12.5px;line-height:1.55;color:var(--muted)}
.sheet ul{margin:0;padding-left:17px}
.sheet code{font-family:ui-monospace,monospace;font-size:11.5px;background:var(--sunken);padding:1px 5px;border-radius:4px;color:var(--ink)}
@media(max-width:900px){.band__knobs{grid-template-columns:1fr}.swatches{grid-template-columns:repeat(4,1fr)}}
</style>
<!--BODY-->
<script type="module">
/*MODULES*/
const KITS = /*KITS*/;
const CSS = /*CSS*/;
const DERIVED = /*DERIVED*/;
const WALLS = /*WALLS*/;
const ICONS = /*ICONS*/;
const ico = (n, s = 13) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] ?? ''}</svg>`

const $ = (s) => document.querySelector(s)
const ORDER = ['tailwind', 'daisyui', 'shadcn', 'bootstrap', 'material']
const SWATCH = ROLES.filter((r) => r.kind === 'colour')
const LENGTHS = [
  { id: 'radius', min: 0, max: 24, step: 1, unit: 'px' },
  { id: 'baseText', min: 14, max: 20, step: 1, unit: 'px' },
]

/* A brief is not a prompt: these words map to numbers a standard already names,
   and the page SHOWS what they moved. No model, nothing to explain away. */
const BRIEFS = [
  { match: /older|elderly|accessib|readab|low vision/i, label: 'Readable',
    values: { baseText: '18px', radius: '8px' }, why: 'larger body text, calmer corners' },
  { match: /round|soft|friendly|playful/i, label: 'Rounder', values: { radius: '18px' }, why: 'more rounded corners' },
  { match: /sharp|serious|bank|legal|formal/i, label: 'Sharper', values: { radius: '2px' }, why: 'almost square corners' },
  { match: /dense|compact|data|dashboard/i, label: 'Denser', values: { baseText: '14px', radius: '6px' }, why: 'smaller text, tighter corners' },
]

const state = {
  on: new Set(['tailwind', 'daisyui']),
  show: 'daisyui',
  values: { brand: '#0b6e8a', onBrand: '#ffffff', page: '#f7f9fa', surface: '#ffffff',
    ink: '#16181c', inkMuted: '#5c6b72', line: '#dfe2e7', radius: '10px', baseText: '16px' },
}

/* ── the frames ───────────────────────────────────────────────────────────── */
$('#frames').innerHTML = ORDER.map((id) =>
  `<iframe id="f_${id}" hidden title="${KITS[id].name}" srcdoc="${
    `<!doctype html><meta charset=utf-8><style>${CSS[id] ?? ''}</style><style id=live></style><body>${WALLS[id] ?? ''}`
      .replace(/"/g, '&quot;')}"></iframe>`).join('')

/* Only the kits a running page CAN change get changed live. Bootstrap compiles
   its brand and Material derives its scheme, so those two say so instead of
   quietly showing yesterday's build. */
const LIVE_BRAND = { tailwind: true, daisyui: true, shadcn: true, bootstrap: false, material: false }

function paint() {
  const kits = ORDER.filter((k) => state.on.has(k))
  const routed = route(state.values, kits, KITS)
  for (const r of routed) {
    const f = $('#f_' + r.kit)
    if (!f) continue
    const live = f.contentDocument?.getElementById('live')
    if (!live) continue
    let vars = { ...r.vars }
    /* Material's other 46 roles come from its own generator, pre-derived here
       for the seeds we shipped; an unseen seed keeps the last derived scheme
       and the note says the download will carry the right one. */
    if (r.kit === 'material') Object.assign(vars, DERIVED.light ?? {})
    live.textContent = `:root{${Object.entries(vars).map(([k, v]) => `${k}:${v}`).join(';')}}`
  }
  for (const id of ORDER) $('#f_' + id).hidden = id !== state.show
  receipt(routed)
}

/* ── the band ─────────────────────────────────────────────────────────────── */
$('#kits').innerHTML = ORDER.map((id) => `<button class="kit" data-k="${id}" aria-pressed="${state.on.has(id)}">
  <i></i><b>${KITS[id].name}</b><small>${KITS[id].layer === 'utility' ? 'utilities' : KITS[id].standalone ? 'standalone' : 'on Tailwind'}</small></button>`).join('')
$('#kits').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  const id = b.dataset.k
  state.on.has(id) ? state.on.delete(id) : state.on.add(id)
  if (!state.on.size) state.on.add(id)
  if (!state.on.has(state.show)) state.show = [...state.on].at(-1)
  sync(); paint()
})

$('#swatches').innerHTML = SWATCH.map((r) => `<label class="sw" title="${r.what}">
  <input type="color" data-r="${r.id}" value="${state.values[r.id]}">
  <span>${r.label}</span><code data-hex="${r.id}">${state.values[r.id]}</code></label>`).join('')
$('#swatches').addEventListener('input', (e) => {
  state.values[e.target.dataset.r] = e.target.value
  $(`[data-hex="${e.target.dataset.r}"]`).textContent = e.target.value
  paint()
})

$('#knobs').innerHTML = LENGTHS.map((k) => {
  const role = ROLES.find((r) => r.id === k.id)
  return `<div class="knob"><label for="k_${k.id}">${role.label}<b data-v="${k.id}">${state.values[k.id]}</b></label>
    <input id="k_${k.id}" type="range" data-r="${k.id}" min="${k.min}" max="${k.max}" step="${k.step}" value="${parseInt(state.values[k.id])}"></div>`
}).join('')
$('#knobs').addEventListener('input', (e) => {
  const k = LENGTHS.find((x) => x.id === e.target.dataset.r)
  state.values[k.id] = e.target.value + k.unit
  $(`[data-v="${k.id}"]`).textContent = state.values[k.id]
  paint()
})

$('#chips').innerHTML = BRIEFS.map((b) => `<button class="chip" data-b="${b.label}" aria-pressed="false">${b.label}</button>`).join('')
const applyBrief = (b) => {
  Object.assign(state.values, b.values)
  sync(); paint()
  note(`<b>${b.label}</b> — ${b.why}. Every value it moved is a knob you can still turn.`)
}
$('#chips').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return
  const b = BRIEFS.find((x) => x.label === btn.dataset.b)
  ;[...$('#chips').children].forEach((c) => c.setAttribute('aria-pressed', c === btn))
  applyBrief(b)
})
$('#brief').addEventListener('change', (e) => {
  const hit = BRIEFS.find((b) => b.match.test(e.target.value))
  if (hit) applyBrief(hit)
  else if (e.target.value.trim()) note('Nothing in that matched a setting yet — the words it knows are on the chips.')
})

$('#shuffle').addEventListener('click', shuffle)
addEventListener('keydown', (e) => { if (e.key === 's' && !/input|textarea/i.test(e.target.tagName)) shuffle() })
function shuffle() {
  /* Within the floors, always — and with the SAME maths the export uses, not a
     hand-rolled HSL twin. A shuffle that can hand you an unreadable combination
     is a shuffle nobody can trust; that is the whole difference between this and
     a random palette. */
  const hue = Math.floor(Math.random() * 360)
  const brand = oklchToHex(0.42 + Math.random() * 0.16, 0.10 + Math.random() * 0.09, hue)
  const greys = okNeutralScale(hue, 20 + Math.random() * 40, false, Math.random() < 0.25, 1).map(oklchStrToHex)
  Object.assign(state.values, {
    brand, onBrand: readableInk(brand),
    page: greys[1], surface: greys[0], line: greys[5], inkMuted: greys[10] ?? greys.at(-3), ink: greys.at(-1),
    radius: [2, 6, 10, 16][Math.floor(Math.random() * 4)] + 'px',
  })
  sync(); paint()
  const bad = auditContrast(state.values).filter((p) => !p.passes)
  note(bad.length
    ? `Rolled <b>${nameColor(brand)}</b> — ${bad.length} pair${bad.length > 1 ? 's are' : ' is'} under its floor. Use this kit shows which.`
    : `Rolled <b>${nameColor(brand)}</b> — every contrast pair clears its floor.`)
}

function sync() {
  for (const el of document.querySelectorAll('[data-r]')) {
    const v = state.values[el.dataset.r]
    if (el.type === 'color') { el.value = v; $(`[data-hex="${el.dataset.r}"]`).textContent = v }
    else { el.value = parseInt(v); $(`[data-v="${el.dataset.r}"]`).textContent = v }
  }
  for (const b of $('#kits').children) b.setAttribute('aria-pressed', state.on.has(b.dataset.k))
  segment()
}

function segment() {
  const comps = ORDER.filter((k) => KITS[k].layer === 'components' && state.on.has(k))
  const opts = comps.length ? comps : ORDER.filter((k) => state.on.has(k))
  if (!opts.includes(state.show)) state.show = opts[0]
  $('#seg').innerHTML = opts.map((id) =>
    `<button role="radio" data-s="${id}" aria-checked="${id === state.show}">${KITS[id].name}</button>`).join('')
}
$('#seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  state.show = b.dataset.s; segment(); paint()
})

const note = (html) => ($('#wallnote').innerHTML = html)

/* ── the receipt ──────────────────────────────────────────────────────────── */
function receipt(routed) {
  const kits = routed.map((r) => KITS[r.kit].name).join(' + ')
  const lic = [...new Set(routed.map((r) => KITS[r.kit].license).filter(Boolean))].join(' · ')
  const clash = collisions(routed, KITS)
  $('#receipt').innerHTML = `<b>${kits}</b>
    <span>${SCENES.length} scenes · ${PARTS.length} parts</span>
    <span>${lic}</span>
    ${clash.length ? `<span style="color:#ffd8a8">${clash.length} name${clash.length > 1 ? 's' : ''} two kits both use</span>`
      : `<span class="ok">${ico('check', 12)}no name clashes</span>`}`

  const needs = routed.filter((r) => !LIVE_BRAND[r.kit] && state.show === r.kit)
  note(needs.length
    ? `<b>${KITS[state.show].name}</b> — ${state.show === 'bootstrap'
        ? 'its brand is compiled by Sass, so this frame shows the build we made. Your download carries the Sass line that changes it.'
        : 'it derives its colours from the seed with its own generator, so this frame shows a pre-derived scheme. Your download carries the seed.'}`
    : '')
}

/* ── the two outputs ──────────────────────────────────────────────────────── */
const files = () => generate(state.values, ORDER.filter((k) => state.on.has(k)), KITS)
const grab = (name, body, type = 'text/plain') => {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([body], { type }))
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000)
}

/* Nothing downloads until you have seen what it is.
 *
 * The old sandbox got this right and the first version here threw it away:
 * pressing Export dropped five files into someone's Downloads folder with no
 * account of what they were. A package you have not read is a package you do
 * not trust — and the two things worth reading are the contrast audit and the
 * list of what this system CANNOT express. */
const DESTS = [
  { t: 'Everything', d: 'one .zip — theme, install, manifest, agent brief', go: (f) =>
      grab('design-system.zip', zip(plain(f)), 'application/zip') },
  { t: 'Just the theme', d: 'theme.css, to drop in next to your kits', go: (f) => grab('theme.css', f['theme.css']) },
  { t: 'For a coding agent', d: 'DESIGN-SYSTEM.md — what it is and what not to invent', go: (f) => grab('DESIGN-SYSTEM.md', f['DESIGN-SYSTEM.md']) },
  { t: 'The manifest', d: 'versions, licences, and what could not be done', go: (f) => grab('MANIFEST.md', f['MANIFEST.md']) },
]
const plain = (f) => Object.fromEntries(Object.entries(f).filter(([k, v]) => !k.startsWith('_') && typeof v === 'string'))

function openSheet() {
  const f = files()
  const on = ORDER.filter((k) => state.on.has(k))
  const audit = auditContrast(state.values)
  const bad = audit.filter((p) => !p.passes)

  $('#sum').textContent = `${Object.keys(state.values).length} settings · ${on.length} kit${on.length > 1 ? 's' : ''} · ${Object.keys(plain(f)).length} files`

  $('#facts').innerHTML = [
    ...ROLES.filter((r) => state.values[r.id] != null).map((r) => `<span class="fact">${
      r.kind === 'colour' ? `<i style="background:${state.values[r.id]}"></i>` : ''}${r.label} <b>${state.values[r.id]}</b></span>`),
    ...on.map((k) => `<span class="fact">${KITS[k].name} <b>${KITS[k].version ?? 'live'}</b></span>`),
  ].join('')

  $('#dests').innerHTML = DESTS.map((d, i) => `<button class="dest" data-d="${i}"><b>${d.t}</b><span>${d.d}</span></button>`).join('')

  $('#clabel').textContent = `Contrast — ${audit.length - bad.length} of ${audit.length} pairs clear their floor`
  $('#pairs').innerHTML = audit.map((p) => `<li${p.passes ? '' : ' data-bad'}>
    <span class="${p.passes ? 'ok' : 'no'}">${p.passes ? '✓' : '✗'}</span>
    <span>${p.label}</span><em>${p.ratio}:1</em></li>`).join('')

  const cav = section(f['MANIFEST.md'], '## What could not be done')
    .map((l) => l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>'))
  $('#csection').hidden = !cav.length
  $('#caveats').innerHTML = cav.map((c) => `<li>${c}</li>`).join('')
  $('#sheet').showModal()
}
$('#dests').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  DESTS[Number(b.dataset.d)].go(files())
})
$('#download').addEventListener('click', openSheet)
$('#manifest').addEventListener('click', openSheet)
$('#sheetx').addEventListener('click', () => $('#sheet').close())

sync()
addEventListener('load', () => setTimeout(paint, 60))
</script>
