<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design System Generator</title>
<style>
/* THE CHROME'S OWN TOKENS.
 *
 * Not generated by this tool and not taken from any kit it offers: the moment
 * the interface wears shadcn, it has expressed a preference it claims not to
 * have. And the wall changes its look on every click, so the page around it has
 * to be quiet ground — a gallery paints its walls grey for the same reason.
 *
 * Warm off-white, a neutral ramp with a green cast, olive for anything that is
 * a link or an accent, near-black for the one action that commits. */
:root{
  --ground:#efeee9; --panel:#fff; --sunken:#e6ebe6; --faint:#f6faf6;
  --ink:#0a0f09; --muted:#60665f; --line:#d8ddd8;
  --brand:#6c7f00; --link:#4a5a00; --go:#0a0f09;
  --warn-bg:#fdf8e8; --warn-line:#f0e3b8;
  --r:7px; --r-sm:4px; --bw:1px;
  --fs-xs:10px; --fs-sm:11.5px; --fs-md:12.5px; --fs-lg:13.5px; --fs-xl:19px; --fs-2xl:24px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{min-height:100vh;display:grid;grid-template-columns:322px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:12px;padding:12px}
.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
kbd{font:10px/1 ui-monospace,monospace;padding:2px 5px;border-radius:var(--r-sm);background:var(--sunken);color:var(--muted)}

/* everything floats on the ground — no full-width bars */
.rail,.wall,.dock{background:var(--panel);border-radius:var(--r)}
.dock{grid-column:1/-1}

/* ── the rail ─────────────────────────────────────────────────────────────── */
/* Ten swatches, two type cards and three sliders in one horizontal band was a
 * wall of controls with no shape. They are the same controls, grouped by the
 * question they answer, each group able to fold away behind a line that still
 * says what is in it. */
.rail{padding:12px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;max-height:calc(100vh - 24px);scrollbar-width:thin}
.wm{flex:none}
.mark{--wm-glyph:var(--panel);color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;margin:0 0 2px;font-weight:600;letter-spacing:-.01em;font-size:13.5px}
.brief{display:flex;align-items:center;gap:9px;height:34px;padding:0 11px;border-radius:var(--r);background:var(--sunken);color:var(--muted)}
.brief input{flex:1;border:0;background:0;font:inherit;font-size:12.5px;color:var(--ink);outline:0;min-width:0}
.rail__acts{display:flex;align-items:center;gap:6px}
/* one scrolling row, not three wrapped ones: in a 322px rail the brief presets
   pushed Shape & space below the fold on a laptop screen */
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none}
.chip,.btn{font:inherit;font-size:12.5px;font-weight:500;min-height:34px;padding:0 11px;border-radius:var(--r);
           border:var(--bw) solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
           display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed=true]{background:var(--sunken);border-color:transparent;font-weight:600}
.btn--ghost{border-color:transparent;background:0;color:var(--muted)}
.btn--go{background:var(--go);color:#fff;border-color:var(--go);font-weight:600}

.grp{border-top:var(--bw) solid var(--line);padding-top:8px}
/* sticky, because the rail scrolls: the header you would fold has to still be
   reachable when you are three groups down. */
.grp summary{display:flex;align-items:baseline;gap:8px;cursor:pointer;list-style:none;padding:4px 0;min-height:24px;
             position:sticky;top:0;background:var(--panel);z-index:1}
.grp summary::-webkit-details-marker{display:none}
.grp__name{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;flex:none}
.grp__sum{margin-left:auto;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.grp[open] .grp__sum{opacity:0}
.grp__dots{display:flex;gap:3px;align-items:center;justify-content:flex-end}
.grp__dots i{width:11px;height:11px;border-radius:var(--r-sm);display:block;border:var(--bw) solid var(--line)}

/* The stack, as a card you read rather than a list you operate.
 *
 * Eight kits as always-open slabs filled a third of the rail to answer a
 * question most people answer once. It is a summary now, and the choosing
 * happens in a picker that has room to explain what a base is. */
.grp--flat{border-top:var(--bw) solid var(--line);padding-top:8px}
.grp__head{display:flex;align-items:baseline;gap:8px;margin:0 0 7px;padding:4px 0}
.link{font:inherit;font-size:var(--fs-sm);color:var(--link);background:0;border:0;padding:0;cursor:pointer;
      margin-left:auto;text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--ink)}
.card{border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--faint);padding:10px 11px}
.card__layer{display:flex;align-items:baseline;gap:7px;font-size:var(--fs-lg)}
.card__layer b{font-weight:600}
.card__layer small{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card__facts{margin:7px 0 0;font-size:var(--fs-sm);color:var(--muted)}
.note{margin:8px 0 0;padding:9px 10px;border-radius:var(--r);font-size:var(--fs-sm);line-height:1.5;
      background:var(--warn-bg);border:var(--bw) solid var(--warn-line);color:var(--ink)}

/* ── the picker ───────────────────────────────────────────────────────────── */
/* its own rules, not an override of .pick — that one is a left-hand drawer and
   is defined further down, so every property here lost the tie */
#picker{border:0;padding:0;background:0;max-width:none;max-height:none;width:100%;height:100%}
#picker::backdrop{background:#0a0f0955}
.picker{position:fixed;inset:20px;margin:auto;width:min(1020px,calc(100vw - 40px));max-height:calc(100vh - 40px);
        background:var(--panel);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;
        box-shadow:0 24px 60px rgba(0,0,0,.24)}
.lanes{display:grid;grid-template-columns:1fr 1fr .8fr;gap:14px;overflow-y:auto;min-height:0}
.lane{display:flex;flex-direction:column;gap:7px;min-width:0}
.lane--sum{background:var(--faint);border:var(--bw) solid var(--line);border-radius:var(--r);padding:12px}
.lane__top{margin:0;font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:600;display:flex;gap:7px;align-items:baseline}
.lane__top small{font-size:var(--fs-xs);letter-spacing:0;text-transform:none;color:var(--muted);font-weight:400}
.lane__top--sub{margin-top:10px;padding-top:10px;border-top:var(--bw) solid var(--line)}
.lane__why{margin:0 0 3px;font-size:var(--fs-sm);color:var(--muted);line-height:1.5}
.lane__list{display:flex;flex-direction:column;gap:7px}
.lane__fine{margin:0;font-size:var(--fs-xs);color:var(--muted);line-height:1.5;text-align:center}
.opt{font:inherit;text-align:left;border:var(--bw) solid var(--line);background:var(--panel);border-radius:var(--r);
     padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.opt[disabled]{opacity:.45;cursor:not-allowed;background:var(--faint)}
.opt[disabled]:hover{border-color:var(--line)}
.opt__top{display:flex;align-items:baseline;gap:8px}
.opt__top b{font-size:var(--fs-lg);font-weight:600}
.opt__meta{margin-left:auto;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.opt__why{font-size:var(--fs-sm);color:var(--muted);line-height:1.45}
.opt__tag{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--brand)}
.sumrow{display:flex;align-items:baseline;gap:7px;font-size:var(--fs-md);padding:3px 0}
.sumrow small{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:auto}

/* The families the stack publishes, as ramps you can browse. Not a palette we
   chose — Tailwind ships seventeen, Radix thirty-one, and the row changes with
   the stack because the offer is theirs. */
.sub{margin:6px 0 0;font-size:var(--fs-xs);color:var(--muted)}
.pals{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:6px;padding-bottom:2px}
.pals::-webkit-scrollbar{display:none}
.pal{flex:none;border:var(--bw) solid var(--line);background:var(--panel);border-radius:var(--r-sm);
     padding:4px 5px 3px;cursor:pointer;display:flex;flex-direction:column;gap:3px;width:60px}
.pal:hover{border-color:var(--ink)}
.pal[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.pal__ramp{display:flex;height:14px;border-radius:2px;overflow:hidden}
.pal__ramp i{flex:1}
.pal__name{font-size:9px;color:var(--muted);text-align:center;text-transform:capitalize;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.sw{display:flex;flex-direction:column;gap:4px}
.sw input{-webkit-appearance:none;appearance:none;border:0;padding:0;height:30px;width:100%;border-radius:var(--r);cursor:pointer;background:0}
.sw input::-webkit-color-swatch-wrapper{padding:0}
.sw input::-webkit-color-swatch{border:var(--bw) solid var(--line);border-radius:var(--r)}
.sw span{font-size:9.5px;font-weight:600;line-height:1.15}
.sw code{font-size:9px;color:var(--muted);font-family:ui-monospace,monospace}

.typo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.font{font:inherit;text-align:left;border:var(--bw) solid var(--line);background:var(--panel);border-radius:var(--r);
      padding:7px 10px 8px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-height:62px;overflow:hidden}
.font:hover{border-color:var(--ink)}
.font__role{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.font__name{font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font__from{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font:inherit;font-size:10.5px;color:var(--muted);border:0;background:0;cursor:pointer;
      display:inline-flex;align-items:center;gap:5px;padding:6px 0 0;align-self:flex-start}
.mini:hover{color:var(--ink)}

.knobs{display:grid;gap:9px;margin-top:7px}
.knob label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.knob b{color:var(--ink);font-family:ui-monospace,monospace;font-size:11px}
.knob input[type=range]{width:100%;accent-color:var(--ink);min-height:22px}

.wall{min-width:0;padding:12px 14px;display:flex;flex-direction:column}
.wall__bar{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.wall__count{margin-left:auto}
.wall__count{margin:0;font-size:11.5px;color:var(--muted)}
.wall__count b{color:var(--ink);font-weight:600}
.frames{flex:1;min-height:0}
.frames iframe{width:100%;height:100%;min-height:480px;border:0;border-radius:var(--r);background:#fff;display:block}
.frames iframe[hidden]{display:none}
.wall__note{margin:9px 0 0;font-size:11.5px;color:var(--muted);min-height:17px}
.wall__note b{color:var(--ink);font-weight:600}

.dock{position:sticky;bottom:12px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dock__what{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;align-items:center;color:var(--muted)}
.dock__what b{color:var(--ink);font-weight:600}
.dock__what .ok{display:inline-flex;align-items:center;gap:6px}
.dock__acts{display:flex;gap:6px}

dialog{border:0;border-radius:var(--r);padding:0;max-width:min(720px,92vw);background:var(--panel)}
dialog::backdrop{background:#1c1b1966}
/* ── the export drawer ────────────────────────────────────────────────────── */
/* It rises out of the dock instead of covering the page, because what you are
 * deciding is whether the thing on the wall is the thing you want — and a modal
 * takes the wall away at exactly that moment. */
.drawer{position:fixed;left:12px;right:12px;bottom:12px;max-height:min(560px,calc(100vh - 96px));
        background:var(--panel);border-radius:var(--r);box-shadow:0 -8px 40px rgba(10,15,9,.18);
        border:var(--bw) solid var(--line);display:flex;flex-direction:column;z-index:30;
        animation:rise .16s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer[hidden]{display:none}
.drawer__top{display:flex;align-items:center;gap:14px;padding:11px 14px;border-bottom:var(--bw) solid var(--line)}
.drawer__name{display:flex;align-items:baseline;gap:8px}
.drawer__name input{font:inherit;font-size:var(--fs-lg);font-weight:600;color:var(--ink);
                    border:var(--bw) solid transparent;border-radius:var(--r-sm);background:0;padding:3px 6px;min-width:150px}
.drawer__name input:hover{border-color:var(--line)}
.drawer__name input:focus{border-color:var(--brand);outline:0}
.drawer__sum{margin:0;font-size:var(--fs-sm);color:var(--muted)}
.drawer__top .btn{margin-left:auto}
.drawer__cols{display:grid;grid-template-columns:1.35fr .95fr;gap:14px;padding:12px 14px 14px;overflow:hidden;min-height:0}
.drawer__file{display:flex;flex-direction:column;gap:8px;min-width:0}
.filehead{display:flex;align-items:baseline;gap:10px;font-size:var(--fs-sm);color:var(--muted)}
.filehead .link{margin-left:auto}
.filebody{margin:0;flex:1;overflow:auto;background:var(--faint);border:var(--bw) solid var(--line);
          border-radius:var(--r);padding:11px 13px;font:11.5px/1.65 ui-monospace,Menlo,monospace;
          color:var(--ink);white-space:pre-wrap;word-break:break-word;scrollbar-width:thin}
.drawer__side{display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:0;scrollbar-width:thin}
.tree{list-style:none;margin:0;padding:9px 11px;background:var(--faint);border:var(--bw) solid var(--line);
      border-radius:var(--r);font:11.5px/1.8 ui-monospace,Menlo,monospace}
.tree li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree span{color:var(--muted)}
.fine{margin:0;font-size:var(--fs-sm);color:var(--muted);line-height:1.55}
@media(max-width:900px){.drawer__cols{grid-template-columns:1fr}.drawer{max-height:calc(100vh - 24px)}}

.sheet{padding:20px 22px;position:relative}
.sheet__x{position:absolute;top:12px;right:12px;border:0;background:0;cursor:pointer;color:var(--muted);min-height:36px;min-width:36px;border-radius:var(--r)}
.sheet__x:hover{background:var(--sunken)}
.sheet h2{margin:0;font-size:17px;letter-spacing:-.01em}
.sheet__top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.sheet__sum{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.sheet section{margin-bottom:18px}
.sheet section .eyebrow{margin-bottom:9px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:6px 10px;border-radius:var(--r);background:var(--sunken)}
.fact i{width:11px;height:11px;border-radius:var(--r-sm);flex:none;font-style:normal;border:1px solid #0000001a}
.fact b{font-weight:600}
.dests{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dest--wide{grid-column:1/-1}
.dest{text-align:left;font:inherit;border:var(--bw) solid var(--line);background:var(--panel);border-radius:var(--r);
      padding:11px 13px;cursor:pointer;min-height:56px;display:flex;flex-direction:column;gap:2px}
.dest:hover{background:var(--sunken)}
.dest b{font-size:13px;font-weight:600}
.dest span{font-size:11.5px;color:var(--muted);line-height:1.4}
.pairs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5px 16px}
.pairs li{display:grid;grid-template-columns:13px 1fr max-content;gap:8px;align-items:baseline;font-size:12px}
.pairs .ok{color:#1e6b37;font-weight:700}
.pairs .no{color:#8e2c21;font-weight:700}
.pairs em{font-style:normal;color:var(--muted);font-family:ui-monospace,monospace;font-size:11.5px}
.pairs li[data-bad] em{color:#8e2c21;font-weight:600}
.sheet h3{margin:15px 0 6px;font-size:12.5px}
.sheet p,.sheet li{font-size:12.5px;line-height:1.55;color:var(--muted)}
.sheet ul{margin:0;padding-left:17px}
.sheet code{font-family:ui-monospace,monospace;font-size:11.5px;background:var(--sunken);padding:1px 5px;border-radius:var(--r-sm);color:var(--ink)}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .rail{max-height:none}.dock{grid-column:auto}}
</style>
<!--BODY-->
<script type="module">
/*MODULES*/
const KITS = /*KITS*/;
const CSS = /*CSS*/;
const DERIVED = /*DERIVED*/;
const WALLS = /*WALLS*/;
const SCRIPTS = /*SCRIPTS*/;
const OWN = /*OWN*/;
const RENDERS = /*RENDERS*/;
const DARKSWITCH = /*DARK*/;
const FONTS = /*FONTS*/;
const SEEDS = /*SEEDS*/;
const ICONS = /*ICONS*/;
const ico = (n, s = 13) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] ?? ''}</svg>`

const $ = (s) => document.querySelector(s)
const ORDER = ['openprops', 'tailwind', 'daisyui', 'shadcn', 'bootstrap', 'material', 'radix', 'mantine']
const SWATCH = ROLES.filter((r) => r.kind === 'colour')
const TYPE = ROLES.filter((r) => r.kind === 'font')
/* Each slider stores what the ROLE wants and shows what a person reads. The
 * factor is the only thing that differs: spacing is a multiple shown as a
 * percentage, letter spacing is thousandths of an em, a weight is just itself. */
const LENGTHS = [
  { id: 'radius', min: 0, max: 24, step: 1, unit: 'px', factor: 1, group: 'shape' },
  { id: 'borderWidth', min: 0, max: 4, step: 1, unit: 'px', factor: 1, group: 'shape' },
  { id: 'space', min: 80, max: 150, step: 5, unit: '', factor: 100, pct: true, group: 'shape' },
  { id: 'elevation', min: 0, max: 250, step: 10, unit: '', factor: 100, pct: true, group: 'shape' },
  { id: 'baseText', min: 14, max: 20, step: 1, unit: 'px', factor: 1, group: 'type' },
  { id: 'lineHeight', min: 110, max: 200, step: 5, unit: '', factor: 100, group: 'type' },
  { id: 'letterSpacing', min: -50, max: 100, step: 5, unit: 'em', factor: 1000, group: 'type' },
  { id: 'fontWeight', min: 300, max: 900, step: 100, unit: '', factor: 1, group: 'type' },
]
const store = (k, n) => `${Number((Number(n) / k.factor).toFixed(4))}${k.unit}`
const shown = (k, v) => (k.pct ? `${Math.round(parseFloat(v) * 100)}%` : String(v))
const slider = (k, v) => Math.round(parseFloat(v) * k.factor)

/* A brief is not a prompt: these words map to numbers a standard already names,
   and the page SHOWS what they moved. No model, nothing to explain away. */
const BRIEFS = [
  { match: /older|elderly|accessib|readab|low vision/i, label: 'Readable',
    values: { baseText: '18px', radius: '8px', space: '1.15' }, why: 'larger body text, calmer corners, more room' },
  { match: /round|soft|friendly|playful/i, label: 'Rounder', values: { radius: '18px' }, why: 'more rounded corners' },
  { match: /sharp|serious|bank|legal|formal/i, label: 'Sharper', values: { radius: '2px' }, why: 'almost square corners' },
  { match: /dense|compact|data|dashboard/i, label: 'Denser', values: { baseText: '14px', radius: '6px', space: '0.85' }, why: 'smaller text, tighter corners, less room' },
  { match: /roomy|airy|spacious|calm|breath/i, label: 'Roomier', values: { space: '1.3' }, why: 'more room between everything' },
]

const state = {
  /* A stack, not a basket: Tailwind carries shadcn's components. `show` is
     never chosen — it is whichever layer is on top. */
  on: new Set(['tailwind', 'shadcn']),
  get show() { return showing(stack(this.on, KITS)) },
  rung: 'all',
  mode: 'light',
  values: { brand: '#0b6e8a', onBrand: '#ffffff', page: '#f7f9fa', surface: '#ffffff',
    ink: '#16181c', inkMuted: '#5c6b72', line: '#dfe2e7', radius: '10px', baseText: '16px', space: '1', elevation: '1',
    lineHeight: '1.5', letterSpacing: '0em', fontWeight: '600', borderWidth: '1px',
    /* filled in below from whichever kit publishes one */
    success: '', warning: '', danger: '',
    /* seeded from what the base kit publishes, not from a face we like */
    fontHeading: '', fontBody: '' },
}

/* ── the frames ───────────────────────────────────────────────────────────── */
useMantineClasses(KITS.mantine.classes)

/* Seven kits' real stylesheets is two megabytes of CSS, and Radix alone is
 * eight hundred kilobytes. Writing every frame's document up front made the
 * browser parse all of it to show one. A frame is built the first time you
 * actually look at it. */
$('#frames').innerHTML = RENDERS.map((id) =>
  `<iframe id="f_${id}" hidden title="${KITS[id].name}"></iframe>`).join('')

const BUILT = new Set()
function build(id) {
  if (BUILT.has(id)) return
  BUILT.add(id)
  const f = $('#f_' + id); if (!f) return
  f.srcdoc = `<!doctype html><meta charset=utf-8><style>${CSS[id] ?? ''}</style><style id=live></style><style id=rung></style><body>${WALLS[id] ?? ''}`
  if (SCRIPTS[id]) {
    /* Material's components are code, injected rather than written into srcdoc:
     * inside an attribute every quote in 260 kB of their code becomes six
     * characters, and the page went from 513 kB to 1.2 MB. */
    const run = () => {
      const d = f.contentDocument; if (!d || d.getElementById('kit-elements')) return
      const s = d.createElement('script')
      s.type = 'module'; s.id = 'kit-elements'; s.textContent = SCRIPTS[id]
      d.body.appendChild(s)
    }
    f.addEventListener('load', run)
  }
  f.addEventListener('load', paint)
}

/* Only the kits a running page CAN change get changed live. Bootstrap compiles
   its brand and Material derives its scheme, so those two say so instead of
   quietly showing yesterday's build. */
const LIVE_BRAND = { tailwind: true, daisyui: true, shadcn: true, bootstrap: false, material: false,
  radix: true, mantine: true, openprops: true }

function paint() {
  const kits = ORDER.filter((k) => state.on.has(k))
  const routed = darken(route(state.values, kits, KITS), KITS)
  /* A frame shows a STACK, so it carries every layer's variables, bottom-up.
     Giving it only the top layer's meant shadcn's frame never saw Tailwind's
     --font-sans, and the font knobs moved the card and nothing else. A tokens
     layer belongs under all of it, which is what it does in your app. */
  const st = stack(state.on, KITS)
  const below = (id) => st.order.slice(0, st.order.indexOf(id) + 1)
  /* A frame carries its whole stack, bottom-up — but a lower layer may NOT
   * overwrite a name the shown kit publishes itself.
   *
   * shadcn's --border is a colour and daisyUI's --border is a WIDTH. The
   * collision was already detected and reported; once the frame started
   * carrying every layer (so shadcn could see Tailwind's --font-sans), it also
   * started happening: daisyUI's buttons got a border of `#dfe2e7 solid` and
   * rendered at 3px instead of 1. A variable the kit you are looking at
   * publishes is that kit's to own. */
  const varsOf = (ids, dark) => {
    const top = ids.at(-1)
    const mine = KITS[top]?.modes?.light ?? {}
    const out = {}
    for (const k of ids) {
      const r = routed.find((x) => x.kit === k)
      const from = (dark && r?.dark) ? r.dark : r?.vars ?? {}
      for (const [name, value] of Object.entries(from)) {
        if (k !== top && mine[name] !== undefined) continue
        out[name] = value
      }
    }
    return out
  }
  for (const r of routed) {
    const f = $('#f_' + r.kit)
    if (!f) continue
    const live = f.contentDocument?.getElementById('live')
    if (!live) continue
    /* Radix takes attributes, not values: its accent, grey, radius and scaling
       are set on the theme root the way its <Theme> would set them. */
    const root = f.contentDocument.documentElement
    for (const [a, v] of Object.entries(r.attrs ?? {})) root.setAttribute(a, v)
    /* and the kit's own dark switch, plus colour-scheme so its form controls,
       scrollbars and default text follow */
    const wantDark = state.mode === 'dark' && !!DARKSWITCH[r.kit]
    DARK_ROOT[r.kit]?.(root, wantDark)
    root.style.colorScheme = wantDark ? 'dark' : 'light'
    /* and its per-element tones, which live in the markup rather than in a
       variable — the wall is built once, so they are re-tuned in place */
    for (const c of r.chosen ?? []) {
      if (c.attr !== 'tone') continue
      for (const el of f.contentDocument.querySelectorAll(`[data-tone="${c.role}"]`)) el.setAttribute('data-accent-color', c.picked)
    }
    /* five scenes at once is a wall you scroll rather than one you read, so
       each section carries its rung and the frame is told which to show. The
       markup is built once; only this one rule changes. */
    const rung = f.contentDocument.getElementById('rung')
    if (rung) rung.textContent = state.rung === 'all' ? ''
      : `main > section:not([data-rung="${state.rung}"]){display:none}`
    /* the chosen face has to exist inside the frame too, or the wall shows the
       fallback while the card shows the family */
    for (const role of TYPE) loadFace(f.contentDocument, familyOf(state.values[role.id]))
    let vars = varsOf(below(r.kit), state.mode === 'dark')
    /* Material's other 46 roles come from its own generator, pre-derived here
       for the seeds we shipped; an unseen seed keeps the last derived scheme
       and the note says the download will carry the right one.
       UNDER the routed values, not over them: its generator emits an error role
       too, and applying the scheme last quietly replaced the danger colour you
       picked with the one M3 computed. Its own API takes a custom error, so the
       knob is allowed to win — and the manifest says it did. */
    /* Material's other 46 roles come from its own generator, which produces a
       dark scheme as well as a light one. Applying the LIGHT scheme under a
       dark block left every surface light and every on-colour dark: readable
       nowhere. Their scheme for the mode you are in, then your values. */
    if (r.kit === 'material') vars = { ...(state.mode === 'dark' ? DERIVED.dark : DERIVED.light) ?? {}, ...vars }
    /* the same selector the generated file uses — a block only wins if it
       out-specifies the kit's own, which :root does not always do */
    live.textContent = `${scopeOf(r.kit)}{${Object.entries(vars).map(([k, v]) => `${k}:${v}`).join(';')}}`
  }
  build(state.show)
  for (const id of RENDERS) $('#f_' + id).hidden = id !== state.show
  receipt(routed)
}

/* ── the stack, as a card ─────────────────────────────────────────────────── */
/* What it IS, not what you could change it into. The choosing happens in the
 * picker, which has room to say what a base is; this says what you have. */
function renderStack() {
  const st = stack(state.on, KITS)
  const own = OWN[showing(st)] ?? {}
  $('#stackcard').innerHTML = st.order.map((id) => {
    const role = KITS[id].layer === 'tokens' ? 'under' : id === st.base ? 'base' : 'components'
    return `<span class="card__layer"><b>${KITS[id].name}</b><small>${role}</small></span>`
  }).join('')
    + `<p class="card__facts">${own.parts ? `${own.partsTheirs} of ${own.parts} parts from the kit · ` : ''}${
      [...new Set(st.order.map((k) => KITS[k].license).filter(Boolean))].join(' · ')}</p>`

  /* the parts this kit ships nothing for, named where you can still act on it */
  const drawn = own.drawn ?? []
  $('#stacknote').hidden = !drawn.length
  if (drawn.length) {
    $('#stacknote').textContent = `${drawn.length === 1 ? 'One part is' : `${drawn.length} parts are`} drawn from tokens because `
      + `${KITS[showing(st)].name} has no equivalent: ${drawn.join(', ')}.`
  }
}

/* ── the picker ───────────────────────────────────────────────────────────── */
/* Two lanes and a summary, because the stack has two questions and people ask
 * them in that order: what is underneath, and what draws the buttons. A kit
 * that cannot sit on the base you picked is shown greyed WITH the reason,
 * rather than hidden — the reason is the useful part. */
function drawStackPicker() {
  const st = stack(state.on, KITS)
  const carrier = foundationOf(KITS)
  const bases = ORDER.filter((id) => KITS[id].standalone || KITS[id].layer === 'utility')
  const comps = ORDER.filter((id) => !KITS[id].standalone && KITS[id].layer === 'components')
  const under = ORDER.filter((id) => KITS[id].layer === 'tokens')

  const card = (id, { on, disabled, why, tag }) => `<button class="opt" data-p="${id}"
    aria-pressed="${!!on}"${disabled ? ' disabled' : ''}>
    ${tag ? `<span class="opt__tag">${tag}</span>` : ''}
    <span class="opt__top"><b>${KITS[id].name}</b>
      <span class="opt__meta">${KITS[id].license ?? ''}${KITS[id].version ? ` · v${KITS[id].version}` : ''}</span></span>
    <span class="opt__why">${why}</span></button>`

  $('#laneBase').innerHTML = bases.map((id) => card(id, {
    on: st.base === id, tag: st.base === id ? 'base' : '',
    why: KITS[id].what,
  })).join('')
  $('#laneUnder').innerHTML = under.map((id) => card(id, {
    on: st.order.includes(id), tag: st.order.includes(id) ? 'added' : '',
    why: KITS[id].what,
  })).join('')
  $('#laneComp').innerHTML = comps.map((id) => {
    const fits = st.base === carrier
    return card(id, {
      on: st.layers.includes(id), tag: st.layers.includes(id) ? 'added' : '',
      disabled: false,
      why: fits ? KITS[id].what
        : `${KITS[id].what} — needs ${KITS[carrier].name}; picking it moves the base back.`,
    })
  }).join('')

  const own = OWN[showing(st)] ?? {}
  $('#pickerSum').innerHTML = st.order.map((id) => {
    const role = KITS[id].layer === 'tokens' ? 'under' : id === st.base ? 'base' : 'components'
    return `<p class="sumrow">${KITS[id].name}<small>${role}</small></p>`
  }).join('')
    + `<p class="card__facts">${own.parts ? `${own.partsTheirs} of ${own.parts} parts from the kit` : ''}</p>`
    + ((own.drawn ?? []).length ? `<p class="note">Not covered by this stack: ${own.drawn.join(', ')}. The generator draws those from tokens.</p>` : '')
}
$('#change').addEventListener('click', () => { drawStackPicker(); $('#picker').showModal() })
$('#pickerx').addEventListener('click', () => $('#picker').close())
$('#pickerDone').addEventListener('click', () => $('#picker').close())
$('#picker').addEventListener('click', (e) => { if (e.target.id === 'picker') $('#picker').close() })
document.querySelector('.lanes').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-p]'); if (!b || b.disabled) return
  state.on = toggle(state.on, b.dataset.p, KITS)
  sync(); paint(); drawStackPicker()
})

/* ── typography ───────────────────────────────────────────────────────────── */
/* Two published sources and no third. The kits publish system stacks — Open
 * Props alone names six — and Google publishes 1821 families with their own
 * category and popularity order. We add no list, no ranking and no favourites.
 *
 * A specimen is shown in its own face, which means loading it. Google's `text=`
 * parameter returns a font subset to just the pangram's glyphs, so a page of
 * forty specimens costs a few kilobytes rather than a few megabytes, and a face
 * is only fetched once it is actually scrolled into view. */
const PANGRAM = 'The five boxing wizards jump quickly together'
const GOOGLE = new Map(FONTS.google.map((f) => [f.family, f]))
const FALLBACK = { 'Sans Serif': 'sans-serif', Serif: 'serif', Display: 'sans-serif',
  Handwriting: 'cursive', Monospace: 'monospace' }
/* the stack we WRITE: their family, then the generic its own category names, so
   a face that fails to load still lands somewhere sane */
const stackFor = (f) => f.stack ? f.family : `'${f.family}', ${FALLBACK[f.category] ?? 'sans-serif'}`
const familyOf = (value) => String(value ?? '').split(',')[0].replace(/['"]/g, '').trim()

const loaded = new Set()
function loadFace(doc, family, { specimen = false } = {}) {
  if (!GOOGLE.has(family)) return
  const key = `${specimen ? 's' : 'f'}:${family}`
  const id = `gf-${key.replace(/[^a-z0-9]/gi, '-')}`
  if (doc.getElementById(id)) return
  const link = doc.createElement('link')
  link.rel = 'stylesheet'; link.id = id
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family).replace(/%20/g, '+')}`
    + (specimen ? `&text=${encodeURIComponent(PANGRAM)}` : ':wght@400;500;600;700') + '&display=swap'
  doc.head.appendChild(link)
  loaded.add(key)
}

function typoCards() {
  $('#typo').innerHTML = TYPE.map((r) => {
    const value = state.values[r.id]
    const fam = familyOf(value)
    const g = GOOGLE.get(fam)
    const stack = FONTS.stacks.find((s) => s.family === value)
    return `<button class="font" data-font="${r.id}">
      <span class="font__role">${r.label}</span>
      <span class="font__name" style="font-family:${value.replace(/"/g, '&quot;')}">${stack ? stack.name : fam}</span>
      <span class="font__from">${g ? `Google · ${(g.tags ?? []).length ? g.tags.join(' ') : g.category}${g.variable ? ' · variable' : ''}`
        : stack ? `${stack.from.join(', ')} · system stack` : 'system stack'}</span></button>`
  }).join('')
  for (const r of TYPE) loadFace(document, familyOf(state.values[r.id]))
}
/* ── which rung of the wall ───────────────────────────────────────────────── */
/* ── light or dark ────────────────────────────────────────────────────────── */
/* Each kit is switched with ITS OWN mechanism, read from the same table the
 * generated file uses: shadcn keys on .dark, Bootstrap on data-bs-theme,
 * Mantine on data-mantine-color-scheme, daisyUI on data-theme, Radix on
 * .dark-theme. A class of our own would be a dark mode their components never
 * see — which is precisely the mistake daisyUI's prefersdark taught. */
const DARK_ROOT = {
  shadcn: (el, on) => el.classList.toggle('dark', on),
  radix: (el, on) => { el.classList.toggle('dark', on); el.classList.toggle('light', !on) },
  bootstrap: (el, on) => el.setAttribute('data-bs-theme', on ? 'dark' : 'light'),
  mantine: (el, on) => el.setAttribute('data-mantine-color-scheme', on ? 'dark' : 'light'),
  daisyui: (el, on) => el.setAttribute('data-theme', on ? 'yourkitdark' : 'yourkit'),
}
function drawModes() {
  const kit = state.show
  const can = !!DARKSWITCH[kit]
  $('#modes').hidden = !can
  if (!can) { state.mode = 'light'; return }
  $('#modes').innerHTML = [['light', 'Light'], ['dark', 'Dark']]
    .map(([id, label]) => `<button role="radio" data-m="${id}" aria-checked="${id === state.mode}">${label}</button>`).join('')
}
$('#modes').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  state.mode = b.dataset.m; drawModes(); paint()
})

function drawRungs() {
  $('#rungs').innerHTML = RUNGS.map((r) =>
    `<button role="radio" data-g="${r.id}" aria-checked="${r.id === state.rung}">${r.label}</button>`).join('')
}
$('#rungs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  state.rung = b.dataset.g; drawRungs(); paint()
})

/* ── what each folded group still says ────────────────────────────────────── */
/* A group that folds away and takes its answer with it is a group nobody will
 * open twice. Collapsed, each one still shows what is in it. */
function summaries() {
  $('#sum_colour').innerHTML = SWATCH.slice(0, 6)
    .map((r) => `<i style="background:${state.values[r.id]}"></i>`).join('')
  $('#sum_type').textContent = TYPE.map((r) => {
    const fam = familyOf(state.values[r.id])
    return FONTS.stacks.find((s) => s.family === state.values[r.id])?.name ?? fam
  }).join(' · ')
  $('#sum_shape').textContent = LENGTHS.filter((k) => k.group === 'shape').map((k) => shown(k, state.values[k.id])).join(' · ')
}

$('#typo').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-font]'); if (!b) return
  openPicker(b.dataset.font)
})

/* ── the font picker ──────────────────────────────────────────────────────── */
let pickRole = 'fontBody', pickTab = 'kits'
const PAGE = 40
let pickShown = PAGE

function pickPool() {
  const q = $('#picksearch').value.trim().toLowerCase()
  const pool = pickTab === 'kits' ? FONTS.stacks : FONTS.google
  return q ? pool.filter((f) => (f.name ?? f.family).toLowerCase().includes(q)) : pool
}

const seeing = new IntersectionObserver((rows) => {
  for (const row of rows) {
    if (!row.isIntersecting) continue
    loadFace(document, row.target.dataset.family, { specimen: true })
    seeing.unobserve(row.target)
  }
}, { rootMargin: '200px' })

function drawPicker() {
  const pool = pickPool()
  const rows = pool.slice(0, pickShown)
  const current = state.values[pickRole]
  $('#picklist').innerHTML = rows.map((f) => {
    const stack = stackFor(f)
    return `<button class="spec" data-stack="${stack.replace(/"/g, '&quot;')}" data-family="${f.stack ? '' : f.family}"
      aria-pressed="${stack === current}">
      <span class="spec__line" style="font-family:${stack.replace(/"/g, '&quot;')}">${PANGRAM}</span>
      <span class="spec__meta">${f.stack ? `${f.name} — ${f.from.join(', ')} · no download`
        : `${f.family} · Google · ${(f.tags ?? []).length ? f.tags.join(' ') : f.category}${f.variable ? ' · variable' : ''}`}</span></button>`
  }).join('') + (pool.length > rows.length
    ? `<button class="btn" id="pickmore" style="width:100%">Show ${Math.min(PAGE, pool.length - rows.length)} more of ${pool.length}</button>` : '')
  for (const el of $('#picklist').querySelectorAll('[data-family]:not([data-family=""])')) seeing.observe(el)
  $('#picksum').textContent = pickTab === 'kits'
    ? `${FONTS.stacks.length} stacks the kits publish — nothing to download`
    : `${FONTS.google.length} families from Google's own list, most used first`
  $('#picknow').textContent = `Now: ${familyOf(current)}`
}

function openPicker(role) {
  pickRole = role; pickShown = PAGE
  $('#picksearch').value = ''
  $('#pickrole').textContent = ROLES.find((r) => r.id === role).label
  $('#picktabs').innerHTML = [['kits', 'From your kits'], ['google', 'Google Fonts']]
    .map(([id, label]) => `<button role="radio" data-t="${id}" aria-checked="${id === pickTab}">${label}</button>`).join('')
  drawPicker()
  $('#fontpick').showModal()
}
$('#picktabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  pickTab = b.dataset.t; pickShown = PAGE
  for (const x of $('#picktabs').children) x.setAttribute('aria-checked', x.dataset.t === pickTab)
  drawPicker()
})
$('#picksearch').addEventListener('input', () => { pickShown = PAGE; drawPicker() })
$('#picklist').addEventListener('click', (e) => {
  if (e.target.closest('#pickmore')) { pickShown += PAGE; return drawPicker() }
  const b = e.target.closest('.spec'); if (!b) return
  state.values[pickRole] = b.dataset.stack
  typoCards(); drawPicker(); paint()
})
$('#pickshuffle').addEventListener('click', () => {
  const pool = pickPool(); if (!pool.length) return
  const f = pool[Math.floor(Math.random() * Math.min(pool.length, 120))]
  state.values[pickRole] = stackFor(f)
  typoCards(); drawPicker(); paint()
})
/* Shuffling the type, without a taste of our own: both faces come from the top
 * of GOOGLE's own popularity order, and the body face is limited to the two
 * categories Google itself calls text categories. No pairing rules of ours. */
$('#typeshuffle').addEventListener('click', () => {
  const top = FONTS.google.slice(0, 120)
  /* Google classifies a face as Display, Handwriting, Monospace or Symbols, or
     leaves it unclassified — and unclassified is what a text face looks like in
     their data. Archivo Black is a Display face by their own reckoning, and it
     is not what anyone means by a body font. */
  const text = top.filter((f) => !(f.tags ?? []).length)
  const pick = (pool) => pool[Math.floor(Math.random() * pool.length)]
  state.values.fontHeading = stackFor(pick(top))
  state.values.fontBody = stackFor(pick(text))
  typoCards(); paint()
})

$('#pickx').addEventListener('click', () => $('#fontpick').close())
$('#fontpick').addEventListener('click', (e) => { if (e.target.id === 'fontpick') $('#fontpick').close() })

/* ── palette families ─────────────────────────────────────────────────────── */
/* Picking one writes seven roles at once: the extremes straight out of their
 * ramp, and the two in the middle — muted ink and the line — at the WCAG floor
 * for body text and for a non-text boundary, because those are the two taste
 * usually decides and a published bar is a better decider. */
let palAt = null, palNeutral = null, palShort = []
function renderPalettes() {
  const st = stack(state.on, KITS)
  const all = palettesFor(st.order, KITS)
  const accents = all.filter((p) => p.kind === 'accent')
  const neutrals = all.filter((p) => p.kind === 'neutral')
  /* say where the current one came from — a palette you cannot trace is a
     palette we might as well have invented */
  $('#palnote').textContent = !accents.length
    ? 'This stack publishes no colour families — set the roles below by hand.'
    : palAt
      ? `${palAt.split(':')[1]} — ${KITS[palAt.split(':')[0]].name}, with ${palNeutral ?? 'its'} for the greys`
        + (palShort.length ? `. ${palShort.join(' and ')} could not be met from this family — see the contrast list.` : '')
      : `${accents.length} families your stack publishes${neutrals.length ? `, each matched to one of its ${neutrals.length} greys` : ''}`
  $('#palettes').innerHTML = accents.map((p, i) => {
    const five = [0, 0.25, 0.5, 0.75, 1].map((f) => p.ramp[Math.round(f * (p.ramp.length - 1))])
    return `<button class="pal" data-pal="${i}" aria-pressed="${palAt === `${p.kit}:${p.name}`}"
      title="${p.name} — ${p.from}"><span class="pal__ramp">${five.map((c) => `<i style="background:${c}"></i>`).join('')}</span>
      <span class="pal__name">${p.name}</span></button>`
  }).join('')
  return { accents, neutrals }
}
$('#palettes').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-pal]'); if (!b) return
  const { accents, neutrals } = renderPalettes()
  const pick = accents[Number(b.dataset.pal)]; if (!pick) return
  const own = neutrals.filter((n) => n.kit === pick.kit)
  /* what the kit you are LOOKING at publishes for the two roles a bar would
     otherwise decide — its border and its muted text */
  const seen = KITS[showing(stack(state.on, KITS))]
  const ref = {}
  for (const role of ['line', 'inkMuted']) {
    const v = MAP[seen.id]?.[role]?.var
    if (v && seen.modes?.light?.[v]) ref[role] = seen.modes.light[v]
  }
  const { values, short } = paletteRoles(pick, matchNeutral(pick, own, KITS[pick.kit]) ?? neutrals[0], KITS[pick.kit], ref)
  palShort = short
  Object.assign(state.values, values)
  palAt = `${pick.kit}:${pick.name}`
  palNeutral = (matchNeutral(pick, own, KITS[pick.kit]) ?? neutrals[0])?.name ?? null
  sync(); paint()
})

$('#swatches').innerHTML = SWATCH.map((r) => `<label class="sw" title="${r.what}">
  <input type="color" data-r="${r.id}" value="${state.values[r.id]}">
  <span>${r.label}</span><code data-hex="${r.id}">${state.values[r.id]}</code></label>`).join('')
$('#swatches').addEventListener('input', (e) => {
  state.values[e.target.dataset.r] = e.target.value
  $(`[data-hex="${e.target.dataset.r}"]`).textContent = e.target.value
  paint()
})

const knobHtml = (k) => {
  const role = ROLES.find((r) => r.id === k.id)
  return `<div class="knob"><label for="k_${k.id}">${role.label}<b data-v="${k.id}">${shown(k, state.values[k.id])}</b></label>
    <input id="k_${k.id}" type="range" data-r="${k.id}" min="${k.min}" max="${k.max}" step="${k.step}" value="${slider(k, state.values[k.id])}"></div>`
}
$('#knobs').innerHTML = LENGTHS.filter((k) => k.group === 'shape').map(knobHtml).join('')
$('#typeknobs').innerHTML = LENGTHS.filter((k) => k.group === 'type').map(knobHtml).join('')
for (const host of ['#knobs', '#typeknobs']) {
  $(host).addEventListener('input', (e) => {
    const k = LENGTHS.find((x) => x.id === e.target.dataset.r); if (!k) return
    state.values[k.id] = store(k, e.target.value)
    $(`[data-v="${k.id}"]`).textContent = shown(k, state.values[k.id])
    paint()
  })
}

$('#chips').innerHTML = BRIEFS.map((b) => `<button class="chip" data-b="${b.label}" aria-pressed="false">${b.label}</button>`).join('')
const applyBrief = (b) => {
  Object.assign(state.values, b.values)
  sync(); paint()
  note(`<b>${b.label}</b> — ${b.why}. Every value it moved is a knob you can still turn.`)
}
$('#chips').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return
  const b = BRIEFS.find((x) => x.label === btn.dataset.b)
  ;[...$('#chips').children].forEach((c) => c.setAttribute('aria-pressed', c === btn))
  applyBrief(b)
})
$('#brief').addEventListener('change', (e) => {
  const hit = BRIEFS.find((b) => b.match.test(e.target.value))
  if (hit) applyBrief(hit)
  else if (e.target.value.trim()) note('Nothing in that matched a setting yet — the words it knows are on the chips.')
})

$('#shuffle').addEventListener('click', shuffle)
addEventListener('keydown', (e) => { if (e.key === 's' && !/input|textarea/i.test(e.target.tagName)) shuffle() })
function shuffle() {
  /* Within the floors, always — and with the SAME maths the export uses, not a
     hand-rolled HSL twin. A shuffle that can hand you an unreadable combination
     is a shuffle nobody can trust; that is the whole difference between this and
     a random palette. */
  const hue = Math.floor(Math.random() * 360)
  const brand = oklchToHex(0.42 + Math.random() * 0.16, 0.10 + Math.random() * 0.09, hue)
  const greys = okNeutralScale(hue, 20 + Math.random() * 40, false, Math.random() < 0.25, 1).map(oklchStrToHex)
  Object.assign(state.values, {
    /* aaInk: this function promises never to hand you an unreadable pair, and
       readableInk splits on luminance without checking whether the split
       actually clears 4.5:1. It does not, for a whole band of mid blues. */
    brand, onBrand: aaInk(brand),
    page: greys[1], surface: greys[0], line: greys[5], inkMuted: greys[10] ?? greys.at(-3), ink: greys.at(-1),
    radius: [2, 6, 10, 16][Math.floor(Math.random() * 4)] + 'px',
  })
  sync(); paint()
  const bad = auditContrast(state.values).filter((p) => !p.passes)
  note(bad.length
    ? `Rolled <b>${nameColor(brand)}</b> — ${bad.length} pair${bad.length > 1 ? 's are' : ' is'} under its floor. Use this kit shows which.`
    : `Rolled <b>${nameColor(brand)}</b> — every contrast pair clears its floor.`)
}

function sync() {
  /* the knob CONTROLS only. The font cards carry a role too, and sweeping
     every [data-r] on the page walked into them looking for a slider readout
     that does not exist — the same trap as hooking code on a styling class,
     one attribute along. */
  for (const el of $('#swatches').querySelectorAll('[data-r]')) {
    const v = state.values[el.dataset.r]
    if (el.type === 'color') { el.value = v; $(`[data-hex="${el.dataset.r}"]`).textContent = v }
    else { el.value = parseInt(v); $(`[data-v="${el.dataset.r}"]`).textContent = v }
  }
  for (const el of document.querySelectorAll('#knobs [data-r], #typeknobs [data-r]')) {
    const k = LENGTHS.find((x) => x.id === el.dataset.r), v = state.values[el.dataset.r]
    el.value = slider(k, v); $(`[data-v="${el.dataset.r}"]`).textContent = shown(k, v)
  }
  renderStack()
  renderPalettes()
  typoCards()
  drawRungs()
  drawModes()
  summaries()
}

const note = (html) => ($('#wallnote').innerHTML = html)

/* ── the receipt ──────────────────────────────────────────────────────────── */
function receipt(routed) {
  const kits = routed.map((r) => KITS[r.kit].name).join(' + ')
  const lic = [...new Set(routed.map((r) => KITS[r.kit].license).filter(Boolean))].join(' · ')
  const clash = collisions(routed, KITS)
  $('#receipt').innerHTML = `<b>${kits}</b>
    <span>${SCENES.length} scenes · ${PARTS.length} parts</span>
    <span>${lic}</span>
    ${clash.length ? `<span style="color:#ffd8a8">${clash.length} name${clash.length > 1 ? 's' : ''} two kits both use</span>`
      : `<span class="ok">${ico('check', 12)}no name clashes</span>`}`

  /* What the stack actually produced, under the frame. The claim that these
     are really their components is only worth something if it is counted where
     the reader can see it — so it is, and Material's honest zero shows too. */
  const top = state.show, own = OWN[top] ?? {}
  $('#wallhead').textContent = describe(stack(state.on, KITS), KITS)
  /* Material's unit is not a class — it ships custom elements, so what counts
     there is how many of the elements on the screen its own package registers. */
  $('#wallcount').innerHTML = own.unit === 'elements'
    ? `<b>${own.elsTheirs} of ${own.els}</b> elements on this screen are ${KITS[top].name}'s own, running their code`
    : own.used
      ? `<b>${own.theirs} of ${own.used}</b> classes on this screen are ${KITS[top].name}'s own${
          own.theirs < own.used ? ` — ${own.used - own.theirs === 1 ? 'one is' : (own.used - own.theirs) + ' are'} ours` : ''}`
      : `<b>nothing of theirs</b> on this screen at all`

  /* a role the shown kit compiles rather than reads, named while you are
     turning its knob rather than after you download */
  /* across the whole stack, not the top layer: it is Tailwind that compiles a
     shadow, and shadcn — which rides on it — is what you are looking at. */
  const compiled = routed.flatMap((r) => (r.needsBuild ?? []).map((b) => ({ ...b, kit: r.kit })))
    .filter((b) => state.values[b.role] != null && b.role === 'elevation')
  const needs = routed.filter((r) => !LIVE_BRAND[r.kit] && state.show === r.kit)
  note(needs.length
    ? `<b>${KITS[state.show].name}</b> — ${state.show === 'bootstrap'
        ? 'its component colours — brand, success, warning and danger — are compiled by Sass, so this frame shows the build we made. Your download carries the Sass lines that change them.'
        : 'it derives its colours from the seed with its own generator, so this frame shows a pre-derived scheme. Your download carries the seed.'}`
    : compiled.length
      ? `<b>${KITS[compiled[0].kit].name}</b> — ${compiled.map((b) => b.role).join(', ')} is compiled into its utilities rather than read at runtime, so this frame cannot show the change. Your download carries the value; ${KITS[compiled[0].kit].name}'s own build puts it into the components.`
      : '')
}

/* ── the two outputs ──────────────────────────────────────────────────────── */
const files = () => generate(state.values, ORDER.filter((k) => state.on.has(k)), KITS,
  { name: kitName() || 'design-system', parts: PARTS })
const grab = (name, body, type = 'text/plain') => {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([body], { type }))
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000)
}

/* Nothing downloads until you have seen what it is.
 *
 * The old sandbox got this right and the first version here threw it away:
 * pressing Export dropped five files into someone's Downloads folder with no
 * account of what they were. A package you have not read is a package you do
 * not trust — and the two things worth reading are the contrast audit and the
 * list of what this system CANNOT express. */
/* The frame, as a file. Byte for byte the same document the preview renders —
 * the kit's compiled CSS, your values over it, the screens in the kit's own
 * classes — so what you downloaded cannot differ from what you looked at. */
function screensHtml() {
  const id = state.show
  const r = route(state.values, ORDER.filter((k) => state.on.has(k)), KITS).find((x) => x.kit === id)
  const vars = { ...(r?.vars ?? {}) }
  if (id === 'material') Object.assign(vars, DERIVED.light ?? {})   // the file is the light frame
  return `<!doctype html><meta charset="utf-8"><title>${describe(stack(state.on, KITS), KITS)}</title>
<style>${CSS[id] ?? ''}</style>
<style>:root{${Object.entries(vars).map(([k, v]) => `${k}:${v}`).join(';')}}</style>
<body>${WALLS[id] ?? ''}`
}

const DESTS = [
  { t: 'Everything', d: 'one .zip — theme, install, manifest, agent brief', go: (f) =>
      grab(`${kitName() || 'design-system'}.zip`, zip(plain(f)), 'application/zip') },
  { t: 'Just the theme', d: 'theme.css, to drop in next to your kits', go: (f) => grab('theme.css', f['theme.css']) },
  { t: 'Just the rules', d: 'AGENTS.md — the same file CLAUDE.md and .cursor/rules get', go: (f) => grab('AGENTS.md', f['AGENTS.md']) },
  { t: 'The manifest', d: 'versions, licences, and what could not be done', go: (f) => grab('MANIFEST.md', f['MANIFEST.md']) },
  { t: 'These screens, as one HTML file', wide: true,
    d: 'exactly what you are looking at — the kit\'s CSS, your values, its classes. Open it in a browser.',
    go: () => grab('screens.html', screensHtml(), 'text/html') },
]

function openSheet() {
  const f = files()
  const on = ORDER.filter((k) => state.on.has(k))
  const audit = auditContrast(state.values)
  const bad = audit.filter((p) => !p.passes)

  $('#sum').textContent = `${Object.keys(state.values).length} settings · ${on.length} kit${on.length > 1 ? 's' : ''} · ${Object.keys(plain(f)).length} files`

  $('#facts').innerHTML = [
    ...ROLES.filter((r) => state.values[r.id] != null).map((r) => `<span class="fact">${
      r.kind === 'colour' ? `<i style="background:${state.values[r.id]}"></i>` : ''}${r.label} <b>${state.values[r.id]}</b></span>`),
    ...on.map((k) => `<span class="fact">${KITS[k].name} <b>${KITS[k].version ?? 'live'}</b></span>`),
  ].join('')

  $('#dests').innerHTML = DESTS.map((d, i) => `<button class="dest${d.wide ? ' dest--wide' : ''}" data-d="${i}"><b>${d.t}</b><span>${d.d}</span></button>`).join('')

  $('#clabel').textContent = `Contrast — ${audit.length - bad.length} of ${audit.length} pairs clear their floor`
  $('#pairs').innerHTML = audit.map((p) => `<li${p.passes ? '' : ' data-bad'}>
    <span class="${p.passes ? 'ok' : 'no'}">${p.passes ? '✓' : '✗'}</span>
    <span>${p.label}</span><em>${p.ratio}:1</em></li>`).join('')

  /* two different questions, so two lists: a value that could not be set, and
     a part the kit does not ship at all. Merging them made "nothing could not
     be done" impossible to ever say. */
  const md = (l) => l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
  const cav = [
    ...section(f['MANIFEST.md'], '## What could not be done').map(md),
    ...section(f['MANIFEST.md'], '## What these kits have no component for').map(md),
  ].filter((l) => !/^Nothing —/.test(l.replace(/<[^>]+>/g, '')))
  $('#csection').hidden = !cav.length
  $('#caveats').innerHTML = cav.map((c) => `<li>${c}</li>`).join('')
  /* ── the files, side by side with what you would ship ──────────────────── */
  const shown = plain(f)
  drawFiles(shown)
  $('#drawer').hidden = false
}

/* One set of rules under the three names different tools look for, so the
 * tab strip is a tab strip and not four different documents. */
const FILES = ['AGENTS.md', 'CLAUDE.md', '.cursor/rules', 'tokens.json', 'theme.css', 'install.md', 'MANIFEST.md']
let fileAt = 'AGENTS.md'
function drawFiles(shown) {
  const have = FILES.filter((n) => shown[n] != null)
  if (!have.includes(fileAt)) fileAt = have[0]
  $('#ftabs').innerHTML = have.slice(0, 4).map((n) =>
    `<button role="radio" data-f="${n}" aria-checked="${n === fileAt}">${n}</button>`).join('')
  const body = shown[fileAt] ?? ''
  $('#fbody').textContent = body
  $('#fmeta').textContent = `${fileAt} · ${body.split('\n').length} lines`

  const folder = (kitName() || 'design-system')
  $('#tree').innerHTML = [`${folder}/`, ...Object.keys(shown).sort().map((n) => `  ${n}`)]
    .map((l, i) => `<li>${i === 0 ? `<b>${l}</b>` : `<span>${l}</span>`}</li>`).join('')
}
const kitName = () => ($('#kitname').value || '').trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '')
$('#ftabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  fileAt = b.dataset.f; drawFiles(plain(files()))
})
$('#fcopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('#fbody').textContent); $('#fcopy').textContent = 'Copied' }
  catch { $('#fcopy').textContent = 'Select and copy' }
  setTimeout(() => ($('#fcopy').textContent = 'Copy'), 1400)
})
$('#kitname').addEventListener('input', () => drawFiles(plain(files())))
$('#dests').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  DESTS[Number(b.dataset.d)].go(files())
})
$('#export').addEventListener('click', openSheet)
$('#downloadzip').addEventListener('click', () => DESTS[0].go(files()))
$('#manifest').addEventListener('click', openSheet)
$('#sheetx').addEventListener('click', () => ($('#drawer').hidden = true))
addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#drawer').hidden = true })

/* The two font knobs start on whatever the kit under them publishes. Seeding
 * them with a face we like would be the one opinion this tool is not allowed to
 * have — and it would silently overwrite the kit's own default on load. */
/* ||=, not ??=: the placeholders above are empty strings, and an empty
   string is neither null nor undefined — the three knobs opened on black. */
for (const [role, seed] of Object.entries(SEEDS)) state.values[role] ||= seed.value
for (const role of ['success', 'warning', 'danger', 'focus']) if (!state.values[role]) delete state.values[role]

for (const role of TYPE) {
  if (state.values[role.id]) continue
  const base = KITS[stack(state.on, KITS).base]?.name
  const own = FONTS.stacks.find((f) => f.from.includes(base)) ?? FONTS.stacks[0]
  state.values[role.id] = own?.family ?? 'system-ui, sans-serif'
}

sync()
addEventListener('load', () => setTimeout(paint, 60))
</script>
