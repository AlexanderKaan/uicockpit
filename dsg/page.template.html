<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design System Generator</title>
<style>
:root{--ground:#efeeec;--panel:#fff;--sunken:#e7e6e3;--ink:#1c1b19;--muted:#6b6862;--line:#00000014;--go:#1c1b19}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{min-height:100vh;display:flex;flex-direction:column;gap:12px;padding:12px}
.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
kbd{font:10px/1 ui-monospace,monospace;padding:2px 5px;border-radius:4px;background:var(--sunken);color:var(--muted)}

/* everything floats on the ground — no full-width bars */
.band,.wall,.dock{background:var(--panel);border-radius:10px}
.band{padding:12px 14px}
.band__top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wm{flex:none}
.mark{--wm-glyph:var(--panel);color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;margin:0;font-weight:600;letter-spacing:-.01em;flex:none;font-size:13.5px}
.brief{flex:1;min-width:240px;display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;
       border-radius:9px;background:var(--sunken);color:var(--muted)}
.brief input{flex:1;border:0;background:0;font:inherit;font-size:13px;color:var(--ink);outline:0;min-width:0}
.band__acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip,.btn{font:inherit;font-size:12.5px;font-weight:500;min-height:36px;padding:0 12px;border-radius:9px;
           border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
           display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed=true]{background:var(--sunken);border-color:transparent;font-weight:600}
.btn--ghost{border-color:transparent;background:0;color:var(--muted)}
.btn--go{background:var(--go);color:#fff;border-color:var(--go);font-weight:600}

.band__kits{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.stack{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack__on{display:flex;align-items:center;gap:6px;background:var(--sunken);padding:4px;border-radius:11px}
.stack__sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.stack__off{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.slab{font:inherit;font-size:12.5px;min-height:34px;padding:0 11px;border-radius:8px;cursor:pointer;
      display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;
      background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.slab b{font-weight:600}
.slab small{font-size:10.5px;color:var(--muted)}
.slab--base{background:0;box-shadow:none;color:var(--muted);cursor:default}
.slab--base b{color:var(--ink)}
.slab--add{background:0;border-color:var(--line);color:var(--muted);box-shadow:none}
.slab--add b{font-weight:500}
.slab--add:hover{border-color:var(--ink);color:var(--ink)}
.stack__plus{font-size:12px;color:var(--muted);padding:0 1px}
.slab .drop{opacity:.4;font-size:14px;line-height:1;margin-left:1px}
.slab:hover .drop{opacity:1}

.band__knobs{display:grid;grid-template-columns:1.5fr 1.1fr .9fr;gap:20px;margin-top:12px}

/* Typography — two cards, each set in the family it names, the way a specimen
   sheet shows a face rather than describing it. */
.eyebrow--act{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mini{font:inherit;font-size:10px;letter-spacing:.04em;text-transform:none;font-weight:600;color:var(--muted);
      border:0;background:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 2px}
.mini:hover{color:var(--ink)}
.typo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px}
.font{font:inherit;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;
      padding:8px 11px 9px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-height:66px;overflow:hidden}
.font:hover{border-color:var(--ink)}
.font__role{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.font__name{font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font__from{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#fontpick{border:0;padding:0;background:0;max-width:none;max-height:none;width:100%;height:100%}
#fontpick::backdrop{background:#1c1b1955}
.pick{position:fixed;left:14px;top:14px;bottom:14px;width:360px;max-width:calc(100vw - 28px);
      background:var(--panel);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;
      box-shadow:0 18px 50px rgba(0,0,0,.22)}
.pick__top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pick__top h2{margin:0;font-size:15px}
.pick__sum{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.pick__search{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;border-radius:9px;background:var(--sunken);color:var(--muted)}
.pick__search input{flex:1;border:0;background:0;font:inherit;font-size:13px;color:var(--ink);outline:0}
.pick__list{flex:1;overflow-y:auto;display:grid;gap:6px;align-content:start;scrollbar-width:thin}
.spec{font:inherit;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;
      padding:9px 11px;cursor:pointer;display:grid;gap:3px}
.spec:hover{border-color:var(--ink)}
.spec[aria-pressed=true]{border-color:var(--ink);background:var(--sunken)}
.spec__line{font-size:15px;line-height:1.3}
.spec__meta{font-size:10.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pick__foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pick__now{margin:0;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:7px}
.sw{display:flex;flex-direction:column;gap:5px}
.sw input{-webkit-appearance:none;appearance:none;border:0;padding:0;height:36px;width:100%;border-radius:9px;cursor:pointer;background:0}
.sw input::-webkit-color-swatch-wrapper{padding:0}
.sw input::-webkit-color-swatch{border:1px solid var(--line);border-radius:9px}
.sw span{font-size:10.5px;font-weight:600}
.sw code{font-size:9.5px;color:var(--muted);font-family:ui-monospace,monospace}
.knobs{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:7px}
.knob label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.knob b{color:var(--ink);font-family:ui-monospace,monospace;font-size:11px}
.knob input[type=range]{width:100%;accent-color:var(--ink);min-height:24px}

.wall{flex:1;padding:12px 14px;display:flex;flex-direction:column}
.wall__bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.wall__count{margin:0;font-size:11.5px;color:var(--muted)}
.wall__count b{color:var(--ink);font-weight:600}
.frames{flex:1}
.frames iframe{width:100%;height:70vh;min-height:480px;border:0;border-radius:10px;background:#fff;display:block}
.frames iframe[hidden]{display:none}
.wall__note{margin:9px 0 0;font-size:11.5px;color:var(--muted);min-height:17px}
.wall__note b{color:var(--ink);font-weight:600}

.dock{position:sticky;bottom:12px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dock__what{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;align-items:center;color:var(--muted)}
.dock__what b{color:var(--ink);font-weight:600}
.dock__what .ok{display:inline-flex;align-items:center;gap:6px}
.dock__acts{display:flex;gap:6px}

dialog{border:0;border-radius:12px;padding:0;max-width:min(720px,92vw);background:var(--panel)}
dialog::backdrop{background:#1c1b1966}
.sheet{padding:20px 22px;position:relative}
.sheet__x{position:absolute;top:12px;right:12px;border:0;background:0;cursor:pointer;color:var(--muted);min-height:36px;min-width:36px;border-radius:9px}
.sheet__x:hover{background:var(--sunken)}
.sheet h2{margin:0;font-size:17px;letter-spacing:-.01em}
.sheet__top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.sheet__sum{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.sheet section{margin-bottom:18px}
.sheet section .eyebrow{margin-bottom:9px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:6px 10px;border-radius:8px;background:var(--sunken)}
.fact i{width:11px;height:11px;border-radius:3px;flex:none;font-style:normal;border:1px solid #0000001a}
.fact b{font-weight:600}
.dests{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dest--wide{grid-column:1/-1}
.dest{text-align:left;font:inherit;border:1px solid var(--line);background:var(--panel);border-radius:10px;
      padding:11px 13px;cursor:pointer;min-height:56px;display:flex;flex-direction:column;gap:2px}
.dest:hover{background:var(--sunken)}
.dest b{font-size:13px;font-weight:600}
.dest span{font-size:11.5px;color:var(--muted);line-height:1.4}
.pairs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5px 16px}
.pairs li{display:grid;grid-template-columns:13px 1fr max-content;gap:8px;align-items:baseline;font-size:12px}
.pairs .ok{color:#1e6b37;font-weight:700}
.pairs .no{color:#8e2c21;font-weight:700}
.pairs em{font-style:normal;color:var(--muted);font-family:ui-monospace,monospace;font-size:11.5px}
.pairs li[data-bad] em{color:#8e2c21;font-weight:600}
.sheet h3{margin:15px 0 6px;font-size:12.5px}
.sheet p,.sheet li{font-size:12.5px;line-height:1.55;color:var(--muted)}
.sheet ul{margin:0;padding-left:17px}
.sheet code{font-family:ui-monospace,monospace;font-size:11.5px;background:var(--sunken);padding:1px 5px;border-radius:4px;color:var(--ink)}
@media(max-width:1100px){.band__knobs{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.band__knobs{grid-template-columns:1fr}.swatches{grid-template-columns:repeat(4,1fr)}}
</style>
<!--BODY-->
<script type="module">
/*MODULES*/
const KITS = /*KITS*/;
const CSS = /*CSS*/;
const DERIVED = /*DERIVED*/;
const WALLS = /*WALLS*/;
const SCRIPTS = /*SCRIPTS*/;
const OWN = /*OWN*/;
const RENDERS = /*RENDERS*/;
const FONTS = /*FONTS*/;
const ICONS = /*ICONS*/;
const ico = (n, s = 13) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] ?? ''}</svg>`

const $ = (s) => document.querySelector(s)
const ORDER = ['openprops', 'tailwind', 'daisyui', 'shadcn', 'bootstrap', 'material', 'radix', 'mantine']
const SWATCH = ROLES.filter((r) => r.kind === 'colour')
const TYPE = ROLES.filter((r) => r.kind === 'font')
const LENGTHS = [
  { id: 'radius', min: 0, max: 24, step: 1, unit: 'px' },
  { id: 'baseText', min: 14, max: 20, step: 1, unit: 'px' },
]

/* A brief is not a prompt: these words map to numbers a standard already names,
   and the page SHOWS what they moved. No model, nothing to explain away. */
const BRIEFS = [
  { match: /older|elderly|accessib|readab|low vision/i, label: 'Readable',
    values: { baseText: '18px', radius: '8px' }, why: 'larger body text, calmer corners' },
  { match: /round|soft|friendly|playful/i, label: 'Rounder', values: { radius: '18px' }, why: 'more rounded corners' },
  { match: /sharp|serious|bank|legal|formal/i, label: 'Sharper', values: { radius: '2px' }, why: 'almost square corners' },
  { match: /dense|compact|data|dashboard/i, label: 'Denser', values: { baseText: '14px', radius: '6px' }, why: 'smaller text, tighter corners' },
]

const state = {
  /* A stack, not a basket: Tailwind carries shadcn's components. `show` is
     never chosen — it is whichever layer is on top. */
  on: new Set(['tailwind', 'shadcn']),
  get show() { return showing(stack(this.on, KITS)) },
  values: { brand: '#0b6e8a', onBrand: '#ffffff', page: '#f7f9fa', surface: '#ffffff',
    ink: '#16181c', inkMuted: '#5c6b72', line: '#dfe2e7', radius: '10px', baseText: '16px',
    /* seeded from what the base kit publishes, not from a face we like */
    fontHeading: '', fontBody: '' },
}

/* ── the frames ───────────────────────────────────────────────────────────── */
useMantineClasses(KITS.mantine.classes)

/* Seven kits' real stylesheets is two megabytes of CSS, and Radix alone is
 * eight hundred kilobytes. Writing every frame's document up front made the
 * browser parse all of it to show one. A frame is built the first time you
 * actually look at it. */
$('#frames').innerHTML = RENDERS.map((id) =>
  `<iframe id="f_${id}" hidden title="${KITS[id].name}"></iframe>`).join('')

const BUILT = new Set()
function build(id) {
  if (BUILT.has(id)) return
  BUILT.add(id)
  const f = $('#f_' + id); if (!f) return
  f.srcdoc = `<!doctype html><meta charset=utf-8><style>${CSS[id] ?? ''}</style><style id=live></style><body>${WALLS[id] ?? ''}`
  if (SCRIPTS[id]) {
    /* Material's components are code, injected rather than written into srcdoc:
     * inside an attribute every quote in 260 kB of their code becomes six
     * characters, and the page went from 513 kB to 1.2 MB. */
    const run = () => {
      const d = f.contentDocument; if (!d || d.getElementById('kit-elements')) return
      const s = d.createElement('script')
      s.type = 'module'; s.id = 'kit-elements'; s.textContent = SCRIPTS[id]
      d.body.appendChild(s)
    }
    f.addEventListener('load', run)
  }
  f.addEventListener('load', paint)
}

/* Only the kits a running page CAN change get changed live. Bootstrap compiles
   its brand and Material derives its scheme, so those two say so instead of
   quietly showing yesterday's build. */
const LIVE_BRAND = { tailwind: true, daisyui: true, shadcn: true, bootstrap: false, material: false,
  radix: true, mantine: true, openprops: true }

function paint() {
  const kits = ORDER.filter((k) => state.on.has(k))
  const routed = route(state.values, kits, KITS)
  /* A frame shows a STACK, so it carries every layer's variables, bottom-up.
     Giving it only the top layer's meant shadcn's frame never saw Tailwind's
     --font-sans, and the font knobs moved the card and nothing else. A tokens
     layer belongs under all of it, which is what it does in your app. */
  const st = stack(state.on, KITS)
  const below = (id) => st.order.slice(0, st.order.indexOf(id) + 1)
  const varsOf = (ids) => Object.assign({}, ...ids.map((k) => routed.find((r) => r.kit === k)?.vars ?? {}))
  for (const r of routed) {
    const f = $('#f_' + r.kit)
    if (!f) continue
    const live = f.contentDocument?.getElementById('live')
    if (!live) continue
    /* Radix takes attributes, not values: its accent, grey, radius and scaling
       are set on the theme root the way its <Theme> would set them. */
    const root = f.contentDocument.documentElement
    for (const [a, v] of Object.entries(r.attrs ?? {})) root.setAttribute(a, v)
    /* the chosen face has to exist inside the frame too, or the wall shows the
       fallback while the card shows the family */
    for (const role of TYPE) loadFace(f.contentDocument, familyOf(state.values[role.id]))
    let vars = varsOf(below(r.kit))
    /* Material's other 46 roles come from its own generator, pre-derived here
       for the seeds we shipped; an unseen seed keeps the last derived scheme
       and the note says the download will carry the right one. */
    if (r.kit === 'material') Object.assign(vars, DERIVED.light ?? {})
    live.textContent = `:root{${Object.entries(vars).map(([k, v]) => `${k}:${v}`).join(';')}}`
  }
  build(state.show)
  for (const id of RENDERS) $('#f_' + id).hidden = id !== state.show
  receipt(routed)
}

/* ── the stack ───────────────────────────────────────────────────────────── */
/* The old row put five kits side by side as if you picked between them. You do
 * not: shadcn IS Tailwind with components on it, and Bootstrap is neither. So
 * the control reads bottom-to-top like the thing it describes, and the frame
 * below shows the top layer — no second control asking which kit to look at. */
function renderStack() {
  const st = stack(state.on, KITS)
  const opt = Object.fromEntries(options(state.on, KITS).map((o) => [o.id, o]))
  const on = st.order.map((id, i) => {
    const o = opt[id]
    const base = o.role === 'base' && o.locked
    return `${i ? '<span class="stack__plus">+</span>' : ''}<button class="slab${base ? ' slab--base' : ''}"
      data-k="${id}" aria-pressed="true" title="${o.why}"${base ? ' tabindex="-1" aria-disabled="true"' : ''}>
      <b>${KITS[id].name}</b><small>${o.role === 'base' ? 'base' : 'components'}</small>${base ? '' : '<span class="drop">×</span>'}</button>`
  }).join('')
  const off = ORDER.filter((id) => !st.order.includes(id)).map((id) => {
    const o = opt[id]
    return `<button class="slab slab--add" data-k="${id}" aria-pressed="false" title="${o.why}">
      +<b>${KITS[id].name}</b><small>${o.role === 'whole' ? 'replaces the stack'
        : o.role === 'base' ? 'back to the base' : 'on ' + KITS[foundationOf(KITS)].name}</small></button>`
  }).join('')
  $('#stack').innerHTML = `<div class="stack__on">${on}</div>${off ? `<span class="stack__sep"></span><div class="stack__off">${off}</div>` : ''}`
}
$('#stack').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-k]'); if (!b || b.getAttribute('aria-disabled') === 'true') return
  state.on = toggle(state.on, b.dataset.k, KITS)
  sync(); paint()
})

/* ── typography ───────────────────────────────────────────────────────────── */
/* Two published sources and no third. The kits publish system stacks — Open
 * Props alone names six — and Google publishes 1821 families with their own
 * category and popularity order. We add no list, no ranking and no favourites.
 *
 * A specimen is shown in its own face, which means loading it. Google's `text=`
 * parameter returns a font subset to just the pangram's glyphs, so a page of
 * forty specimens costs a few kilobytes rather than a few megabytes, and a face
 * is only fetched once it is actually scrolled into view. */
const PANGRAM = 'The five boxing wizards jump quickly together'
const GOOGLE = new Map(FONTS.google.map((f) => [f.family, f]))
const FALLBACK = { 'Sans Serif': 'sans-serif', Serif: 'serif', Display: 'sans-serif',
  Handwriting: 'cursive', Monospace: 'monospace' }
/* the stack we WRITE: their family, then the generic its own category names, so
   a face that fails to load still lands somewhere sane */
const stackFor = (f) => f.stack ? f.family : `'${f.family}', ${FALLBACK[f.category] ?? 'sans-serif'}`
const familyOf = (value) => String(value ?? '').split(',')[0].replace(/['"]/g, '').trim()

const loaded = new Set()
function loadFace(doc, family, { specimen = false } = {}) {
  if (!GOOGLE.has(family)) return
  const key = `${specimen ? 's' : 'f'}:${family}`
  const id = `gf-${key.replace(/[^a-z0-9]/gi, '-')}`
  if (doc.getElementById(id)) return
  const link = doc.createElement('link')
  link.rel = 'stylesheet'; link.id = id
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family).replace(/%20/g, '+')}`
    + (specimen ? `&text=${encodeURIComponent(PANGRAM)}` : ':wght@400;500;600;700') + '&display=swap'
  doc.head.appendChild(link)
  loaded.add(key)
}

function typoCards() {
  $('#typo').innerHTML = TYPE.map((r) => {
    const value = state.values[r.id]
    const fam = familyOf(value)
    const g = GOOGLE.get(fam)
    const stack = FONTS.stacks.find((s) => s.family === value)
    return `<button class="font" data-font="${r.id}">
      <span class="font__role">${r.label}</span>
      <span class="font__name" style="font-family:${value.replace(/"/g, '&quot;')}">${stack ? stack.name : fam}</span>
      <span class="font__from">${g ? `Google · ${(g.tags ?? []).length ? g.tags.join(' ') : g.category}${g.variable ? ' · variable' : ''}`
        : stack ? `${stack.from.join(', ')} · system stack` : 'system stack'}</span></button>`
  }).join('')
  for (const r of TYPE) loadFace(document, familyOf(state.values[r.id]))
}
$('#typo').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-font]'); if (!b) return
  openPicker(b.dataset.font)
})

/* ── the font picker ──────────────────────────────────────────────────────── */
let pickRole = 'fontBody', pickTab = 'kits'
const PAGE = 40
let pickShown = PAGE

function pickPool() {
  const q = $('#picksearch').value.trim().toLowerCase()
  const pool = pickTab === 'kits' ? FONTS.stacks : FONTS.google
  return q ? pool.filter((f) => (f.name ?? f.family).toLowerCase().includes(q)) : pool
}

const seeing = new IntersectionObserver((rows) => {
  for (const row of rows) {
    if (!row.isIntersecting) continue
    loadFace(document, row.target.dataset.family, { specimen: true })
    seeing.unobserve(row.target)
  }
}, { rootMargin: '200px' })

function drawPicker() {
  const pool = pickPool()
  const rows = pool.slice(0, pickShown)
  const current = state.values[pickRole]
  $('#picklist').innerHTML = rows.map((f) => {
    const stack = stackFor(f)
    return `<button class="spec" data-stack="${stack.replace(/"/g, '&quot;')}" data-family="${f.stack ? '' : f.family}"
      aria-pressed="${stack === current}">
      <span class="spec__line" style="font-family:${stack.replace(/"/g, '&quot;')}">${PANGRAM}</span>
      <span class="spec__meta">${f.stack ? `${f.name} — ${f.from.join(', ')} · no download`
        : `${f.family} · Google · ${(f.tags ?? []).length ? f.tags.join(' ') : f.category}${f.variable ? ' · variable' : ''}`}</span></button>`
  }).join('') + (pool.length > rows.length
    ? `<button class="btn" id="pickmore" style="width:100%">Show ${Math.min(PAGE, pool.length - rows.length)} more of ${pool.length}</button>` : '')
  for (const el of $('#picklist').querySelectorAll('[data-family]:not([data-family=""])')) seeing.observe(el)
  $('#picksum').textContent = pickTab === 'kits'
    ? `${FONTS.stacks.length} stacks the kits publish — nothing to download`
    : `${FONTS.google.length} families from Google's own list, most used first`
  $('#picknow').textContent = `Now: ${familyOf(current)}`
}

function openPicker(role) {
  pickRole = role; pickShown = PAGE
  $('#picksearch').value = ''
  $('#pickrole').textContent = ROLES.find((r) => r.id === role).label
  $('#picktabs').innerHTML = [['kits', 'From your kits'], ['google', 'Google Fonts']]
    .map(([id, label]) => `<button role="radio" data-t="${id}" aria-checked="${id === pickTab}">${label}</button>`).join('')
  drawPicker()
  $('#fontpick').showModal()
}
$('#picktabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  pickTab = b.dataset.t; pickShown = PAGE
  for (const x of $('#picktabs').children) x.setAttribute('aria-checked', x.dataset.t === pickTab)
  drawPicker()
})
$('#picksearch').addEventListener('input', () => { pickShown = PAGE; drawPicker() })
$('#picklist').addEventListener('click', (e) => {
  if (e.target.closest('#pickmore')) { pickShown += PAGE; return drawPicker() }
  const b = e.target.closest('.spec'); if (!b) return
  state.values[pickRole] = b.dataset.stack
  typoCards(); drawPicker(); paint()
})
$('#pickshuffle').addEventListener('click', () => {
  const pool = pickPool(); if (!pool.length) return
  const f = pool[Math.floor(Math.random() * Math.min(pool.length, 120))]
  state.values[pickRole] = stackFor(f)
  typoCards(); drawPicker(); paint()
})
/* Shuffling the type, without a taste of our own: both faces come from the top
 * of GOOGLE's own popularity order, and the body face is limited to the two
 * categories Google itself calls text categories. No pairing rules of ours. */
$('#typeshuffle').addEventListener('click', () => {
  const top = FONTS.google.slice(0, 120)
  /* Google classifies a face as Display, Handwriting, Monospace or Symbols, or
     leaves it unclassified — and unclassified is what a text face looks like in
     their data. Archivo Black is a Display face by their own reckoning, and it
     is not what anyone means by a body font. */
  const text = top.filter((f) => !(f.tags ?? []).length)
  const pick = (pool) => pool[Math.floor(Math.random() * pool.length)]
  state.values.fontHeading = stackFor(pick(top))
  state.values.fontBody = stackFor(pick(text))
  typoCards(); paint()
})

$('#pickx').addEventListener('click', () => $('#fontpick').close())
$('#fontpick').addEventListener('click', (e) => { if (e.target.id === 'fontpick') $('#fontpick').close() })

$('#swatches').innerHTML = SWATCH.map((r) => `<label class="sw" title="${r.what}">
  <input type="color" data-r="${r.id}" value="${state.values[r.id]}">
  <span>${r.label}</span><code data-hex="${r.id}">${state.values[r.id]}</code></label>`).join('')
$('#swatches').addEventListener('input', (e) => {
  state.values[e.target.dataset.r] = e.target.value
  $(`[data-hex="${e.target.dataset.r}"]`).textContent = e.target.value
  paint()
})

$('#knobs').innerHTML = LENGTHS.map((k) => {
  const role = ROLES.find((r) => r.id === k.id)
  return `<div class="knob"><label for="k_${k.id}">${role.label}<b data-v="${k.id}">${state.values[k.id]}</b></label>
    <input id="k_${k.id}" type="range" data-r="${k.id}" min="${k.min}" max="${k.max}" step="${k.step}" value="${parseInt(state.values[k.id])}"></div>`
}).join('')
$('#knobs').addEventListener('input', (e) => {
  const k = LENGTHS.find((x) => x.id === e.target.dataset.r)
  state.values[k.id] = e.target.value + k.unit
  $(`[data-v="${k.id}"]`).textContent = state.values[k.id]
  paint()
})

$('#chips').innerHTML = BRIEFS.map((b) => `<button class="chip" data-b="${b.label}" aria-pressed="false">${b.label}</button>`).join('')
const applyBrief = (b) => {
  Object.assign(state.values, b.values)
  sync(); paint()
  note(`<b>${b.label}</b> — ${b.why}. Every value it moved is a knob you can still turn.`)
}
$('#chips').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return
  const b = BRIEFS.find((x) => x.label === btn.dataset.b)
  ;[...$('#chips').children].forEach((c) => c.setAttribute('aria-pressed', c === btn))
  applyBrief(b)
})
$('#brief').addEventListener('change', (e) => {
  const hit = BRIEFS.find((b) => b.match.test(e.target.value))
  if (hit) applyBrief(hit)
  else if (e.target.value.trim()) note('Nothing in that matched a setting yet — the words it knows are on the chips.')
})

$('#shuffle').addEventListener('click', shuffle)
addEventListener('keydown', (e) => { if (e.key === 's' && !/input|textarea/i.test(e.target.tagName)) shuffle() })
function shuffle() {
  /* Within the floors, always — and with the SAME maths the export uses, not a
     hand-rolled HSL twin. A shuffle that can hand you an unreadable combination
     is a shuffle nobody can trust; that is the whole difference between this and
     a random palette. */
  const hue = Math.floor(Math.random() * 360)
  const brand = oklchToHex(0.42 + Math.random() * 0.16, 0.10 + Math.random() * 0.09, hue)
  const greys = okNeutralScale(hue, 20 + Math.random() * 40, false, Math.random() < 0.25, 1).map(oklchStrToHex)
  Object.assign(state.values, {
    brand, onBrand: readableInk(brand),
    page: greys[1], surface: greys[0], line: greys[5], inkMuted: greys[10] ?? greys.at(-3), ink: greys.at(-1),
    radius: [2, 6, 10, 16][Math.floor(Math.random() * 4)] + 'px',
  })
  sync(); paint()
  const bad = auditContrast(state.values).filter((p) => !p.passes)
  note(bad.length
    ? `Rolled <b>${nameColor(brand)}</b> — ${bad.length} pair${bad.length > 1 ? 's are' : ' is'} under its floor. Use this kit shows which.`
    : `Rolled <b>${nameColor(brand)}</b> — every contrast pair clears its floor.`)
}

function sync() {
  /* the knob CONTROLS only. The font cards carry a role too, and sweeping
     every [data-r] on the page walked into them looking for a slider readout
     that does not exist — the same trap as hooking code on a styling class,
     one attribute along. */
  for (const el of $('#swatches').querySelectorAll('[data-r]')) {
    const v = state.values[el.dataset.r]
    if (el.type === 'color') { el.value = v; $(`[data-hex="${el.dataset.r}"]`).textContent = v }
    else { el.value = parseInt(v); $(`[data-v="${el.dataset.r}"]`).textContent = v }
  }
  for (const el of $('#knobs').querySelectorAll('[data-r]')) {
    const v = state.values[el.dataset.r]
    el.value = parseInt(v); $(`[data-v="${el.dataset.r}"]`).textContent = v
  }
  renderStack()
  typoCards()
}

const note = (html) => ($('#wallnote').innerHTML = html)

/* ── the receipt ──────────────────────────────────────────────────────────── */
function receipt(routed) {
  const kits = routed.map((r) => KITS[r.kit].name).join(' + ')
  const lic = [...new Set(routed.map((r) => KITS[r.kit].license).filter(Boolean))].join(' · ')
  const clash = collisions(routed, KITS)
  $('#receipt').innerHTML = `<b>${kits}</b>
    <span>${SCENES.length} scenes · ${PARTS.length} parts</span>
    <span>${lic}</span>
    ${clash.length ? `<span style="color:#ffd8a8">${clash.length} name${clash.length > 1 ? 's' : ''} two kits both use</span>`
      : `<span class="ok">${ico('check', 12)}no name clashes</span>`}`

  /* What the stack actually produced, under the frame. The claim that these
     are really their components is only worth something if it is counted where
     the reader can see it — so it is, and Material's honest zero shows too. */
  const top = state.show, own = OWN[top] ?? {}
  $('#wallhead').textContent = describe(stack(state.on, KITS), KITS)
  /* Material's unit is not a class — it ships custom elements, so what counts
     there is how many of the elements on the screen its own package registers. */
  $('#wallcount').innerHTML = own.unit === 'elements'
    ? `<b>${own.elsTheirs} of ${own.els}</b> elements on this screen are ${KITS[top].name}'s own, running their code`
    : own.used
      ? `<b>${own.theirs} of ${own.used}</b> classes on this screen are ${KITS[top].name}'s own${
          own.theirs < own.used ? ` — ${own.used - own.theirs === 1 ? 'one is' : (own.used - own.theirs) + ' are'} ours` : ''}`
      : `<b>nothing of theirs</b> on this screen at all`

  const needs = routed.filter((r) => !LIVE_BRAND[r.kit] && state.show === r.kit)
  note(needs.length
    ? `<b>${KITS[state.show].name}</b> — ${state.show === 'bootstrap'
        ? 'its brand is compiled by Sass, so this frame shows the build we made. Your download carries the Sass line that changes it.'
        : 'it derives its colours from the seed with its own generator, so this frame shows a pre-derived scheme. Your download carries the seed.'}`
    : '')
}

/* ── the two outputs ──────────────────────────────────────────────────────── */
const files = () => generate(state.values, ORDER.filter((k) => state.on.has(k)), KITS)
const grab = (name, body, type = 'text/plain') => {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([body], { type }))
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000)
}

/* Nothing downloads until you have seen what it is.
 *
 * The old sandbox got this right and the first version here threw it away:
 * pressing Export dropped five files into someone's Downloads folder with no
 * account of what they were. A package you have not read is a package you do
 * not trust — and the two things worth reading are the contrast audit and the
 * list of what this system CANNOT express. */
/* The frame, as a file. Byte for byte the same document the preview renders —
 * the kit's compiled CSS, your values over it, the screens in the kit's own
 * classes — so what you downloaded cannot differ from what you looked at. */
function screensHtml() {
  const id = state.show
  const r = route(state.values, ORDER.filter((k) => state.on.has(k)), KITS).find((x) => x.kit === id)
  const vars = { ...(r?.vars ?? {}) }
  if (id === 'material') Object.assign(vars, DERIVED.light ?? {})
  return `<!doctype html><meta charset="utf-8"><title>${describe(stack(state.on, KITS), KITS)}</title>
<style>${CSS[id] ?? ''}</style>
<style>:root{${Object.entries(vars).map(([k, v]) => `${k}:${v}`).join(';')}}</style>
<body>${WALLS[id] ?? ''}`
}

const DESTS = [
  { t: 'Everything', d: 'one .zip — theme, install, manifest, agent brief', go: (f) =>
      grab('design-system.zip', zip(plain(f)), 'application/zip') },
  { t: 'Just the theme', d: 'theme.css, to drop in next to your kits', go: (f) => grab('theme.css', f['theme.css']) },
  { t: 'For a coding agent', d: 'DESIGN-SYSTEM.md — what it is and what not to invent', go: (f) => grab('DESIGN-SYSTEM.md', f['DESIGN-SYSTEM.md']) },
  { t: 'The manifest', d: 'versions, licences, and what could not be done', go: (f) => grab('MANIFEST.md', f['MANIFEST.md']) },
  { t: 'These screens, as one HTML file', wide: true,
    d: 'exactly what you are looking at — the kit\'s CSS, your values, its classes. Open it in a browser.',
    go: () => grab('screens.html', screensHtml(), 'text/html') },
]

function openSheet() {
  const f = files()
  const on = ORDER.filter((k) => state.on.has(k))
  const audit = auditContrast(state.values)
  const bad = audit.filter((p) => !p.passes)

  $('#sum').textContent = `${Object.keys(state.values).length} settings · ${on.length} kit${on.length > 1 ? 's' : ''} · ${Object.keys(plain(f)).length} files`

  $('#facts').innerHTML = [
    ...ROLES.filter((r) => state.values[r.id] != null).map((r) => `<span class="fact">${
      r.kind === 'colour' ? `<i style="background:${state.values[r.id]}"></i>` : ''}${r.label} <b>${state.values[r.id]}</b></span>`),
    ...on.map((k) => `<span class="fact">${KITS[k].name} <b>${KITS[k].version ?? 'live'}</b></span>`),
  ].join('')

  $('#dests').innerHTML = DESTS.map((d, i) => `<button class="dest${d.wide ? ' dest--wide' : ''}" data-d="${i}"><b>${d.t}</b><span>${d.d}</span></button>`).join('')

  $('#clabel').textContent = `Contrast — ${audit.length - bad.length} of ${audit.length} pairs clear their floor`
  $('#pairs').innerHTML = audit.map((p) => `<li${p.passes ? '' : ' data-bad'}>
    <span class="${p.passes ? 'ok' : 'no'}">${p.passes ? '✓' : '✗'}</span>
    <span>${p.label}</span><em>${p.ratio}:1</em></li>`).join('')

  const cav = section(f['MANIFEST.md'], '## What could not be done')
    .map((l) => l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>'))
  $('#csection').hidden = !cav.length
  $('#caveats').innerHTML = cav.map((c) => `<li>${c}</li>`).join('')
  $('#sheet').showModal()
}
$('#dests').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  DESTS[Number(b.dataset.d)].go(files())
})
$('#download').addEventListener('click', openSheet)
$('#manifest').addEventListener('click', openSheet)
$('#sheetx').addEventListener('click', () => $('#sheet').close())

/* The two font knobs start on whatever the kit under them publishes. Seeding
 * them with a face we like would be the one opinion this tool is not allowed to
 * have — and it would silently overwrite the kit's own default on load. */
for (const role of TYPE) {
  if (state.values[role.id]) continue
  const base = KITS[stack(state.on, KITS).base]?.name
  const own = FONTS.stacks.find((f) => f.from.includes(base)) ?? FONTS.stacks[0]
  state.values[role.id] = own?.family ?? 'system-ui, sans-serif'
}

sync()
addEventListener('load', () => setTimeout(paint, 60))
</script>
