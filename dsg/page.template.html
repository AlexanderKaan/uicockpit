/* ── typography ───────────────────────────────────────────────────────────── */
/* Two published sources and no third. The kits publish system stacks — Open
 * Props alone names six — and Google publishes 1821 families with their own
 * category and popularity order. We add no list, no ranking and no favourites.
 *
 * A specimen is shown in its own face, which means loading it. Google's `text=`
 * parameter returns a font subset to just the pangram's glyphs, so a page of
 * forty specimens costs a few kilobytes rather than a few megabytes, and a face
 * is only fetched once it is actually scrolled into view. */
const PANGRAM = 'The five boxing wizards jump quickly together'
const GOOGLE = new Map(FONTS.google.map((f) => [f.family, f]))
const FALLBACK = { 'Sans Serif': 'sans-serif', Serif: 'serif', Display: 'sans-serif',
  Handwriting: 'cursive', Monospace: 'monospace' }
/* the stack we WRITE: their family, then the generic its own category names, so
   a face that fails to load still lands somewhere sane */
const stackFor = (f) => f.stack ? f.family : `'${f.family}', ${FALLBACK[f.category] ?? 'sans-serif'}`
const familyOf = (value) => String(value ?? '').split(',')[0].replace(/['"]/g, '').trim()

const loaded = new Set()
function loadFace(doc, family, { specimen = false } = {}) {
  if (!GOOGLE.has(family)) return
  const key = `${specimen ? 's' : 'f'}:${family}`
  const id = `gf-${key.replace(/[^a-z0-9]/gi, '-')}`
  if (doc.getElementById(id)) return
  const link = doc.createElement('link')
  link.rel = 'stylesheet'; link.id = id
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family).replace(/%20/g, '+')}`
    + (specimen ? `&text=${encodeURIComponent(PANGRAM)}` : ':wght@400;500;600;700') + '&display=swap'
  doc.head.appendChild(link)
  loaded.add(key)
}

function typoCards() {
  $('#typo').innerHTML = TYPE.map((r) => {
    const value = state.values[r.id]
    const fam = familyOf(value)
    const g = GOOGLE.get(fam)
    const stack = FONTS.stacks.find((s) => s.family === value)
    return `<button class="font" data-font="${r.id}">
      <span class="font__role">${r.label}<em>tap to change</em></span>
      <span class="font__name" style="font-family:${value.replace(/"/g, '&quot;')}">${stack ? stack.name : fam}</span>
      <span class="font__from">${g ? `Google · ${(g.tags ?? []).length ? g.tags.join(' ') : g.category}${g.variable ? ' · variable' : ''}`
        : stack ? `${stack.from.join(', ')} · system stack` : 'system stack'}</span></button>`
  }).join('')
  for (const r of TYPE) loadFace(document, familyOf(state.values[r.id]))
}
/* ── which rung of the wall ───────────────────────────────────────────────── */
/* ── light or dark ────────────────────────────────────────────────────────── */
/* Each kit is switched with ITS OWN mechanism, read from the same table the
 * generated file uses: shadcn keys on .dark, Bootstrap on data-bs-theme,
 * Mantine on data-mantine-color-scheme, daisyUI on data-theme, Radix on
 * .dark-theme. A class of our own would be a dark mode their components never
 * see — which is precisely the mistake daisyUI's prefersdark taught. */
const DARK_ROOT = {
  shadcn: (el, on) => el.classList.toggle('dark', on),
  radix: (el, on) => { el.classList.toggle('dark', on); el.classList.toggle('light', !on) },
  bootstrap: (el, on) => el.setAttribute('data-bs-theme', on ? 'dark' : 'light'),
  mantine: (el, on) => el.setAttribute('data-mantine-color-scheme', on ? 'dark' : 'light'),
  daisyui: (el, on) => el.setAttribute('data-theme', on ? 'yourkitdark' : 'yourkit'),
}
function drawModes() {
  const kit = state.show
  const can = !!DARKSWITCH[kit]
  $('#modes').hidden = !can
  if (!can) { state.mode = 'light'; return }
  $('#modes').innerHTML = [['light', 'Light'], ['dark', 'Dark']]
    .map(([id, label]) => `<button role="radio" data-m="${id}" aria-checked="${id === state.mode}">${label}</button>`).join('')
}
$('#modes').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  state.mode = b.dataset.m; drawModes(); paint()
})

/* ── where you are on the wall ────────────────────────────────────────────── */
/* The wall is a strip you pan through six boards. These are not filters — they
 * are STOPS: the wall never hides anything, so pressing one takes you there and
 * panning past one lights it. A filter would answer the question "what is on
 * this wall" by removing most of it. */
function drawBoards() {
  $('#rungs').innerHTML = BOARDS.map((b) =>
    `<button role="radio" data-g="${b.id}" aria-checked="${b.id === state.board}" title="${b.note}">${b.label}</button>`).join('')
}
$('#rungs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  goTo(b.dataset.g)
})
function goTo(id) {
  state.board = id; drawBoards()
  const f = $('#f_' + state.show), el = f?.contentDocument?.getElementById('b_' + id)
  el?.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' })
}
/* and the other direction: pan the wall and the stops keep up. One listener per
 * frame, added the first time that frame is looked at. */
const WATCHED = new WeakSet()
function watch(f) {
  const strip = f.contentDocument?.getElementById('strip')
  if (!strip || WATCHED.has(strip)) return
  WATCHED.add(strip)
  let queued = false
  strip.addEventListener('scroll', () => {
    if (queued) return
    queued = true
    requestAnimationFrame(() => {
      queued = false
      /* THE MIDDLE OF YOUR VIEW DECIDES, NOT THE LEFT EDGE PLUS FORTY.
         With the old rule a board filling most of the screen kept the previous
         tab lit until its start crossed the far left — and the LAST board could
         never win at all: you can only scroll to scrollWidth minus the
         viewport, so a final board wider than the viewport keeps its start
         forever out of reach. Panned to the end, the end is what you are on. */
      const atEnd = strip.scrollLeft >= strip.scrollWidth - strip.clientWidth - 2
      const edge = strip.scrollLeft + strip.clientWidth / 2
      let here = BOARDS[0].id
      for (const b of BOARDS) {
        const el = strip.querySelector(`#b_${b.id}`)
        if (el && el.offsetLeft <= edge) here = b.id
      }
      if (atEnd) here = BOARDS.at(-1).id
      if (here !== state.board) { state.board = here; drawBoards() }
    })
  }, { passive: true })
}

/* ── the font picker ──────────────────────────────────────────────────────── */
let pickRole = 'fontBody', pickTab = 'kits'

  }).join('') + (pool.length > rows.length
    ? `<button class="btn" id="pickmore" style="width:100%">Show ${Math.min(PAGE, pool.length - rows.length)} more of ${pool.length}</button>` : '')
  for (const el of $('#picklist').querySelectorAll('[data-family]:not([data-family=""])')) seeing.observe(el)

/* What the kit you are LOOKING at publishes for the two roles a bar would
 * otherwise decide — its border and its muted text. Both the palette row and
 * the one-colour field need it, and a second copy of it is a second answer. */
function seenRef() {

  const ref = {}
  for (const role of ['line', 'inkMuted']) {
    const v = MAP[seen.id]?.[role]?.var
    if (v && seen.modes?.light?.[v]) ref[role] = seen.modes.light[v]

}

const HEX6 = /^#[0-9a-f]{6}$/i

/* ── the colour picker ────────────────────────────────────────────────────── */
/* A slice of OKLCH at one hue: lightness up, chroma right, and the sRGB
 * boundary drawn rather than clipped past. The browser's own picker is an
 * operating-system dialog — unstylable, and it works in HSV, where a step up
 * near yellow is nothing like a step up near blue. This runs on the same maths
 * every value in this tool already goes through.
 *
 * The plane is drawn small and scaled up. At full size it is 36,000 conversions
 * per repaint; at 120x75 it is 9,000, and the gradient is smooth either way
 * because a gradient is what it is. It redraws only when the HUE changes — the
 * marker is an element over the canvas, not a pixel in it. */
const CP = { L: 0.5, C: 0.1, H: 200, apply: null }
const PW = 120, PH = 75
const cpOff = document.createElement('canvas')
cpOff.width = PW; cpOff.height = PH
const cpOffCtx = cpOff.getContext('2d')
const cpCtx = $('#cpplane').getContext('2d')

function cpPlane() {
  /* EVERY ROW GETS ITS OWN EDGE.
   *
   * The first version put one chroma axis across the whole slice, at the most
   * the hue can reach anywhere. The gamut is a wedge, not a rectangle — hue 200
   * reaches 0.14 near white and 0.03 near black — so two thirds of the box was
   * a colour no screen can show, and it read as a broken control rather than as
   * a fact about sRGB. Now the axis means "as far as this lightness can go",
   * every pixel in the box is a colour you can have, and the fine print says so.
   */
  const img = cpOffCtx.createImageData(PW, PH)
  const d = img.data
  for (let y = 0; y < PH; y++) {
    const L = 1 - y / (PH - 1)
    const edge = maxChroma(L, CP.H)
    for (let x = 0; x < PW; x++) {
      const h = oklchToHex(L, (x / (PW - 1)) * edge, CP.H)
      const i = (y * PW + x) * 4
      d[i] = parseInt(h.slice(1, 3), 16)
      d[i + 1] = parseInt(h.slice(3, 5), 16)
      d[i + 2] = parseInt(h.slice(5, 7), 16)
      d[i + 3] = 255
    }
  }
  cpOffCtx.putImageData(img, 0, 0)
  const c = $('#cpplane')
  cpCtx.clearRect(0, 0, c.width, c.height)
  cpCtx.imageSmoothingEnabled = true
  cpCtx.drawImage(cpOff, 0, 0, c.width, c.height)
}

const cpHex = () => oklchToHex(CP.L, CP.C, CP.H)

function cpShow() {
  const edge = Math.max(1e-4, maxChroma(CP.L, CP.H))
  CP.C = Math.min(CP.C, edge)
  const hex = cpHex()
  $('#cpdot').style.left = `${(CP.C / edge) * 100}%`
  $('#cpdot').style.top = `${(1 - CP.L) * 100}%`
  $('#cpwell').style.background = hex
  if (document.activeElement !== $('#cphex')) $('#cphex').value = hex
  $('#cpcalled').textContent = nameColor(hex)
  /* the two questions a brand colour has to answer, asked while you are still
     choosing it rather than in a report afterwards */
  const ink = aaInk(hex), page = state.values.page ?? '#ffffff'
  const rows = [
    ['Text on it', contrast(ink, hex), 4.5, `${ink === '#ffffff' ? 'white' : 'black'}`],
    ['It on the page', contrast(hex, page), 3, null],
  ]
  $('#cppairs').innerHTML = rows.map(([label, r, min, how]) => {
    const ok = r >= min
    return `<li${ok ? '' : ' data-bad'}><span class="${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'}</span>
      <span>${label}${how ? `, ${how}` : ''}</span><em>${r.toFixed(2)}:1</em></li>`
  }).join('')
  CP.apply?.(hex)
}

function cpOpen(hex, title, sum, apply) {
  const [L, C, H] = hexToOklch(hex)
  CP.L = L; CP.C = C; CP.H = H; CP.apply = null
  $('#cptitle').textContent = title
  $('#cpsum').textContent = sum
  $('#cphue').value = Math.round(H)
  cpPlane(); cpShow()
  CP.apply = apply
  $('#cpick').showModal()
}
$('#cpx').addEventListener('click', () => $('#cpick').close())
$('#cpick').addEventListener('click', (e) => { if (e.target.id === 'cpick') $('#cpick').close() })
$('#cphue').addEventListener('input', (e) => {
  /* what one lightness can hold changes with the hue, so a chroma that fitted
     at 320 may not fit at 200 — cpShow clamps it rather than letting oklchToHex
     clip it, because clipping turns a colour instead of dimming it */
  CP.H = Number(e.target.value)
  cpPlane(); cpShow()
})

let cpDrag = false
const cpAt = (e) => {
  const r = $('#cpplane').getBoundingClientRect()
  CP.L = 1 - Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))
  CP.C = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * maxChroma(CP.L, CP.H)
  cpShow()
}
$('#cpfield').addEventListener('pointerdown', (e) => { cpDrag = true; $('#cpfield').setPointerCapture(e.pointerId); cpAt(e) })
$('#cpfield').addEventListener('pointermove', (e) => { if (cpDrag) cpAt(e) })
addEventListener('pointerup', () => { cpDrag = false })
/* and by keyboard, because a colour you can only reach with a mouse is a colour
   half the people who need this tool cannot set */
$('#cpfield').addEventListener('keydown', (e) => {
  const step = e.shiftKey ? 0.05 : 0.01
  const move = { ArrowUp: [step, 0], ArrowDown: [-step, 0], ArrowRight: [0, step / 3], ArrowLeft: [0, -step / 3] }[e.key]
  if (!move) return
  e.preventDefault()
  /* the arrows move the FRACTION, so a step sideways is the same size wherever
     you are — which is the whole reason for a per-row edge */
  const was = maxChroma(CP.L, CP.H)
  const t = was > 1e-4 ? CP.C / was : 0
  CP.L = Math.max(0, Math.min(1, CP.L + move[0]))
  CP.C = Math.max(0, Math.min(1, t + move[1] * 3)) * maxChroma(CP.L, CP.H)
  cpShow()
})
$('#cphex').addEventListener('input', (e) => {
  const v = e.target.value.trim()
  if (!HEX6.test(v)) return
  const [L, C, H] = hexToOklch(v)
  CP.L = L; CP.C = C
  if (Math.abs(H - CP.H) > 0.5) { CP.H = H; $('#cphue').value = Math.round(H); cpPlane() }
  cpShow()
})

/* ── one colour, and the other ten derived from it ────────────────────────── */
/* Every generator in this space has a box that takes a brand colour, and every
 * one of them fills the rest with an opinion. We are not allowed one, and it
 * turns out we do not need one — the kits have already published every
 * relationship this needs. What comes back is written into the roles, and the
 * line underneath says which kit answered for what. */
function buildFrom(value) {
  const out = fromOneColour(value, stack(state.on, KITS).order, KITS, seenRef())
  if (!out) return false
  Object.assign(state.values, out.values)
  /* the palette row's selection would be a lie now */
  palAt = null; palNeutral = null; palShort = out.short
  seedNote(out)
  sync(); paint()
  return true
}
const SEED_OPENING = 'One colour, and the other ten come from what your stack publishes. No palette of ours anywhere in it.'
function seedNote(out) {
  if (!out) return ($('#seednote').textContent = SEED_OPENING)
  const named = [...new Set(out.derived.filter((d) => d.from).map((d) => d.from))]
  $('#seednote').innerHTML = `The greys are <b>${out.neutral.from}</b>'s <b>${out.neutral.name}</b>, the ramp whose hue sits closest to yours. `
    + (named.length ? `Success, warning and danger are ${named.map((n) => `<b>${n}</b>`).join(' and ')}'s own, unchanged. ` : '')
    + 'The focus ring is your colour; the ink on it is whichever of black or white clears 4.5:1.'
    + (out.short.length ? ` <b>${out.short.join(' and ')}</b> could not be met from this; see the checks.` : '')
}
$('#seedwell').addEventListener('click', () => cpOpen(state.values.brand ?? '#6644FC', 'Your colour',
  'The one thing you say. Everything else is read out of what your stack publishes.',
  (hex) => { $('#seedhex').value = hex; buildFrom(hex) }))
$('#seedhex').addEventListener('input', (e) => {
  const v = e.target.value.trim()
  if (!HEX6.test(v)) return                    // half-typed is not wrong yet
  buildFrom(v)
})

/* ── palette families ─────────────────────────────────────────────────────── */
/* Picking one writes seven roles at once: the extremes straight out of their
 * ramp, and the two in the middle — muted ink and the line — at the WCAG floor
 * for body text and for a non-text boundary, because those are the two taste
 * usually decides and a published bar is a better decider. */
let palAt = null, palNeutral = null, palShort = []
function renderPalettes() {
  const st = stack(state.on, KITS)
  const all = palettesFor(st.order, KITS)
  const accents = all.filter((p) => p.kind === 'accent')
  const neutrals = all.filter((p) => p.kind === 'neutral')
  /* say where the current one came from — a palette you cannot trace is a
     palette we might as well have invented */
  $('#palnote').textContent = !accents.length
    ? 'This stack publishes no colour families. Set the roles below by hand.'
    : palAt
      ? `${palAt.split(':')[1]} from ${KITS[palAt.split(':')[0]].name}, with ${palNeutral ?? 'its'} for the greys`
        + (palShort.length ? `. ${palShort.join(' and ')} could not be met from this family; see the contrast list.` : '')
      : `${accents.length} families your stack publishes${neutrals.length ? `, each matched to one of its ${neutrals.length} greys` : ''}`
  $('#palettes').innerHTML = accents.map((p, i) => {
    const five = [0, 0.25, 0.5, 0.75, 1].map((f) => p.ramp[Math.round(f * (p.ramp.length - 1))])
    return `<button class="pal" data-pal="${i}" aria-pressed="${palAt === `${p.kit}:${p.name}`}"
      title="${p.name} · ${p.from}"><span class="pal__ramp">${five.map((c) => `<i style="background:${c}"></i>`).join('')}</span>
      <span class="pal__name">${p.name}</span></button>`
  }).join('')
  return { accents, neutrals }
}
$('#palettes').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-pal]'); if (!b) return
  const { accents, neutrals } = renderPalettes()
  const pick = accents[Number(b.dataset.pal)]; if (!pick) return
  const own = neutrals.filter((n) => n.kit === pick.kit)
  const { values, short } = paletteRoles(pick, matchNeutral(pick, own, KITS[pick.kit]) ?? neutrals[0], KITS[pick.kit], seenRef())
  palShort = short
  Object.assign(state.values, values)
  palAt = `${pick.kit}:${pick.name}`
  palNeutral = (matchNeutral(pick, own, KITS[pick.kit]) ?? neutrals[0])?.name ?? null
  sync(); paint()
})

/* ── a role, and the colours your stack has for it ────────────────────────── */
/* The eleven roles below are DERIVED — from your one colour, from a family you
 * picked, from a bar. Handing each one a free colour wheel invites exactly the
 * drift this tool exists to prevent: a border nobody chose, three greys that
 * are nearly the same. So the swatch opens a list of the colours your stack
 * actually publishes for that job, each with its own name and, where it means
 * something, what it measures. A free colour is still one press away — it is
 * just no longer the first thing offered. */
const AGAINST = { ink: 'page', inkMuted: 'page', line: 'surface', onBrand: 'brand' }
const FLOOR = { ink: 4.5, inkMuted: 4.5, line: 3, onBrand: 4.5 }

function roleOptions(role) {
  const st = stack(state.on, KITS)
  const all = palettesFor(st.order, KITS)
  const brand = state.values.brand ?? '#000000'
  const out = []
  const push = (hex, label, from) => { if (hex && !out.some((o) => o.hex.toLowerCase() === hex.toLowerCase())) out.push({ hex, label, from }) }

  /* WHAT THE KITS YOU HAVE ON SET THIS TO, whatever the role is.
   *
   * Material publishes no colour families at all — its colours are semantic
   * roles, not ramps — so on that stack the Brand menu offered nothing but the
   * colour already in it and a link to a colour wheel. Asking the routing table
   * what each kit calls this role, and what it set it to, is an answer every
   * kit can give. */
  for (const id of st.order) { const s = seedFrom(role, KITS, [id]); if (s) push(s.value, s.variable, s.from) }

  if (role === 'brand' || role === 'focus') {
    /* the solid of every family they publish — the step a button wears */
    for (const f of all.filter((x) => x.kind === 'accent')) {
      push(KITS[f.kit]?.choices?.brand?.of?.[f.name] ?? f.ramp.reduce((a, c) => (hexToOklch(c)[1] > hexToOklch(a)[1] ? c : a)), f.name, f.from)
    }
  } else if (role === 'onBrand') {
    push('#ffffff', 'white', null)
    push('#000000', 'black', null)
  } else if (role === 'success' || role === 'warning' || role === 'danger') {
    /* and everyone else's, not only the stack's: these are roles a kit may have
       no variable for and you still have to set — the Checks bar says which */
    for (const id of Object.keys(KITS).filter((k) => !st.order.includes(k))) {
      const s = seedFrom(role, KITS, [id]); if (s) push(s.value, s.variable, s.from)
    }
  } else {
    /* page, surface, ink, muted ink, line: the grey ramp matched to your brand,
       step by step, under their own names */
    const neutrals = all.filter((x) => x.kind === 'neutral')
    const mine = { name: 'yours', ramp: [brand], chroma: hexToOklch(brand)[1] }
    const grey = matchNeutral(mine, neutrals) ?? neutrals[0]
    if (grey) grey.ramp.forEach((hex, i) => push(hex, `${grey.name}-${grey.at[i]}`, grey.from))
  }
  return out
}

/* Why a role has no scale to offer — the same three answers the Checks bar
 * gives, read out of the same routing table. */
function roleWhy(role) {
  const derives = lastRouted.filter((r) => (r.derived ?? []).some((d) => d.role === role))
  const chosen = lastRouted.filter((r) => (r.chosen ?? []).some((c) => c.role === role))
  if (derives.length) return `${KITS[derives[0].kit].name} computes this one from your brand, so it publishes no scale for it. Whatever you set still goes into the download.`
  if (chosen.length) return `${KITS[chosen[0].kit].name} takes a named setting here rather than a value, and picks the nearest one to what you set.`
  return 'Nothing in this stack publishes a scale for this role. Whatever you set still goes into the download, and the Checks bar says which kit will read it.'
}

let rpRole = null
function openRole(role) {
  rpRole = SWATCH.find((r) => r.id === role)
  if (!rpRole) return
  const bg = state.values[AGAINST[role]]
  const floor = FLOOR[role]
  $('#rptitle').textContent = rpRole.label
  $('#rpsum').textContent = rpRole.what
  const opts = roleOptions(role)
  /* the value it has NOW, when that is not one of the published steps — because
     it came from a bar, or from the picker, or from a family you have since
     changed. A menu that cannot show you where you are is a menu you cannot
     leave and come back to. */
  const here = state.values[role]
  if (here && !opts.some((o) => o.hex.toLowerCase() === here.toLowerCase())) {
    opts.unshift({ hex: here, label: here, from: 'what it is now' })
  }
  $('#rplist').innerHTML = opts.map((o) => {
    const r = bg ? contrast(role === 'onBrand' ? o.hex : o.hex, bg) : null
    const bad = r != null && floor != null && r < floor
    return `<li><button class="rp" data-hex="${o.hex}" aria-pressed="${(state.values[role] ?? '').toLowerCase() === o.hex.toLowerCase()}">
      <i style="background:${o.hex}"></i>
      <span class="rp__name">${o.label}</span>
      <span class="rp__from">${o.from ?? ''}</span>
      ${r != null ? `<em${bad ? ' data-bad' : ''}>${r.toFixed(2)}:1</em>` : '<em></em>'}</button></li>`
  }).join('')
  /* a menu with nothing in it but the colour already there should say WHY, not
     shrug and point at a colour wheel. The reason is in the routing table. */
  const bare = opts.filter((o) => o.from !== 'what it is now').length === 0
  $('#rpnone').hidden = !bare
  if (bare) $('#rpnone').textContent = roleWhy(role)
  $('#rolepick').showModal()
}
$('#rplist').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-hex]'); if (!b || !rpRole) return
  state.values[rpRole.id] = b.dataset.hex
  palAt = null; palNeutral = null
  sync(); paint()
  $('#rolepick').close()
})
$('#rpfree').addEventListener('click', () => {
  const role = rpRole
  $('#rolepick').close()
  cpOpen(state.values[role.id] ?? '#000000', role.label, role.what, (hex) => {
    state.values[role.id] = hex
    palAt = null; palNeutral = null
    sync(); paint()
  })
})
$('#rpx').addEventListener('click', () => $('#rolepick').close())
$('#rolepick').addEventListener('click', (e) => { if (e.target.id === 'rolepick') $('#rolepick').close() })

/* ── the colour cards ───────────────────────────────────────────────────────
 * The composer shows colours as CARDS with names, not as a hex field with a
 * swatch grid: things you pick up, each opening its own sheet. The main card
 * summons the colour sheet (seed well + the stack's families, moved there from
 * the old in-card form); a semantic card opens that role's published options;
 * neutrals and the "+" open the by-hand grid, because that is where those
 * eleven actually live. */
function drawColourCards() {
  const v = state.values
  const call = (hex) => { try { return nameColor(hex) } catch { return '' } }
  const neutrals = ['page', 'surface', 'line', 'inkMuted', 'ink']
  const stripes = neutrals.map((r, i) => `${v[r]} ${i * 20}% ${(i + 1) * 20}%`).join(', ')
  const semantic = ['success', 'warning', 'danger']
  const roleCard = (role) => {
    const r = SWATCH.find((x) => x.id === role)
    return `<button class="ccard ccard--mini" data-act="role" data-role="${role}"
      title="${call(v[role])}${r ? ' · ' + r.what : ''}">
      <span class="ccard__fill" style="background:${v[role]}"></span>
      <span class="ccard__on" style="color:${aaInk(v[role])}">${r ? r.label : role}</span></button>`
  }
  $('#colourcards').innerHTML = `
    <button class="ccard ccard--tall" data-act="brand" title="the colour a primary action wears">
      <span class="ccard__fill" style="background:${v.brand}"></span>
      <span class="ccard__tag">MAIN</span>
      <span class="ccard__meta"><span class="ccard__role">Brand</span>
        <span class="ccard__val">${call(v.brand)}</span>
        <span class="ccard__hex">${v.brand}</span></span></button>
    <button class="ccard ccard--tall" data-act="all" title="page, surface, line and both inks">
      <span class="ccard__fill" style="background:linear-gradient(180deg, ${stripes})"></span>
      <span class="ccard__meta"><span class="ccard__role">Neutrals</span>
        <span class="ccard__val">Page to ink</span></span></button>
    ${semantic.map(roleCard).join('')}
    <button class="ccard ccard--mini ccard--more" data-act="all" title="every colour role, one well each">
      <span class="ccard__fill">+</span></button>`
}
$('#colourcards').addEventListener('click', (e) => {
  const b = e.target.closest('.ccard')
  if (!b) return
  if (b.dataset.act === 'brand') $('#brandsheet').showModal()
  else if (b.dataset.act === 'role') openRole(b.dataset.role)
  else { const d = $('#allroles'); d.open = true; d.scrollIntoView({ block: 'nearest', behavior: 'smooth' }) }
})
$('#brandx').addEventListener('click', () => $('#brandsheet').close())
$('#brandsheet').addEventListener('click', (e) => { if (e.target.id === 'brandsheet') $('#brandsheet').close() })

$('#swatches').innerHTML = SWATCH.map((r) => `<button class="sw" data-role="${r.id}" title="${r.what}">
  <i class="sw__well" data-r="${r.id}"></i>
  <span>${r.label}</span><code data-hex="${r.id}">${state.values[r.id]}</code></button>`).join('')
$('#swatches').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-role]'); if (!b) return
  openRole(b.dataset.role)
})

const knobHtml = (k) => {
  const role = ROLES.find((r) => r.id === k.id)
  return `<div class="knob"><label for="k_${k.id}">${role.label}<b data-v="${k.id}">${shown(k, state.values[k.id])}</b></label>
    <input id="k_${k.id}" type="range" data-r="${k.id}" min="${k.min}" max="${k.max}" step="${k.step}" value="${slider(k, state.values[k.id])}"></div>`
}
$('#knobs').innerHTML = LENGTHS.filter((k) => k.group === 'shape').map(knobHtml).join('')
$('#typeknobs').innerHTML = LENGTHS.filter((k) => k.group === 'type').map(knobHtml).join('')
for (const host of ['#knobs', '#typeknobs']) {
  $(host).addEventListener('input', (e) => {
    const k = LENGTHS.find((x) => x.id === e.target.dataset.r); if (!k) return
    state.values[k.id] = store(k, e.target.value)
    $(`[data-v="${k.id}"]`).textContent = shown(k, state.values[k.id])
    paint()
  })
}

/* THE SPECIMEN IS THE VALUES, DRAWN. Not a button — the wall below has real
   ones, and a second, fake button beside it is exactly the confusion the wall
   exists to prevent. These are the corner, the border and the lift themselves,
   at the size that preset's spacing gives them. */
function drawFeel() {
  const here = PRESETS.find((b) => Object.entries(b.values).every(([k, v]) => state.values[k] === v))
  $('#chips').innerHTML = PRESETS.map((b) => {
    const v = { ...state.values, ...b.values }
    const e = parseFloat(v.elevation ?? 1)
    const lift = e > 0.05 ? `0 ${Math.max(1, Math.round(2 * e))}px ${Math.round(7 * e)}px rgb(17 17 18 / .16)` : 'none'
    const pad = `${Math.round(9 * parseFloat(v.space ?? 1))}px`
    return `<button class="feel" data-b="${b.label}" aria-pressed="${b === here}">
      <span class="feel__art" style="padding:${pad} 6px">
        <i style="border-radius:${v.radius};box-shadow:${lift};background:${state.values.brand}"></i>
        <i style="border-radius:${v.radius};border:${v.borderWidth} solid ${state.values.line};background:${state.values.surface}"></i>
      </span>
      <span class="feel__name">${b.label}</span></button>`
  }).join('')
}
drawFeel()
$('#chips').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return
  const b = PRESETS.find((x) => x.label === btn.dataset.b); if (!b) return
  Object.assign(state.values, b.values)
  sync(); paint()
  note(`<b>${b.label}</b>: ${b.why}. Every value it moved is still a slider under "by hand".`)
})

/* the same for type: a scale, shown at the size it means */
function drawScale() {
  const here = TYPE_SCALES.find((t) => Object.entries(t.values).every(([k, v]) => state.values[k] === v))
  $('#scales').innerHTML = TYPE_SCALES.map((t) => `<button class="feel" data-t="${t.label}" aria-pressed="${t === here}">
    <span class="feel__art feel__art--type" style="font-size:${t.values.baseText};line-height:${t.values.lineHeight}">
      Body text<br>set here</span>
    <span class="feel__name">${t.label} <em>${t.values.baseText}</em></span></button>`).join('')
}
drawScale()
$('#scales').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return
  const t = TYPE_SCALES.find((x) => x.label === btn.dataset.t); if (!t) return
  Object.assign(state.values, t.values)
  sync(); paint()
  note(`<b>${t.label}</b>: ${t.why}. Line height moves with it, the way a kit publishes the pair.`)
})

$('#shuffle').addEventListener('click', shuffle)

function shuffle() {
  /* Within the floors, always — and with the SAME maths the export uses, not a
     hand-rolled HSL twin. A shuffle that can hand you an unreadable combination
     is a shuffle nobody can trust; that is the whole difference between this and
     a random palette. */
  const hue = Math.floor(Math.random() * 360)
  const brand = oklchToHex(0.42 + Math.random() * 0.16, 0.10 + Math.random() * 0.09, hue)
  const greys = okNeutralScale(hue, 20 + Math.random() * 40, false, Math.random() < 0.25, 1).map(oklchStrToHex)
  Object.assign(state.values, {
    /* aaInk: this function promises never to hand you an unreadable pair, and
       readableInk splits on luminance without checking whether the split
       actually clears 4.5:1. It does not, for a whole band of mid blues. */
    brand, onBrand: aaInk(brand),
    page: greys[1], surface: greys[0], line: greys[5], inkMuted: greys[10] ?? greys.at(-3), ink: greys.at(-1),
    radius: [2, 6, 10, 16][Math.floor(Math.random() * 4)] + 'px',
  })
  sync(); paint()
  const bad = auditContrast(state.values).filter((p) => !p.passes)
  note(bad.length
    ? `Rolled <b>${nameColor(brand)}</b>. ${bad.length} pair${bad.length > 1 ? 's are' : ' is'} under its floor. Use this kit shows which.`
    : `Rolled <b>${nameColor(brand)}</b>. Every contrast pair clears its floor.`)
}

function sync() {
  /* the knob CONTROLS only. The font cards carry a role too, and sweeping
     every [data-r] on the page walked into them looking for a slider readout
     that does not exist — the same trap as hooking code on a styling class,
     one attribute along. */
  for (const el of $('#swatches').querySelectorAll('[data-r]')) {
    const v = state.values[el.dataset.r]
    el.style.background = v
    $(`[data-hex="${el.dataset.r}"]`).textContent = v
  }
  for (const el of document.querySelectorAll('#knobs [data-r], #typeknobs [data-r]')) {
    const k = LENGTHS.find((x) => x.id === el.dataset.r), v = state.values[el.dataset.r]
    el.value = slider(k, v); $(`[data-v="${el.dataset.r}"]`).textContent = shown(k, v)
  }
  /* and the one-colour field follows the brand, however the brand was set —
     by hand in the swatch row, by a palette, or by a shuffle */
  if (HEX6.test(state.values.brand ?? '')) {
    $('#seedwell').style.background = state.values.brand
    if (document.activeElement !== $('#seedhex')) $('#seedhex').value = state.values.brand
  }
  renderStack()
  renderPalettes()
  typoCards()
  drawBoards()
  drawModes()
  summaries()
}

/* ── the checks, next to the wall ─────────────────────────────────────────── */
/* Five questions this tool can answer about the system you are building, asked
 * where you can still act on the answer.
 *
 * They used to live inside the export drawer, which is to say: you found out
 * what was wrong with your system at the moment you had finished making it. The
 * contrast one moves while you drag a colour; the other four move when you
 * change the stack. None of them is a guess — the contrast comes from your own
 * values, and the rest from the routing table and the counts this page was
 * built with.
 *
 * A check with nothing to report is still shown. "No name two kits both use" is
 * information, and a strip that only ever appears when something is wrong is a
 * strip nobody trusts when it is quiet. */
let openCheck = null
let lastRouted = []

function checks(routed) {
  const on = new Set(routed.map((r) => r.kit))
  const nameOf = (id) => KITS[id].name
  /* a check with nothing to report says so. An empty list under a heading reads
     as a list that failed to load. */
  const li = (rows, clear) => rows.length
    ? `<ul class="caveats">${rows.map((r) => `<li>${r}</li>`).join('')}</ul>`
    : `<ul class="caveats"><li>${clear}</li></ul>`

  /* 1 — contrast, the only one that moves while you drag a slider */
  const pairs = auditContrast(state.values)
  const bad = pairs.filter((p) => !p.passes)

  /* 2 — a value you set that this stack cannot take as you set it */
  const cannot = []
  for (const role of ROLES) {
    const v = state.values[role.id]
    if (v == null || v === '') continue
    const derives = routed.filter((r) => (r.derived ?? []).some((d) => d.role === role.id))
    const takes = routed.filter((r) => !(r.missing ?? []).includes(role.id)
      && !derives.some((d) => d.kit === r.kit))
    const builds = routed.filter((r) => (r.needsBuild ?? []).some((b) => b.role === role.id))
    if (!takes.length) {
      cannot.push(derives.length
        ? `<b>${role.label}</b>: <b>${nameOf(derives[0].kit)}</b> computes it from the brand, so your value does not reach it.`
        : `<b>${role.label}</b>: nothing in this stack has a variable for it.`)
    } else if (builds.length) {
      const line = (builds[0].needsBuild ?? []).find((x) => x.role === role.id)
      cannot.push(`<b>${role.label}</b>: <b>${nameOf(builds[0].kit)}</b> compiles it. ${line?.why ?? 'A rebuild puts it into the components'}.`
        + (line?.sass ? ` Your download carries <code>${line.sass}</code>.` : ''))
    }
  }

  /* 3 — a variable this theme writes that nothing reads */
  const orphans = UNREAD.filter((u) => on.has(u.kit))

  /* 4 — a name two kits both use */
  const clash = collisions(routed, KITS)

  /* 5 — what the frame in front of you cannot show. Not a fault in the system:
     a fault in the PREVIEW, and the difference is worth a line of its own. */
  const frame = []
  /* WHAT IS LEFT OF BOOTSTRAP'S BUILD.
     Its brand follows the knob now — every place it lands is a custom property
     and the page rewrites all forty from Bootstrap's own relationship. What it
     cannot rewrite is a DECISION rather than a relationship: Sass ran
     color-contrast() once and wrote #fff for the text on a filled button. On a
     dark brand that is still the answer, so this only speaks up when the brand
     has gone light enough that Bootstrap itself would have picked black. */
  const bsShown = state.compare ? comparing().includes('bootstrap') : state.show === 'bootstrap'
  if (bsShown && HEX6.test(state.values.brand ?? '') && relLum(state.values.brand) > 0.179) {
    frame.push(`<b>Bootstrap</b>: its text on a filled button is white, chosen by Sass against the brand it was built with. Yours is light enough that Bootstrap would now pick black, and that one choice is the half of it a running page cannot retake.`)
  }
  if (!LIVE_BRAND[state.show]) {
    frame.push(state.show === 'bootstrap'
      ? `<b>${nameOf(state.show)}</b>: its component colours are compiled by Sass, so this frame shows the build we made. Your download carries the Sass lines that change them.`
      : state.show === 'antd'
        ? `<b>${nameOf(state.show)}</b>: it publishes no stylesheet; its rules and its variables are generated by its own React at build time, so this frame shows the theme we built. Your download carries the token object that makes it.`
        : `<b>${nameOf(state.show)}</b>: it derives its colours from the seed with its own generator, so this frame shows a pre-derived scheme. Your download carries the seed.`)
  }
  /* the compiled roles are NOT repeated here: "this stack compiles it" is a
     fact about the system and lives in the check above. Saying it twice, once
     as a value and once as a preview, reads as two problems. */

  return [
    { k: 'contrast', label: 'Contrast', ok: !bad.length,
      chip: `Contrast <b>${pairs.length - bad.length} of ${pairs.length}</b>`,
      why: 'Only the pairs that really meet on screen, each against the floor WCAG sets for it: 4.5:1 for text (1.4.3), and 3:1 for the line that identifies a control (1.4.11). A pair nothing ever renders is not audited; a phantom failure is worse than none.',
      body: () => `<ul class="pairs">${pairs.map((p) => `<li${p.passes ? '' : ' data-bad'}>
        <span class="${p.passes ? 'ok' : 'no'}">${p.passes ? '✓' : '✗'}</span>
        <span>${p.label}</span><em>${p.ratio}:1</em></li>`).join('')}</ul>` },

    { k: 'lands', label: 'Values this stack can take', ok: !cannot.length,
      chip: cannot.length ? `<b>${cannot.length}</b> it decides for you` : 'Every value lands',
      why: 'A knob you turned that this stack answers itself, because it computes the value, because it compiles it, or because no kit here has a variable for it.',
      body: () => li(cannot, 'Nothing. Every value you set reaches this stack as you set it.') },

    { k: 'read', label: 'Variables nothing reads', ok: !orphans.length,
      chip: orphans.length ? `<b>${orphans.reduce((n, u) => n + u.names.length, 0)}</b> nothing reads` : 'Every variable is read',
      why: 'Counted in each kit\'s own stylesheet, and in its component code where its components are code rather than classes. A variable nobody reads is a knob that does nothing: it is written, it is in the download, and turning it changes not one pixel.',
      body: () => li(orphans.map((u) => `<b>${u.name} · ${u.role}</b>: ${u.names.map((n) => `<code>${n}</code>`).join(' ')}${
        u.tokensOnly ? '. A token layer publishes for your code; its own stylesheet reads none of it.'
          : u.instead.length ? `. What it does read is ${u.instead.slice(0, 3).map((n) => `<code>${n}</code>`).join(' ')}${u.instead.length > 3 ? ' and others' : ''}.` : '.'}`),
        'Nothing. Every variable this theme writes is read by the kit it belongs to.') },

    { k: 'clash', label: 'Names two kits both use', ok: !clash.length,
      chip: clash.length ? `<b>${clash.length}</b> shared name${clash.length > 1 ? 's' : ''}` : 'No shared names',
      why: 'These variables mean different things to different kits you enabled. Whichever stylesheet loads second wins, and nothing warns.',
      body: () => li(clash.map((c) => `<code>${c.variable}</code>, written for <b>${KITS[c.written].name}</b>, and <b>${KITS[c.read].name}</b> also reads it. Load their stylesheets in separate scopes, or drop one of the two.`),
        'Nothing. No variable in this stack means two different things.') },

    { k: 'frame', label: 'What this frame cannot show', ok: !frame.length,
      chip: frame.length ? `<b>${frame.length}</b> the frame cannot show` : 'The frame is live',
      why: 'About the preview, not about your system: two of these kits decide their colours somewhere a running page cannot reach. The download is right either way.',
      body: () => li(frame, 'Nothing. Every value you turn moves this frame as it would move your app.') },
  ]
}

function drawLint(routed) {
  const cs = checks(routed)
  $('#lintrow').innerHTML = cs.map((c) => `<button class="lint__c" data-k="${c.k}"
    data-state="${c.ok ? 'ok' : 'warn'}" aria-expanded="${openCheck === c.k}">
    <i></i>${c.chip}</button>`).join('')
  const c = cs.find((x) => x.k === openCheck)
  $('#lintpanel').hidden = !c
  if (!c) return
  $('#lintname').textContent = c.label
  $('#lintbody').innerHTML = `<p class="lint__why">${c.why}</p>${c.body()}`
}
$('#lintrow').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  openCheck = openCheck === b.dataset.k ? null : b.dataset.k
  drawLint(lastRouted)
})
$('#lintx').addEventListener('click', () => { openCheck = null; drawLint(lastRouted) })

/* ── the receipt ──────────────────────────────────────────────────────────── */
function receipt(routed) {
  const kits = routed.map((r) => KITS[r.kit].name).join(' + ')
  const lic = [...new Set(routed.map((r) => KITS[r.kit].license).filter(Boolean))].join(' · ')
  /* what you HAVE. What is wrong with it is under the wall now, in one grammar,
     instead of a warning here and an audit in the drawer. */
  $('#receipt').innerHTML = `<b>${kits}</b>
    <span>${SCENES.length} cards · ${PARTS.length} parts</span>
    <span>${lic}</span>`

  /* What the stack actually produced, under the frame. The claim that these
     are really their components is only worth something if it is counted where
     the reader can see it — so it is, and Material's honest zero shows too. */
  const top = state.show, own = OWN[top] ?? {}
  /* the same strip means two things: in the composer it is what you are making
     right now, on the wall it is the whole of it */
  $('#wallhead').textContent = state.stage === 'compose'
    ? `Live · ${describe(stack(state.on, KITS), KITS)}`
    : describe(stack(state.on, KITS), KITS)
  /* Material's unit is not a class — it ships custom elements, so what counts
     there is how many of the elements on the screen its own package registers. */
  $('#wallcount').innerHTML = own.unit === 'elements'
    ? `<b>${own.elsTheirs} of ${own.els}</b> elements on this screen are ${KITS[top].name}'s own, running their code`
    : own.used
      ? `<b>${own.theirs} of ${own.used}</b> classes on this screen are ${KITS[top].name}'s own${
          own.theirs < own.used ? ` (${own.used - own.theirs === 1 ? 'one is' : (own.used - own.theirs) + ' are'} ours)` : ''}`
      : `<b>nothing of theirs</b> on this screen at all`

  lastRouted = routed
  drawLint(routed)
}

/* ── the two outputs ──────────────────────────────────────────────────────── */
const files = () => generate(state.values, ORDER.filter((k) => state.on.has(k)), KITS,
  { name: kitName() || 'design-system', parts: PARTS, unread: UNREAD, overview: ($('#kitover')?.value ?? '').trim() })
const grab = (name, body, type = 'text/plain') => {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([body], { type }))
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000)
}

/* Nothing downloads until you have seen what it is.
 *
 * The old sandbox got this right and the first version here threw it away:
 * pressing Export dropped five files into someone's Downloads folder with no
 * account of what they were. A package you have not read is a package you do
 * not trust — and the two things worth reading are the contrast audit and the
 * list of what this system CANNOT express. */
/* The frame, as a file. Byte for byte the same document the preview renders —
 * the kit's compiled CSS, your values over it, the screens in the kit's own
 * classes — so what you downloaded cannot differ from what you looked at. */
function screensHtml() {
  const id = state.show
  const r = route(state.values, ORDER.filter((k) => state.on.has(k)), KITS).find((x) => x.kit === id)
  const vars = { ...(r?.vars ?? {}) }
  if (id === 'material') Object.assign(vars, DERIVED.light ?? {})   // the file is the light frame
  return `<!doctype html><meta charset="utf-8"><title>${describe(stack(state.on, KITS), KITS)}</title>
<style>${CSS[id] ?? ''}</style>
<style>:root{${Object.entries(vars).map(([k, v]) => `${k}:${v}`).join(';')}}</style>
<body>${WALLS[id] ?? ''}`
}

/* The zip is THE download and the big button owns it. These are the
 * one-file exits, drawn as quiet rows under it: each names what you get and
 * which file it is, with the longer story in the title. "Everything" used to
 * sit here too, as a card that did exactly what the button above it did. */
const DESTS = [
  { t: 'Just the theme', file: 'theme.css', d: 'the tokens as CSS, to drop in next to your kits',
    go: (f) => grab('theme.css', f['theme.css']) },
  { t: 'Just the system', file: 'DESIGN.md', d: 'the tokens, the reasoning and the rules, to Google\'s spec',
    go: (f) => grab('DESIGN.md', f['DESIGN.md']) },
  { t: 'The manifest', file: 'MANIFEST.md', d: 'versions, licences, and what could not be done',
    go: (f) => grab('MANIFEST.md', f['MANIFEST.md']) },
  { t: 'These screens', file: 'screens.html', d: 'exactly what you are looking at: the kit\'s CSS, your values, its classes. Open it in a browser.',
    go: () => grab('screens.html', screensHtml(), 'text/html') },
]

function openSheet() {
  const f = files()
  const on = ORDER.filter((k) => state.on.has(k))

  $('#sum').textContent = `${Object.keys(state.values).length} settings · ${on.length} kit${on.length > 1 ? 's' : ''} · ${Object.keys(plain(f)).length} files`

  /* which kits, at which versions, is the one fact the files cannot show you
     from here; the twenty-one values are the whole left half of this drawer */
  $('#facts').innerHTML = on.map((k) => `<span class="fact">${KITS[k].name} <b>${KITS[k].version ?? 'live'}</b></span>`).join('')

  $('#dests').innerHTML = `<p class="eyebrow">Or one file on its own</p>` + DESTS.map((d, i) =>
    `<button class="dest" data-d="${i}" title="${d.d}"><b>${d.t}</b><code>${d.file}</code></button>`).join('')

  /* The audit and the caveat list used to be here, in full, and this was the
     only place either of them appeared: you learned what was wrong with your
     system at the moment you had finished making it. They are under the wall
     now, live, so this says what those checks found and where to read the
     long version. */
  const cs = checks(lastRouted)
  const warn = cs.filter((c) => !c.ok)
  const plainChip = (c) => c.chip.replace(/<[^>]+>/g, '')
  $('#drawerchecks').innerHTML = warn.length
    ? `The Checks bar under the preview reports ${warn.length === 1 ? 'one thing' : `${warn.length} things`}: ${
        warn.map(plainChip).join(' · ')}. The long version is in <b>MANIFEST.md</b>, below.`
    : `Every check in the bar under the preview is clear. The same account, at length, is in <b>MANIFEST.md</b>.`

  /* ── the files, side by side with what you would ship ──────────────────── */
  const shown = plain(f)
  drawFiles(shown)
  $('#drawer').hidden = false
}

/* One set of rules under the three names different tools look for, so the
 * tab strip is a tab strip and not four different documents. */
const FILES = ['DESIGN.md', 'AGENTS.md', '.cursor/rules', 'tokens.json', 'theme.css', 'install.md', 'MANIFEST.md']
let fileAt = 'DESIGN.md'
function drawFiles(shown) {
  const have = FILES.filter((n) => shown[n] != null)
  if (!have.includes(fileAt)) fileAt = have[0]
  $('#ftabs').innerHTML = have.slice(0, 4).map((n) =>
    `<button role="radio" data-f="${n}" aria-checked="${n === fileAt}">${n}</button>`).join('')
  const body = shown[fileAt] ?? ''
  $('#fbody').textContent = body
  $('#fmeta').textContent = `${fileAt} · ${body.split('\n').length} lines`

  const folder = (kitName() || 'design-system')
  $('#tree').innerHTML = [`${folder}/`, ...Object.keys(shown).sort().map((n) => `  ${n}`)]
    .map((l, i) => `<li>${i === 0 ? `<b>${l}</b>` : `<span>${l}</span>`}</li>`).join('')
}
const kitName = () => ($('#kitname').value || '').trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '')
$('#ftabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  fileAt = b.dataset.f; drawFiles(plain(files()))
})
$('#fcopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('#fbody').textContent); $('#fcopy').textContent = 'Copied' }
  catch { $('#fcopy').textContent = 'Select and copy' }
  setTimeout(() => ($('#fcopy').textContent = 'Copy'), 1400)
})
$('#kitname').addEventListener('input', () => drawFiles(plain(files())))
$('#kitover').addEventListener('input', () => drawFiles(plain(files())))
$('#dests').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  DESTS[Number(b.dataset.d)].go(files())
})
$('#export').addEventListener('click', openSheet)
$('#downloadzip').addEventListener('click', () => grab(`${kitName() || 'design-system'}.zip`, zip(plain(files())), 'application/zip'))
/* The dock used to carry a second door to the same drawer, labelled "What could
 * not be done". The Checks bar above it now answers that where you can still act
 * on the answer, so the door is gone rather than sitting there saying the same
 * thing one click further away. */
$('#sheetx').addEventListener('click', () => ($('#drawer').hidden = true))
addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#drawer').hidden = true })

/* ── STAGE ONE · FOUR WAYS IN ──────────────────────────────────────────────
 * The one place this tool types an opinion, and it says so on the screen. Each
 * one is a handful of knob positions and a colour, nothing more: no kit, no
 * components, no palette. The colour goes through the same door your own colour
 * goes through, so the other ten roles still come out of what your stack
 * publishes rather than out of this list.
 *
 * Which kits render it is deliberately NOT here. Finding that out is the whole
 * point of the wall, and picking it for you at the door would answer the
 * question the tool exists to ask.
 */
/* THE FACES COME OFF THE TOP OF GOOGLE'S OWN ORDER.
 * A starting point is not the place for a face somebody has to go and like: the
 * job is to be unsurprising, so every one of these is in Google's own most-used
 * list, and the rank is theirs and not a word of ours. Checked at load, because
 * a list we refetch could quietly leave one behind. */
/* Each renderable kit's own out-of-the-box values, read from its package at
   build time by kit-defaults.mjs. The start screen is these, verbatim. */
const STARTS = /*STARTS*/;

/* THE THREE ROOMS. Nothing is rebuilt when you move between them: the wall is
   the same element at a different height, and the controls are the same
   controls. A stage is a shape the shell takes, not a page. */
function stage(next) {
  const from = state.stage
  state.stage = next
  $('.app').dataset.stage = next
  $('#flipsee').hidden = next === 'wall'
  $('#flipback').hidden = next !== 'wall'
  /* comparing belongs to the wall; folded down to a strip it is six frames
     fighting for 340 pixels */
  if (next === 'compose' && state.compare) { state.compare = null; state.solo = null }
  /* IN THE COMPOSER THE STRIP SHOWS WHAT THE VALUES BECOME. Foundations is the
     board that prints the values themselves, which are already the three cards
     directly above it — the same thing twice. Arriving from the question, it
     opens on the parts instead. Once you have moved it yourself it is yours. */
  if (next === 'compose' && from === 'start' && state.board === 'foundations') state.board = 'controls'
  if (next !== 'start') { sync(); paint(); typoCards() }
  /* the frames measure themselves against the box they are in, and the box just
     changed height by four hundred pixels */
  if (next !== 'start') requestAnimationFrame(() => dispatchEvent(new Event('resize')))
  toUrl()
}

/* THE CARD IS THE VIBE, not a description of one.
 *
 * It used to say "A heading, set in Work Sans" in a face that was not Work
 * Sans, under a title that was identical on all four cards — so four different
 * starting points arrived as four identical objects with a small line halfway
 * down telling you they differed. You cannot choose between four things that
 * look the same.
 *
 * Every card now WEARS what it would give you: its own corner on its own
 * corners, its own border width on its own border, its own base size, its own
 * two faces, and the colours the stack would really derive from that one hex.
 * A card for the dense technical start is smaller and squarer than the one for
 * the loud consumer start, because that is the difference. */
/* the family this start names, out of what the stack publishes, run through the
   same seven-role function the palette row uses */
/* the name a font stack goes by: the kit-published stacks are all in
   FONTS.stacks with real names ("System stack"), a Google family by its own */
function faceName(family) {
  if (!family) return null
  const hit = FONTS.stacks.find((f) => f.family === family)
  return hit ? hit.name : familyOf(family)
}

function drawStarts() {
  /* Bootstrap writes "Segoe UI" with double quotes in its published stack, and
     a double quote ends a style attribute: escape what goes into one */
  const attr = (x) => String(x).replaceAll('"', '&quot;')
  $('#vibes').innerHTML = Object.values(STARTS).map((d) => {
    const v = d.values
    const chips = ['brand', 'ink', 'inkMuted', 'line'].map((r) => v[r]).filter(Boolean)
    const face = v.fontBody ? `font-family:${attr(v.fontBody)};` : ''
    /* the button IS the kit's default: its colour, its corner, its face. A kit
       with no house colour gets an ink button and says so in the foot. */
    const btn = v.brand
      ? `background:${v.brand};color:${aaInk(v.brand)};`
      : `background:${v.ink ?? 'var(--ink)'};color:#fff;`
    const colourLine = v.brand ? `${nameColor(v.brand)} <code>${v.brand}</code>` : 'No house colour'
    const shapeLine = [faceName(v.fontBody), v.radius != null ? `${parseInt(v.radius)}px corners` : null]
      .filter(Boolean).join(' · ')
    return `<button class="vibe" data-k="${d.id}">
      <span class="vibe__chips">${chips.map((h) => `<i style="background:${h}"></i>`).join('')}</span>
      <span class="vibe__name" style="${face}">${d.name}</span>
      <span class="vibe__foot">
        <span class="vibe__btn" style="${face}${btn}border-radius:${v.radius ?? 'var(--r)'}">Get started</span>
        <span class="vibe__facts"><span class="vibe__fact">${colourLine}</span>
          <span class="vibe__fact">${shapeLine}</span></span>
      </span>
    </button>`
  }).join('')
  /* Material's Roboto Flex is a real downloadable face; system stacks need no load */
  for (const d of Object.values(STARTS)) {
    const head = d.values.fontBody?.split(',')[0]?.trim().replace(/^['"]|['"]$/g, '')
    if (head && GOOGLE.has(head)) loadFace(document, head)
  }
}

function takeStart(d) {
  state.on = new Set(d.stack)
  Object.assign(state.values, d.values)
  if (d.values.brand) state.values.onBrand = aaInk(d.values.brand)
  palAt = null; palNeutral = null; palShort = []
  const head = d.values.fontBody?.split(',')[0]?.trim().replace(/^['"]|['"]$/g, '')
  if (head && GOOGLE.has(head)) loadFace(document, head)
  sync(); paint(); drawStackPicker()
  stage('compose')
}

drawStarts()
$('#vibes').addEventListener('click', (e) => {
  const b = e.target.closest('.vibe'); if (!b) return
  takeStart(STARTS[b.dataset.k])
})
$('#startblank').addEventListener('click', () => stage('compose'))

/* ── CONCEPTS ─────────────────────────────────────────────────────────────
 * Trying a second idea should not cost you the first one. A concept is the
 * whole of what you decided — the stack and all twenty-one values — under a
 * name you gave it, kept in THIS BROWSER and sent nowhere. That is the same
 * promise the rest of the tool makes: no account, no server, nothing to lose
 * access to.
 *
 * Deliberately not kept: which board you were looking at and whether the wall
 * was dark. Those are where you were standing, not what you made. */
const KEPT = 'uicockpit.concepts.v1'
let keptCache = null
const readKept = () => keptCache ?? (keptCache = (() => {
  try { return JSON.parse(localStorage.getItem(KEPT) ?? '[]') } catch { return [] }
})())
const writeKept = (list) => { keptCache = list; try { localStorage.setItem(KEPT, JSON.stringify(list)) } catch {} }
const snap = () => ({ on: [...state.on], values: { ...state.values } })

const same = (a, b) => a && b && JSON.stringify(a) === JSON.stringify(b)
function markState() {
  const el = $('#conceptstate'); if (!el) return
  /* "not kept yet" read like a verdict; saved/unsaved is the vocabulary every
     product already taught people */
  const name = $('#conceptname').value.trim() || 'Untitled kit'
  const mine = readKept().find((c) => c.name === name)
  el.textContent = mine ? (same(mine.snap, snap()) ? 'saved' : 'unsaved changes') : 'unsaved'
  $('#concepttitle').textContent = name
  $('#conceptdot').style.background = state.values.brand ?? 'transparent'
}

function drawKept() {
  const list = readKept()
  $('#kepthead').hidden = !list.length
  $('#keptlist').innerHTML = list.map((c, i) => {
    /* the NAME the kit gave the stack, not its first entry: "-apple-system"
       tells you nothing you would recognise a kit by */
    const hv = c.snap.values.fontHeading ?? ''
    const head = FONTS.stacks.find((f) => f.family === hv)?.name ?? familyOf(hv)
    const kits = (c.snap.on ?? []).map((k) => KITS[k]?.name).filter(Boolean).join(' + ')
    return `<div class="kept" aria-current="${c.name === $('#conceptname').value}">
      <button class="kept__open" data-open="${i}">

for (const role of TYPE) {
  if (state.values[role.id]) continue
  const base = KITS[stack(state.on, KITS).base]?.name
  const own = FONTS.stacks.find((f) => f.from.includes(base)) ?? FONTS.stacks[0]
  state.values[role.id] = own?.family ?? 'system-ui, sans-serif'
}

seedNote(null)
drawView()
/* the picker used to be drawn when the dialog opened; it lives in the rail now,
   so it is drawn once at the start like everything else in there */
drawStackPicker()
sync()
addEventListener('load', () => setTimeout(paint, 60))
</script>
