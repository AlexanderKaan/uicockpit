<style>
/* THE CHROME'S OWN TOKENS.
 *
 * Not generated by this tool and not taken from any kit it offers: the moment
 * the interface wears shadcn, it has expressed a preference it claims not to
 * have. And the wall changes its look on every click, so the page around it has
 * to be quiet ground — a gallery paints its walls grey for the same reason.
 *
 * Warm off-white paper, a neutral ramp with no cast in it at all, and violet
 * for anything that is a link or an accent. The ramp used to lean green and the
 * accent was olive, which is a look, and this chrome is not allowed one: it
 * wraps somebody else's kit and every hue it carries is a hue the preview has
 * to compete with.
 *
 * THE THREE NEUTRALS ARE GIVEN, not derived: paper, the bar a segmented control
 * sits in, and the line. Everything else is measured against them.
 *
 * The accents and what each may do, measured on the worst of the three grounds
 * (the bar), because a palette whose limits are not written down gets used
 * wrongly in a week:
 *   --brand   4.28:1 on the bar. A RING or a MARK, never small text.
 *   --link    5.43:1 on the bar. The one violet that may be text.
 *   coral, pink   2.4:1 and 2.63:1. Marks and fills only.
 * The gradient runs coral into violet and is only ever a BORDER. */
:root{
  --ground:#f1f0ee; --panel:#fff; --sunken:#e4e2df; --faint:#f7f6f4;
  --ink:#111112; --muted:#5b5a5e; --line:#dad9d7;
  --brand:#6644fc; --link:#5433e6; --go:#111112;
  --accent-2:#ed46ba; --accent-3:#fe5a48;
  --gradient:linear-gradient(90deg,#fe5a48 42.04%,#6645fd 100%);
  --warn-bg:#fdf8e8; --warn-line:#f0e3b8;
  /* THE CHROME HAS A VOICE NOW, and it is the site's. A tool you are supposed
     to enjoy being in cannot be set in the system UI font while it asks you to
     care about typography. It stays QUIET, which is a different thing from
     having no opinion: two faces, no colour, and the previews still own the
     look because they are in frames of their own. */
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  /* THE ROOM A PANEL KEEPS AROUND ITSELF, in one place. Every panel in here
     had its own number between 10 and 18, which is how a tool ends up feeling
     cramped without any single box being wrong. 24 is the house figure; the
     rail keeps a little less because it is 286px wide and 24 on both sides of
     a 24px card inside it is 96px of nothing. */
  --pad:24px; --pad-sm:16px;
  --r:10px; --r-sm:7px; --r-lg:14px; --bw:1px; --go-ink:#fff;
  --fs-xs:10px; --fs-sm:11.5px; --fs-md:12.5px; --fs-lg:13.5px; --fs-xl:19px; --fs-2xl:24px;
}
/* ── DARK, as the OS asks ──────────────────────────────────────────────────
 * The chrome flips through its tokens; the FRAMES do not follow, because the
 * wall's own Light/Dark switch governs what the kits render, and a preview
 * that silently obeyed the OS would be showing you a mode you did not pick. */
@media (prefers-color-scheme: dark){
  :root{
    --ground:#141416; --panel:#1d1d20; --sunken:#2a2a2f; --faint:#232327;
    --ink:#f2f1f4; --muted:#a5a4ad; --line:#333338;
    --link:#a08cff; --go:#f2f1f4; --go-ink:#141416;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:grid;grid-template-columns:322px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:12px;padding:12px}
/* ── THE STAGES ───────────────────────────────────────────────────────────
 * The tool opened on a form beside a wall, which asks you to configure before
 * anything has invited you to. There is a room before that room now, and the
 * shell is switched by one attribute rather than by building a second page. */
.app[data-stage=start]{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding:0;gap:0}
.app[data-stage=start]>.rail,.app[data-stage=start]>.wall,.app[data-stage=start]>.dock,
.app[data-stage=start]>.compose,.app[data-stage=start]>.compose__top{display:none}
.app:not([data-stage=start])>.start{display:none}

/* COMPOSING: one column, the controls on top and the kit itself along the
   bottom. The wall is not hidden here, it is SHORT — a strip you can see
   moving while you turn a knob is the difference between composing and filling
   in a form. */
.app[data-stage=compose]{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);
  min-height:100vh;padding:0;gap:0}
.app[data-stage=compose]>.rail,.app[data-stage=compose]>.dock{display:none}
.app[data-stage=compose]>.wall{border-radius:0;border-top:var(--bw) solid var(--line);
  min-height:340px;padding:0}
/* the strip under the composer is for LOOKING while you turn knobs: the boards
   and the pan are the whole point, and six compared panes with nested
   scrollbars in a 340px band is a wall's job, not a preview's. Light/dark is
   wall-work too. */
.app[data-stage=compose] .wall__bar{padding:9px 16px}
.app[data-stage=compose] #modes,.app[data-stage=compose] #view{display:none}
/* the strip's own door, compose only: the same words as the switch above, so
   the band explains the button and the button explains the band */
.strip__open{display:none;margin-left:auto;align-items:center;gap:7px;cursor:pointer;
  font:500 var(--fs-md) var(--sans);color:var(--muted);border:0;background:0;
  padding:4px 9px;border-radius:var(--r-sm)}
.strip__open:hover{color:var(--ink);background:var(--sunken)}
.strip__open svg{width:13px;height:13px}
.app[data-stage=compose] .strip__open{display:inline-flex}

/* THE WALL, as the room it earned: the rail is down to the one thing that
   belongs beside it, which is what is rendering this. */
.app[data-stage=wall]{grid-template-columns:286px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
@media(max-width:1100px){.app[data-stage=wall]{grid-template-columns:252px minmax(0,1fr)}}
.app[data-stage=wall]>.compose{display:none}
.app[data-stage=wall]>.compose__top{margin:-12px -12px 0}

.eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
kbd{font:10px/1 ui-monospace,monospace;padding:2px 5px;border-radius:var(--r-sm);background:var(--sunken);color:var(--muted)}

/* everything floats on the ground — no full-width bars */
.rail,.wall,.dock{background:var(--panel);border-radius:var(--r)}
.dock{grid-column:1/-1}

/* ── THE COMPOSER ─────────────────────────────────────────────────────────
 * Three cards, and they are the page rather than a column beside it. Wide
 * enough that the palette families and the two specimens can breathe, which
 * they could not at 322px. */
.compose{display:flex;flex-direction:column;gap:0;padding:0 0 26px;overflow-y:auto}
/* THE BAR IS THE APP'S, NOT THE COMPOSER'S. It stands in both rooms with the
   same name, the same menu and the SAME switch in the same corner, so flipping
   stages moves the room behind the bar and nothing in your hand. */
.compose__top{grid-column:1/-1;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;
  padding:11px var(--pad);border-bottom:var(--bw) solid var(--line);
  background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(8px)}
.flip{display:inline-flex;align-items:center;gap:7px}
.btn__t{display:inline}
.flip[hidden]{display:none}
.compose__top .mark{margin:0}
.compose__acts{display:flex;align-items:center;gap:8px;margin-left:auto}

/* ── THE CONCEPT ──────────────────────────────────────────────────────────
 * A kit has a name and can be kept, which is what makes trying a second one
 * cost nothing. Kept in this browser and nowhere else. */
.concept{position:relative;display:flex;align-items:center}
/* one button: dot, name, state, chevron. An input that only revealed itself on
   hover was a rename nobody found, and the chevron beside it read as a stray. */
.concept__btn{display:inline-flex;align-items:center;gap:8px;border:var(--bw) solid transparent;
  background:0;cursor:pointer;font:inherit;padding:5px 8px;border-radius:var(--r-sm);max-width:40ch}
.concept__btn:hover{border-color:var(--line);background:var(--panel)}
.concept__btn svg{flex:none;width:13px;height:13px;color:var(--muted);transition:transform .15s}
.concept__btn[aria-expanded=true] svg{transform:rotate(180deg)}
.concept__dot{flex:none;width:13px;height:13px;border-radius:4px;border:var(--bw) solid var(--line)}
.concept__title{font:600 13.5px var(--sans);color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.concept__state{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
/* the rename, as a FIELD with a name on it, first thing in the menu */
.concept__field{display:block;padding:2px 2px 9px;margin-bottom:6px;border-bottom:var(--bw) solid var(--line)}
.concept__field span{display:block;margin:0 0 4px 1px;font-size:var(--fs-xs);letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.concept__name{display:block;width:100%;border:var(--bw) solid var(--line);background:var(--panel);
  border-radius:var(--r-sm);font:600 var(--fs-md) var(--sans);color:var(--ink);padding:7px 8px;outline:0}
.concept__name:focus{border-color:var(--brand)}
.concept__pop{position:absolute;left:0;top:calc(100% + 7px);z-index:60;width:274px;padding:8px;
  border:var(--bw) solid var(--line);border-radius:var(--r-lg);background:var(--panel);
  box-shadow:0 14px 34px rgb(17 17 18 / .16)}
.concept__head{margin:0;padding:6px 7px 5px;font-size:var(--fs-xs);letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.concept__list{display:flex;flex-direction:column;gap:1px;padding-bottom:5px}
.concept__list:not(:empty){margin-bottom:5px;border-bottom:var(--bw) solid var(--line)}
.kept{display:flex;align-items:center;border-radius:var(--r-sm);padding-right:5px}
.kept:hover,.kept[aria-current=true]{background:var(--sunken)}
.kept__open{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:7px;border:0;
  background:0;cursor:pointer;text-align:left;font:inherit;border-radius:var(--r-sm)}
.kept__dot{flex:none;width:15px;height:15px;border-radius:4px;border:var(--bw) solid var(--line)}
.kept__who{min-width:0;display:flex;flex-direction:column;gap:1px}
.kept__who b{font-size:var(--fs-md);font-weight:600;color:var(--ink)}
.kept__who small{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* INSIDE the row's corner, not over it. Flush to the edge with square corners
   and a white hover, it broke the rounded end of every row it sat on — and
   white on a sunken row reads as a hole rather than a button. */
.kept__x{flex:none;display:inline-flex;align-items:center;justify-content:center;
  border:0;background:0;color:var(--ink-3,var(--muted));cursor:pointer;
  width:24px;height:24px;border-radius:var(--r-sm);padding:0}
.kept__x svg{width:12px;height:12px}
.kept__x:hover{background:var(--line);color:var(--ink)}
.concept__do{display:block;width:100%;text-align:left;padding:7px;border:0;border-radius:var(--r-sm);
  background:0;font:500 var(--fs-md) var(--sans);color:var(--ink);cursor:pointer}
.concept__do:hover{background:var(--sunken)}
.compose__head{max-width:76rem;width:100%;margin:0 auto;padding:34px 20px 0}
.compose__head h1{font-family:var(--display);font-weight:700;font-size:clamp(1.65rem,3vw,2.35rem);
  line-height:1.1;letter-spacing:-.038em;margin:.5rem 0 0;color:var(--ink)}
.compose__lede{margin:.7rem 0 0;max-width:44rem;font-size:14.5px;line-height:1.6;color:var(--muted)}

.cards{max-width:76rem;width:100%;margin:0 auto;padding:26px 20px 0;
  display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:14px;align-items:start}
@media(max-width:1180px){.cards{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.cards{grid-template-columns:1fr}}
.cc{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r-lg);
  padding:var(--pad);display:flex;flex-direction:column;gap:13px;min-width:0}
.cc__top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cc__top h2{margin:0;font-family:var(--display);font-weight:700;font-size:15.5px;letter-spacing:-.025em}
.cc__say{margin:0;font-size:12.5px;line-height:1.55;color:var(--muted)}
.cc__rule{border:0;border-top:var(--bw) solid var(--line);margin:3px 0 0}

/* ── A CHOICE YOU CAN SEE ─────────────────────────────────────────────────
 * Each one draws the values it would set: the corner, the border, the lift, at
 * the size that preset's spacing gives them. Not a button — the wall below has
 * real ones, and a second, fake button next to it is exactly the confusion the
 * wall exists to prevent. */
/* one row, whatever the count: five presets in a four-wide grid leaves an
   orphan, and an orphan reads as one that did not belong with the others */
.feels{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.feel{font:inherit;border:var(--bw) solid var(--line);background:var(--panel);border-radius:var(--r);
  padding:0 0 7px;cursor:pointer;display:flex;flex-direction:column;gap:6px;overflow:hidden;text-align:center}
.feel:hover{border-color:var(--ink)}
.feel[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.feel__art{display:flex;align-items:center;justify-content:center;gap:4px;min-height:52px;
  background:var(--faint);border-bottom:var(--bw) solid var(--line)}
.feel__art i{display:block;width:18px;height:18px;flex:none}
/* the type specimen is fixed-height on purpose: three cards of different
   heights would be comparing the box, not the size inside it */
.feel__art--type{display:block;padding:8px;text-align:left;color:var(--ink);
  overflow:hidden;height:74px;min-height:0}
.feel__name{font-size:var(--fs-sm);font-weight:600;color:var(--ink);padding:0 6px}
.feel__name em{font-style:normal;font-weight:400;color:var(--muted);font-size:var(--fs-xs)}

/* the sliders are still here, one disclosure away */
.byhand{border-top:var(--bw) solid var(--line);padding-top:9px}
.byhand summary{cursor:pointer;list-style:none;font-size:var(--fs-sm);color:var(--muted);padding:2px 0}
.byhand summary::-webkit-details-marker{display:none}
.byhand summary::after{content:" ▸";color:var(--muted)}
.byhand[open] summary::after{content:" ▾"}
.byhand summary:hover{color:var(--ink)}
.cc__dots{margin:auto 0 0;padding-top:9px;border-top:var(--bw) solid var(--line);
  font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:19px}
.said{max-width:76rem;width:100%;margin:14px auto 0;padding:0 20px;
  font-size:var(--fs-md);color:var(--muted);line-height:1.55}
.said b{color:var(--ink);font-weight:600}

/* ── THE QUESTION ─────────────────────────────────────────────────────────
 * Four ways in, and a door for people who want none of them. A starting point
 * is not a decision: everything it sets is a knob you can move a second later,
 * and the screen says so rather than letting you find out. */
.start{grid-column:1/-1;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:48px 24px;overflow-y:auto}
.start__in{width:100%;max-width:70rem;display:grid;gap:0;justify-items:center;text-align:center}
.start h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4.4vw,3.25rem);
  line-height:1.05;letter-spacing:-.04em;margin:0;color:var(--ink)}
.start__lede{margin:1rem auto 0;max-width:36rem;font-size:15.5px;line-height:1.6;color:var(--muted)}
/* auto-fit dropped the fourth card onto a row of its own at the width where
   three fitted, which reads as one that did not belong. Four, then two, then
   one: a row is always full. */
.start__grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;
  width:100%;margin:2.75rem 0 0;text-align:left}
@media(max-width:1120px){.start__grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.start__grid{grid-template-columns:minmax(0,1fr)}}

/* a card is a specimen of the thing it would start you on, so it is set in that
   vibe's own faces at that vibe's own size and shape */
/* border-radius, border-width, padding, gap and font-size all come from the
   vibe itself, written inline: the card IS the specimen. */
.vibe{display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left;align-items:stretch;
  padding:var(--pad);border:1px solid var(--line);background:var(--panel);border-radius:var(--r-lg);
  transition:border-color .16s,transform .16s,box-shadow .16s}
.vibe:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 8px 22px rgb(17 17 18 / .07)}
.vibe:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* the colours this start would really set, straight from the kit's package */
.vibe__chips{display:flex;gap:5px;min-height:24px}
.vibe__chips i{width:24px;height:24px;border-radius:7px;border:1px solid rgb(17 17 18 / .08)}
/* spans in a button, so every one of them has to be told it is a block */
.vibe__name{display:block;font-size:1.16em;font-weight:650;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
.vibe__foot{margin-top:auto;display:grid;gap:12px;justify-items:start}
.vibe__btn{display:inline-flex;align-items:center;min-height:34px;padding:0 1.1em;font-weight:600;font-size:.82em;
  border:0;white-space:nowrap;border-radius:var(--r)}
/* two quiet lines of record, the same two on every card, so the bottoms line
   up: what colour, then what face and what corner */
.vibe__facts{display:grid;gap:2px;min-height:2.6em}
.vibe__fact{font-size:11.5px;line-height:1.3;color:var(--muted);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vibe__fact code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10.5px}

.start__foot{display:grid;justify-items:center;gap:12px;margin-top:2rem}
.start__blank{font:500 13.5px var(--sans);color:var(--ink);background:0;border:0;padding:5px 2px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.start__blank:hover{border-bottom-color:var(--ink)}
.start__own{font-size:12px;line-height:1.55;color:var(--muted);max-width:30rem}

/* ── the rail ─────────────────────────────────────────────────────────────── */
/* Ten swatches, two type cards and three sliders in one horizontal band was a
 * wall of controls with no shape. They are the same controls, grouped by the
 * question they answer, each group able to fold away behind a line that still
 * says what is in it. */
.rail{padding:var(--pad-sm);display:flex;flex-direction:column;gap:11px;overflow-y:auto;max-height:calc(100vh - 24px);scrollbar-width:thin}
.wm{flex:none}
.mark{--wm-glyph:var(--panel);color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;margin:0 0 2px;font-weight:600;letter-spacing:-.01em;font-size:13.5px}
.brief{display:flex;align-items:center;gap:9px;height:34px;padding:0 11px;border-radius:var(--r);background:var(--sunken);color:var(--muted)}
.brief input{flex:1;border:0;background:0;font:inherit;font-size:12.5px;color:var(--ink);outline:0;min-width:0}
.rail__acts{display:flex;align-items:center;gap:6px}
/* one scrolling row, not three wrapped ones: in a 322px rail the brief presets
   pushed Shape & space below the fold on a laptop screen */
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none}
.chip,.btn{font:inherit;font-size:12.5px;font-weight:500;min-height:34px;padding:0 11px;border-radius:var(--r);
           border:var(--bw) solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
           display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed=true]{background:var(--sunken);border-color:transparent;font-weight:600}
.btn--ghost{border-color:transparent;background:0;color:var(--muted)}
/* THE GRADIENT IS A BORDER AND NEVER A FILL. Two backgrounds: the solid one
   clipped to the padding box, the gradient to the border box, so the ring
   follows the radius the way a real border does. */
.btn--go{color:var(--go-ink,#fff);font-weight:600;border:2px solid transparent;
  background:linear-gradient(var(--go),var(--go)) padding-box,var(--gradient) border-box}
.btn--go:hover{background:linear-gradient(#2b2a30,#2b2a30) padding-box,var(--gradient) border-box}

.grp{border-top:var(--bw) solid var(--line);padding-top:8px}
/* sticky, because the rail scrolls: the header you would fold has to still be
   reachable when you are three groups down. */
.grp summary{display:flex;align-items:baseline;gap:8px;cursor:pointer;list-style:none;padding:4px 0;min-height:24px;
             position:sticky;top:0;background:var(--panel);z-index:1}
.grp summary::-webkit-details-marker{display:none}
.grp__name{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;flex:none}
.grp__sum{margin-left:auto;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.grp[open] .grp__sum{opacity:0}
.grp__dots{display:flex;gap:3px;align-items:center;justify-content:flex-end}
.grp__dots i{width:11px;height:11px;border-radius:var(--r-sm);display:block;border:var(--bw) solid var(--line)}

/* The stack, as a card you read rather than a list you operate.
 *
 * Eight kits as always-open slabs filled a third of the rail to answer a
 * question most people answer once. It is a summary now, and the choosing
 * happens in a picker that has room to explain what a base is. */
.grp--flat{border-top:var(--bw) solid var(--line);padding-top:8px}
.grp__head{display:flex;align-items:baseline;gap:8px;margin:0 0 7px;padding:4px 0}
.link{font:inherit;font-size:var(--fs-sm);color:var(--link);background:0;border:0;padding:0;cursor:pointer;
      margin-left:auto;text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--ink)}
.card{border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--faint);padding:var(--pad-sm)}
/* THE FOUR BANDS NEED FOUR BANDS OF ROOM. Packed to three pixels a row they
   read as one block of text, and the whole point of the card is that a stack
   is four separate questions with four separate answers. */
/* A ROW YOU CAN CHANGE HAS TO LOOK CHANGEABLE. The word "change" in grey four
   millimetres high was the only sign, and it read as a caption. The whole row
   lights instead, and a chevron says which way it goes. */
.band{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:10px;align-items:baseline;
  padding:8px 0;font-size:var(--fs-md);width:100%;text-align:left;font-family:inherit;color:inherit;
  background:0;border:0}
button.band{cursor:pointer;padding:8px 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:var(--r-sm)}
button.band:hover{background:var(--panel)}
button.band[aria-expanded=true]{background:var(--panel)}
.band__go{align-self:center;display:inline-flex;color:var(--muted)}
.band__go svg{width:13px;height:13px;transition:transform .15s}
button.band:hover .band__go{color:var(--ink)}
button.band[aria-expanded=true] .band__go svg{transform:rotate(180deg)}
.band + .band{border-top:var(--bw) solid var(--line)}
.band small{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.7}
.band b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band[data-none] b{font-weight:400;color:var(--muted)}
.band em{display:block;font-style:normal;font-size:var(--fs-xs);color:var(--muted);line-height:1.4}
.card__facts{margin:11px 0 0;padding-top:10px;border-top:var(--bw) solid var(--line);
  font-size:var(--fs-sm);color:var(--muted)}
.note{margin:8px 0 0;padding:9px 10px;border-radius:var(--r);font-size:var(--fs-sm);line-height:1.5;
      background:var(--warn-bg);border:var(--bw) solid var(--warn-line);color:var(--ink)}

/* ── THE PICKER, IN THE RAIL ───────────────────────────────────────────────
 * One column that opens where the card is, so the summary is not printed twice
 * and you never leave the wall you are changing. */
.pickrail{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.pickrail__head{margin:0;font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);font-weight:600;display:flex;flex-direction:column;gap:2px}
.pickrail__head small{font-size:var(--fs-xs);letter-spacing:0;text-transform:none;color:var(--muted);font-weight:400}
.pickrail__head--sub{margin-top:6px;padding-top:9px;border-top:var(--bw) solid var(--line)}
.steppedfold{margin-top:6px;padding-top:9px;border-top:var(--bw) solid var(--line);
  display:flex;flex-direction:column;gap:7px}
.steppedfold summary{cursor:pointer;list-style:none;font-size:var(--fs-sm);color:var(--muted);padding:2px 0}
.steppedfold summary::-webkit-details-marker{display:none}
.steppedfold summary::after{content:" ▸";color:var(--muted)}
.steppedfold[open] summary::after{content:" ▾"}
.steppedfold summary:hover{color:var(--ink)}
.lane__fine{margin:0;font-size:var(--fs-xs);color:var(--muted);line-height:1.5;text-align:center}
.runline{margin:11px 0 0;padding-top:10px;border-top:var(--bw) solid var(--line);
  font-size:var(--fs-sm);color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.runpick{display:inline-flex;gap:3px;padding:2px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--sunken)}
.runpick button{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:2px 9px;border-radius:var(--r-sm);cursor:pointer}
.runpick button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/.06)}
.opt__run{font-size:var(--fs-xs);color:var(--muted)}
.opt__run b{font-weight:600;color:var(--ink)}
.opt[data-cannot]{opacity:.5}
.opt[data-cannot] .opt__run b{color:var(--warn-ink,var(--muted))}
.opt{font:inherit;text-align:left;border:var(--bw) solid var(--line);background:var(--panel);border-radius:var(--r);
     padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.opt[disabled]{opacity:.45;cursor:not-allowed;background:var(--faint)}
.opt[disabled]:hover{border-color:var(--line)}
.opt__top{display:flex;align-items:baseline;gap:8px}
.opt__top b{font-size:var(--fs-md);font-weight:600}
.opt__meta{margin-left:auto;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.opt__why{font-size:var(--fs-sm);color:var(--muted);line-height:1.45}
.opt__tag{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--brand)}
/* WHAT A SHELF COSTS YOU, on the card rather than in a manifest you read later.
   Counted the same way the wall counts it: how many of its parts this kit ships
   a component for, and how many the generator would have to draw from tokens. */
.opt__parts{font-variant-numeric:tabular-nums;color:var(--ink);margin-right:7px}
.opt__parts b{font-weight:600}
/* the base and nothing on it is an ANSWER, so it looks like the others */
.opt--none{border-style:dashed}

/* ── STEPPED BACK ─────────────────────────────────────────────────────────
 * A kit that cannot fit the base you picked is not greyed out and left at
 * that: it says which base it needs and offers to move it for you. Quieter
 * than a live card, and not a dead one. */
.stepped{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:var(--r);
  border:var(--bw) dashed var(--line);background:var(--faint)}
.stepped__who{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.stepped__who b{font-size:var(--fs-md);font-weight:600;color:var(--muted)}
.stepped__who em{font-style:normal;font-size:var(--fs-xs);color:var(--muted)}
.stepped .opt__parts{font-size:var(--fs-xs);color:var(--muted);margin:0}
.lanes__foot{margin:10px 0 0;font-size:var(--fs-sm);color:var(--muted);line-height:1.5}

/* ── THE SWITCH, AS A DIFF ────────────────────────────────────────────────
 * Four rows, and each one is a count rather than a promise. The mark on the
 * left says which kind of change it is: something kept, something the new kit
 * cannot take, something that changes hands, something that stops being read.
 */
#switch{border:0;padding:0;background:0;max-width:min(640px,94vw)}
#switch::backdrop{background:#11111255}
.switch{background:var(--panel);border-radius:var(--r-lg);padding:var(--pad);display:flex;flex-direction:column;gap:16px}
.switch__rows{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:grid;grid-template-columns:20px 1fr auto;gap:13px;align-items:baseline;
  padding:15px var(--pad-sm);background:var(--panel)}
.srow__m{font-size:13px;line-height:1.3;text-align:center}
.srow[data-k=keep] .srow__m{color:var(--brand)}
.srow[data-k=cost] .srow__m{color:var(--accent-3)}
/* spans inside a span: each one has to be told it is a block, or the label and
   the sentence run into each other */
.srow__b{display:block;font-size:var(--fs-md);font-weight:600;color:var(--ink)}
.srow__w{display:block;margin:3px 0 0;font-size:var(--fs-sm);color:var(--muted);line-height:1.5}
.srow__w code{font-size:var(--fs-xs)}
.srow__n{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.switch__foot{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.switch__foot .lane__fine{margin-left:auto;text-align:right}
.sumrow{display:flex;align-items:baseline;gap:7px;font-size:var(--fs-md);padding:4px 0}
.sumrow + .sumrow{border-top:var(--bw) solid var(--line)}
.sumrow[data-none]{color:var(--muted)}
.sumrow em{font-style:normal;font-size:var(--fs-xs);color:var(--muted)}
.sumrow small{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:auto}

/* The families the stack publishes, as ramps you can browse. Not a palette we
   chose — Tailwind ships seventeen, Radix thirty-one, and the row changes with
   the stack because the offer is theirs. */
.sub{margin:6px 0 0;font-size:var(--fs-xs);color:var(--muted)}
.sub b{color:var(--ink);font-weight:600}

/* ── the colours, as things you pick up ─────────────────────────────────────
 * A hex field with a grid of swatches under it reads as a FORM; named cards
 * with the colour filling them read as parts you assemble. Each card opens
 * its own sheet. The names come from nameColor, so the system has words. */
/* the hierarchy IS the layout: the colour you chose and the neutrals it
   brought are the two big cards; success, warning and danger are real but
   subordinate, so they pack small beside them with the "+". */
.ccards{display:grid;grid-template-columns:1.3fr 1fr .9fr .9fr;grid-template-rows:repeat(2,92px);
  gap:8px;margin-top:10px}
.ccard--tall{grid-row:1/3}
.ccard--tall .ccard__fill{flex:1;height:auto}
/* a mini is all fill: the role sits ON the colour, and the name lives in the
   title, because a subordinate card earns one word, not three */
.ccard--mini .ccard__fill{flex:1;height:auto;border-bottom:0}
.ccard__on{position:absolute;left:9px;bottom:7px;font-size:9px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase}
.ccard{position:relative;font:inherit;text-align:left;cursor:pointer;padding:0;overflow:hidden;
  display:flex;flex-direction:column;background:var(--panel);
  border:var(--bw) solid var(--line);border-radius:var(--r-lg);
  transition:border-color .12s,box-shadow .12s,translate .12s}
.ccard:hover{border-color:color-mix(in oklab, var(--line), var(--ink) 28%);
  box-shadow:0 4px 14px rgb(10 15 9 / .08);translate:0 -1px}
.ccard:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ccard__fill{height:58px;border-bottom:var(--bw) solid rgb(10 15 9 / .06)}
.ccard__meta{padding:7px 10px 8px;display:flex;flex-direction:column;gap:1px}
.ccard__role{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ccard__val{font-size:var(--fs-sm);font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard__hex{font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-xs);color:var(--muted)}
.ccard__tag{position:absolute;top:6px;left:6px;font-size:9px;font-weight:700;letter-spacing:.08em;
  padding:2px 6px;border-radius:99px;background:rgb(255 255 255 / .92);color:var(--ink)}
/* the "all eleven" card is an invitation, not a colour */
.ccard--more{border-style:dashed;background:var(--faint)}
.ccard--more .ccard__fill{display:grid;place-items:center;border-bottom:0;
  font-size:20px;font-weight:300;color:var(--muted)}
.ccard--more:hover .ccard__fill{color:var(--ink)}

/* one colour, and the other ten derived from it */
.seed{display:flex;gap:6px;align-items:center;margin-top:7px}
.seed__well{flex:none;width:40px;height:30px;padding:0;cursor:pointer;
  border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--sunken)}
.seed__well:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.seed__hex{flex:1;min-width:0;font:inherit;font-family:ui-monospace,Menlo,monospace;
  font-size:var(--fs-md);min-height:30px;padding:0 9px;color:var(--ink);
  border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--panel)}
.seed__hex:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.grp__rule{border:0;border-top:var(--bw) solid var(--line);margin:12px 0 10px}

/* ── the colour picker ──────────────────────────────────────────────────────
 * The browser's own is an operating-system dialog: it cannot be styled, it
 * knows nothing about the system you are building, and it works in HSV — where
 * a step up near yellow is nothing like a step up near blue. This one is a slice
 * of OKLCH at one hue, drawn from the same maths every value in this tool goes
 * through, with the sRGB boundary shown rather than clipped past. */
#cpick{border:0;padding:0;background:0;max-width:none;max-height:none;width:100%;height:100%}
#cpick::backdrop{background:rgba(10,15,9,.22)}
/* Every editing surface is the SAME sheet at the SAME edge: a panel that
   slides over the work from the right and slides away again. One vocabulary —
   colour wheel, role families, fonts, your-colour — so summoning any of them
   feels like opening a drawer on the thing you are building, not like being
   sent to a settings dialog. (The wheel opening from inside the colour sheet
   lands on top of it at the same edge; closing peels back one layer.) */
.sheetside,.cp,.pick{position:fixed;right:12px;top:12px;bottom:12px;left:auto;width:380px;
  max-width:calc(100vw - 24px);display:flex;flex-direction:column;gap:12px;
  padding:var(--pad);background:var(--panel);border:var(--bw) solid var(--line);
  border-radius:var(--r-lg);box-shadow:0 18px 50px rgb(10 15 9 / .18);
  animation:sheetin .18s cubic-bezier(.2,.8,.3,1)}
@keyframes sheetin{from{transform:translateX(14px);opacity:0}to{transform:none;opacity:1}}
.cp{width:336px}
.cp__field{position:relative;line-height:0;border-radius:var(--r-sm);
  background:repeating-conic-gradient(var(--sunken) 0 25%, transparent 0 50%) 0 0/12px 12px}
.cp__field:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.cp__plane{display:block;width:100%;height:150px;border-radius:var(--r-sm);cursor:crosshair}
.cp__dot{position:absolute;width:13px;height:13px;margin:-7px 0 0 -7px;border-radius:50%;
  border:2px solid #fff;box-shadow:0 0 0 1px rgb(10 15 9 / .45);pointer-events:none}
.cp__hue{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;cursor:pointer;
  background:linear-gradient(to right,oklch(.7 .16 0),oklch(.7 .16 60),oklch(.7 .16 120),
    oklch(.7 .16 180),oklch(.7 .16 240),oklch(.7 .16 300),oklch(.7 .16 360))}
.cp__hue::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;border:var(--bw) solid rgb(10 15 9 / .3);box-shadow:0 1px 3px rgb(10 15 9 / .3);cursor:pointer}
.cp__hue:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.cp__row{display:flex;align-items:center;gap:7px}
.cp__well{flex:none;width:26px;height:26px;border-radius:var(--r-sm);border:var(--bw) solid var(--line)}
.cp__hex{width:9.5ch;font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-md);
  min-height:26px;padding:0 7px;color:var(--ink);border:var(--bw) solid var(--line);
  border-radius:var(--r-sm);background:var(--panel)}
.cp__hex:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.cp__called{font-size:var(--fs-sm);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp__pairs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.cp__pairs li{display:grid;grid-template-columns:11px 1fr max-content;gap:7px;align-items:baseline;font-size:var(--fs-sm)}
.cp__pairs .ok{color:#1e6b37;font-weight:700}
.cp__pairs .no{color:#8e2c21;font-weight:700}
.cp__pairs em{font-style:normal;color:var(--muted);font-family:ui-monospace,monospace;font-size:11px}
.cp__pairs li[data-bad] em{color:#8e2c21;font-weight:600}
.cp__fine{margin:0;font-size:var(--fs-xs);line-height:1.5;color:var(--muted)}
/* they wrap now. In a 322px rail seventeen families had to be a row you pushed;
   in a card this wide, hiding twelve of them behind a scroll nobody sees is the
   only reason you would not pick one. */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px;margin-top:6px;overflow:auto;min-height:0}
.pal{border:var(--bw) solid var(--line);background:var(--panel);border-radius:var(--r-sm);
     padding:5px 6px 4px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.pal:hover{border-color:var(--ink)}
.pal[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.pal__ramp{display:flex;height:22px;border-radius:3px;overflow:hidden}
.pal__ramp i{flex:1}
.pal__name{font-size:10px;color:var(--muted);text-align:center;text-transform:capitalize;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.sw{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit;
  border:0;padding:0;background:0;cursor:pointer}
.sw__well{display:block;height:30px;width:100%;border-radius:var(--r);border:var(--bw) solid var(--line)}
.sw:hover .sw__well{border-color:var(--muted)}
.sw:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r-sm)}
.sw span{font-size:9.5px;font-weight:600;line-height:1.15}
.sw code{font-size:9px;color:var(--muted);font-family:ui-monospace,monospace}

/* a role, and the colours the stack has for it */
.cp--list{width:360px;justify-content:flex-start;gap:9px}
.rp__list{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:auto;
  display:flex;flex-direction:column;gap:2px}
.rp{width:100%;font:inherit;font-size:var(--fs-md);text-align:left;cursor:pointer;
  display:grid;grid-template-columns:18px 1fr max-content max-content;gap:9px;align-items:center;
  min-height:30px;padding:0 7px;border:var(--bw) solid transparent;border-radius:var(--r-sm);
  background:0;color:var(--ink)}
.rp:hover{background:var(--sunken)}
.rp:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.rp[aria-pressed=true]{border-color:var(--muted);background:var(--sunken);font-weight:600}
.rp i{width:18px;height:18px;border-radius:var(--r-sm);border:var(--bw) solid var(--line)}
.rp__name{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp__from{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.rp em{font-style:normal;font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.rp em[data-bad]{color:#8e2c21;font-weight:600}
.rp__none{margin:0;font-size:var(--fs-md);line-height:1.5;color:var(--muted);padding:2px 2px 0}
.rp--free{margin-top:4px;border-top:var(--bw) solid var(--line);border-radius:0 0 var(--r-sm) var(--r-sm);padding-top:7px;min-height:36px}
.rp__any{background:conic-gradient(oklch(.7 .16 0),oklch(.7 .16 60),oklch(.7 .16 120),
  oklch(.7 .16 180),oklch(.7 .16 240),oklch(.7 .16 300),oklch(.7 .16 360))}

.typo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
/* THE FACE AT A SIZE YOU CAN JUDGE IT AT.
 * Seventeen pixels is the size of a label, not of a decision. You are choosing
 * a typeface, so the card shows the typeface — its own name set in itself, big
 * enough to see what it does with an a and a g. */
.font{font:inherit;text-align:left;border:var(--bw) solid var(--line);background:var(--panel);border-radius:var(--r);
      padding:11px 13px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.font:hover{border-color:var(--ink)}
.font__role{display:flex;align-items:baseline;gap:7px;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.font__role em{font-style:normal;letter-spacing:0;text-transform:none;margin-left:auto;font-weight:400}
.font__name{font-size:30px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-.02em;color:var(--ink)}
.font__from{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font:inherit;font-size:10.5px;color:var(--muted);border:0;background:0;cursor:pointer;
      display:inline-flex;align-items:center;gap:5px;padding:6px 0 0;align-self:flex-start}
.mini:hover{color:var(--ink)}

.knobs{display:grid;gap:9px;margin-top:7px}
.knob label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.knob b{color:var(--ink);font-family:ui-monospace,monospace;font-size:11px}
.knob input[type=range]{width:100%;accent-color:var(--ink);min-height:22px}

.wall{min-width:0;padding:var(--pad-sm) var(--pad);display:flex;flex-direction:column}

const PRESETS = [
  { label: 'Sharp', values: { radius: '2px', borderWidth: '1px', elevation: '0.4' }, why: 'almost square, a hairline, barely any lift' },
  { label: 'Soft', values: { radius: '8px', borderWidth: '1px', elevation: '1' }, why: 'calm corners and the kit\'s own shadow strength' },
  { label: 'Round', values: { radius: '18px', borderWidth: '0px', elevation: '1.4' }, why: 'round corners, no border, more lift' },
  { label: 'Dense', values: { radius: '6px', borderWidth: '1px', elevation: '0.6', space: '0.85' }, why: 'tight corners and less room between everything' },
  { label: 'Roomy', values: { radius: '12px', borderWidth: '1px', elevation: '1', space: '1.3' }, why: 'more room between everything' },
]

/* A scale, which is what type is. Four sliders asked you to decide a line
   height in hundredths; a scale asks whether you want it small, normal or
   roomy, and sets the pair together the way a kit publishes them. */
const TYPE_SCALES = [
  { label: 'Small', why: 'dense, for a tool you live in', values: { baseText: '14px', lineHeight: '1.45' } },
  { label: 'Normal', why: 'the size most things are set at', values: { baseText: '16px', lineHeight: '1.55' } },
  { label: 'Large', why: 'roomy, for reading', values: { baseText: '18px', lineHeight: '1.65' } },
]

const state = {
  /* A stack, not a basket: Tailwind carries shadcn's components. `show` is
     never chosen — it is whichever layer is on top. */
  on: new Set(['tailwind', 'shadcn']),
  get show() { return showing(stack(this.on, KITS)) },
  /* WHICH ROOM YOU ARE IN. Three: the question, the composer, the wall. A link
     that carries any state at all skips the question, because somebody who was
     sent a kit is not starting. */
  stage: 'start',
  board: 'foundations',
  mode: 'light',
  /* what you said you are building in, or null for "anything". Only ever dims
     the cards that cannot run there — it never picks for you. */
  runIn: null,
  /* COMPARING IS A VIEW, NOT A SECOND PRODUCT.
     `compare` holds the kits on screen, at most six, or null for the one kit
     you are building. `solo` is the card every pane has been asked to show —
     null means the whole wall. Neither changes your values or your stack: what
     you are looking at is the same values in somebody else's vocabulary. */
  compare: null,
  solo: null,
  values: { brand: '#6644FC', onBrand: '#ffffff', page: '#f7f9fa', surface: '#ffffff',
    ink: '#16181c', inkMuted: '#5c6b72', line: '#dfe2e7', radius: '10px', baseText: '16px', space: '1', elevation: '1',
    lineHeight: '1.5', letterSpacing: '0em', fontWeight: '600', borderWidth: '1px',
    /* filled in below from whichever kit publishes one */
    success: '', warning: '', danger: '',
    /* seeded from what the base kit publishes, not from a face we like */
    fontHeading: '', fontBody: '' },
}

/* ── the frames ───────────────────────────────────────────────────────────── */

/* Seven kits' real stylesheets is two megabytes of CSS, and Radix alone is
 * eight hundred kilobytes. Writing every frame's document up front made the
 * browser parse all of it to show one. A frame is built the first time you
 * actually look at it. */
$('#frames').innerHTML = RENDERS.map((id) =>
  `<figure class="pane" id="p_${id}" hidden><figcaption><b>${KITS[id].name}</b><em id="n_${id}"></em></figcaption>` +
  `<iframe id="f_${id}" title="${KITS[id].name}"></iframe></figure>`).join('')

const BUILT = new Set()
function build(id) {
  if (BUILT.has(id)) return
  BUILT.add(id)
  const f = $('#f_' + id); if (!f) return
  f.srcdoc = `<!doctype html><meta charset=utf-8><style>${CSS[id] ?? ''}</style><style id=live></style><body>${WALLS[id] ?? ''}`
  if (SCRIPTS[id]) {
    /* Material's components are code, injected rather than written into srcdoc:
     * inside an attribute every quote in 260 kB of their code becomes six
     * characters, and the page went from 513 kB to 1.2 MB. */
    const run = () => {
      const d = f.contentDocument; if (!d || d.getElementById('kit-elements')) return
      const s = d.createElement('script')
      s.type = 'module'; s.id = 'kit-elements'; s.textContent = SCRIPTS[id]
      d.body.appendChild(s)
    }
    f.addEventListener('load', run)
  }
  f.addEventListener('load', paint)
}

/* Only the kits a running page CAN change get changed live. Bootstrap compiles
   its brand and Material derives its scheme, so those two say so instead of
   quietly showing yesterday's build. */
/* WHICH KITS A RUNNING PAGE CAN RETHEME.
   Three cannot, and each for its own reason: Bootstrap compiles its component
   colours with Sass, Material derives its scheme with its own generator, and
   Ant Design has no stylesheet at all — its rules and its 838 variables are
   produced by React at build time. All three are honest about it in the check
   below rather than showing a frame that quietly disagrees with the download. */
const LIVE_BRAND = { tailwind: true, daisyui: true, shadcn: true, bootstrap: true, material: false,
  radix: true, mantine: true, openprops: true, antd: false }

function paint() {
  const kits = ORDER.filter((k) => state.on.has(k))
  const routed = darken(route(state.values, kits, KITS), KITS)
  /* A frame shows a STACK, so it carries every layer's variables, bottom-up.
     Giving it only the top layer's meant shadcn's frame never saw Tailwind's
     --font-sans, and the font knobs moved the card and nothing else. A tokens
     layer belongs under all of it, which is what it does in your app. */
  const st = stack(state.on, KITS)
  for (const r of routed) dress(r, st.order.slice(0, st.order.indexOf(r.kit) + 1), routed)

  /* AND THE KITS YOU ARE ONLY LOOKING AT.
     A compared pane is not a layer of your stack — it is another kit answering
     the SAME values, so it carries its own smallest stack: a layer kit gets the
     engine under it, a standalone kit stands alone. Routing them through their
     own tables is the whole point of the view; skipping it would show you eight
     frames of one kit's variables. */
  for (const id of comparing()) {
    if (state.on.has(id)) continue
    const own = stack(new Set([id]), KITS)
    dress({ kit: id }, own.order, darken(route(state.values, own.order, KITS), KITS))
  }

  layout()
  receipt(routed)
  toUrl()
  markState()
  /* the specimens are drawn FROM the values, so they move when the values do */
  if (state.stage === 'compose') { drawFeel(); drawScale(); drawColourCards() }

  function dress(r0, order, routed) {
    const r = routed.find((x) => x.kit === r0.kit) ?? r0
    const f = $('#f_' + r.kit)
    if (!f) return
    const below = (id) => order.slice(0, order.indexOf(id) + 1)
    /* A frame carries its whole stack, bottom-up — but a lower layer may NOT
     * overwrite a name the shown kit publishes itself.
     *
     * shadcn's --border is a colour and daisyUI's --border is a WIDTH. The
     * collision was already detected and reported; once the frame started
     * carrying every layer (so shadcn could see Tailwind's --font-sans), it
     * also started happening: daisyUI's buttons got a border of
     * `#dfe2e7 solid` and rendered at 3px instead of 1. A variable the kit you
     * are looking at publishes is that kit's to own. */
    const varsOf = (ids, dark) => {
      const top = ids.at(-1)
      const mine = KITS[top]?.modes?.light ?? {}
      const out = {}
      for (const k of ids) {
        const rr = routed.find((x) => x.kit === k)
        const from = (dark && rr?.dark) ? rr.dark : rr?.vars ?? {}
        for (const [name, value] of Object.entries(from)) {
          if (k !== top && mine[name] !== undefined) continue
          out[name] = value
        }
      }
      return out
    }
    const live = f.contentDocument?.getElementById('live')
    if (!live) return
    /* Radix takes attributes, not values: its accent, grey, radius and scaling
       are set on the theme root the way its <Theme> would set them. */
    const root = f.contentDocument.documentElement
    for (const [a, v] of Object.entries(r.attrs ?? {})) root.setAttribute(a, v)
    /* and the kit's own dark switch, plus colour-scheme so its form controls,
       scrollbars and default text follow */
    const wantDark = state.mode === 'dark' && !!DARKSWITCH[r.kit]
    DARK_ROOT[r.kit]?.(root, wantDark)
    root.style.colorScheme = wantDark ? 'dark' : 'light'
    /* and its per-element tones, which live in the markup rather than in a
       variable — the wall is built once, so they are re-tuned in place */
    /* EVERY chosen role, not only the per-element tones: the brand is a choice
       too, and elements that carry it in their markup were pinned to the accent
       the page was built with while the root moved on without them. */
    for (const c of r.chosen ?? []) {
      for (const el of f.contentDocument.querySelectorAll(`[data-tone="${c.role}"]`)) el.setAttribute('data-accent-color', c.picked)
    }
    /* the wall is one strip you pan, so a board is a place you go rather than
       a filter — nothing is hidden and nothing is re-rendered */
    watch(f)
    /* the chosen face has to exist inside the frame too, or the wall shows the
       fallback while the card shows the family */
    for (const role of TYPE) loadFace(f.contentDocument, familyOf(state.values[role.id]))
    let vars = varsOf(below(r.kit), state.mode === 'dark')
    /* Material's other 46 roles come from its own generator, pre-derived here
       for the seeds we shipped; an unseen seed keeps the last derived scheme
       and the note says the download will carry the right one.
       UNDER the routed values, not over them: its generator emits an error role
       too, and applying the scheme last quietly replaced the danger colour you
       picked with the one M3 computed. Its own API takes a custom error, so the
       knob is allowed to win — and the manifest says it did. */
    /* Material's other 46 roles come from its own generator, which produces a
       dark scheme as well as a light one. Applying the LIGHT scheme under a
       dark block left every surface light and every on-colour dark: readable
       nowhere. Their scheme for the mode you are in, then your values. */
    if (r.kit === 'material') vars = { ...(state.mode === 'dark' ? DERIVED.dark : DERIVED.light) ?? {}, ...vars }
    /* the same selector the generated file uses — a block only wins if it
       out-specifies the kit's own, which :root does not always do */
    live.textContent = `${scopeOf(r.kit)}{${Object.entries(vars).map(([k, v]) => `${k}:${v}`).join(';')}}`
    /* AND BOOTSTRAP'S COMPILED HALF, REWRITTEN.
       Its component colours are Sass output, which is why they never moved —
       but every one of them landed in a --bs- custom property, and a custom
       property can be written again. Each is re-derived from your brand through
       the relationship Bootstrap's own build put between the two. */
    if (r.kit === 'bootstrap' && BSLIVE.length) {
      const want = state.values.brand
      const triple = HEX6.test(want ?? '') ? [1, 3, 5].map((i) => parseInt(want.slice(i, i + 2), 16)).join(', ') : null
      live.textContent += BSLIVE.map(([sel, props]) => `${sel}{${props.map(([prop, from]) => {
        const made = from === 'brand' ? want
          : from === 'brandRGB' ? triple
          : from.startsWith('brandA:') ? (triple ? from.split(':')[2].replace(/rgba\([^)]*\)/i, `rgba(${triple}, ${from.split(':')[1]})`) : null)
          : relative(want, BSSEED, from)?.hex
        return made ? `${prop}:${made}` : ''
      }).filter(Boolean).join(';')}}`).join('')
    }
    pick(f)
  }
}

/* ── comparing ──────────────────────────────────────────────────────────────
 * The page already carries a frame per kit and every kit's CSS; one is shown
 * and the rest wait. So this is arrangement, not a second product — and the
 * only thing it adds is the question "the same values, in whose vocabulary?",
 * which is the one question you cannot answer anywhere else.
 *
 * SIX, because that is where a pane stops being a screen and starts being a
 * thumbnail. The cap is a fact about reading, not about the machine.
 */
const MAX_PANES = 6

/** The kits on screen: your own first, then the rest in the order they load. */
function comparing() {
  if (!state.compare) return []
  return state.compare.filter((id) => RENDERS.includes(id)).slice(0, MAX_PANES)
}

function startCompare() {
  const mine = state.show
  const rest = RENDERS.filter((id) => id !== mine)
  state.compare = [mine, ...rest].slice(0, MAX_PANES)
}

/** Lay the frames out, and hand the wall in each one the card it must show. */
function layout() {
  const shown = state.compare ? comparing() : [state.show]
  shown.forEach(build)
  const box = $('#frames')
  if (state.compare) {
    box.dataset.compare = ''
    box.style.setProperty('--cols', String(shown.length <= 2 ? shown.length : shown.length <= 4 ? 2 : 3))
  } else {
    delete box.dataset.compare
    box.style.removeProperty('--cols')
  }
  for (const id of RENDERS) {
    const pane = $('#p_' + id)
    if (pane) pane.hidden = !shown.includes(id)
    /* the pane says which of the three cannot follow your knobs live, because
       in a grid of six an unexplained disagreement reads as a bug */
    const note = $('#n_' + id)
    if (note) note.textContent = state.compare && !LIVE_BRAND[id] ? 'built, not live' : ''
    solo($('#f_' + id))
  }
  /* ── A · THE BAR DROPS WHAT STOPS BEING TRUE ────────────────────────────
     Comparing, the wall holds six kits, so the stack's name and "420 of 420
     classes are shadcn/ui's own" are both about something that is no longer
     what you are looking at. The busiest row was carrying the least true
     line on the screen. */
  $('.app').dataset.compare = state.compare ? '' : null
  if (!state.compare) delete $('.app').dataset.compare
  $('#stackgrp').hidden = !!state.compare
  $('#panegrp').hidden = !state.compare
  if (state.compare) drawPanes()
}

/** Ask one frame for one card — or for the whole wall again. */
function solo(f) {
  const d = f?.contentDocument
  const root = d?.documentElement
  if (!root) return
  if (state.compare) root.dataset.pick = ''; else delete root.dataset.pick
  for (const el of d.querySelectorAll('.card[data-solo]')) delete el.dataset.solo
  const card = state.solo && d.querySelector(`.card[data-card="${state.solo}"]`)
  const strip = d.getElementById('strip')
  if (card) {
    card.dataset.solo = ''
    root.dataset.solo = state.solo
    /* AND SCROLL BACK TO THE START.
       Hiding the other boards does not move the strip: each pane kept whatever
       pan position it had, so a card that is now the only thing in the frame
       could still be a thousand pixels off to the right. Three of the six came
       up blank, which reads as a kit that failed to render. */
    if (strip) { strip.scrollLeft = 0; strip.scrollTop = 0 }
  } else {
    delete root.dataset.solo
    /* and back to the board you were on, which is where you left it */
    const b = strip?.querySelector('#b_' + state.board)
    if (b) strip.scrollLeft = b.offsetLeft
  }
}

/** Clicking a card picks it — in every pane at once. */
const PICKED = new WeakSet()
function pick(f) {
  const d = f?.contentDocument
  if (!d || PICKED.has(d)) return
  PICKED.add(d)
  d.addEventListener('click', (e) => {
    if (!state.compare) return
    /* a control is a control first. The wall is live now, so a click on a
       switch has to switch rather than rearrange the page around it. */
    if (e.target.closest('input,select,textarea,button,a,label,summary,[role=slider],[role=tab],[role=menuitem],[role=switch],[role=checkbox],[role=radio]')) return
    const card = e.target.closest('.card[data-card]')
    if (!card) return
    state.solo = state.solo === card.dataset.card ? null : card.dataset.card
    for (const id of comparing()) solo($('#f_' + id))
    drawPanes()
  })
}

function drawPanes() {
  const on = comparing()
  const full = on.length >= MAX_PANES
  $('#panes').innerHTML =
    `<p class="panes__cap"><b>${on.length}</b> of ${MAX_PANES} panes, the same values in each kit's own vocabulary</p>`
    + `<div class="panes__list">` + RENDERS.map((id) => {
      const lit = on.includes(id)
      const stop = !lit && full
      const o = OWN[id] ?? {}
      return `<button class="pchip" data-k="${id}" aria-pressed="${lit}"${stop ? ' disabled' : ''}>
        <i class="pchip__box">${lit ? '<!--I:check-->' : ''}</i>
        <span class="pchip__who">${KITS[id].name}</span>
        <span class="pchip__n">${o.parts ? `${o.partsTheirs}/${o.parts}` : ''}</span></button>`
    }).join('') + `</div>`
    /* THE REASON, NOT A TOOLTIP. Two of the eight go quiet at six, and a
       control that dims without saying why is the thing this tool spent a
       commit removing from the stack picker. */
    + (full ? `<p class="panes__why">Six is the most that still reads at this size. Drop one to add another.</p>` : '')
    + (state.solo
      ? `<p class="solobar">Showing <b>${(SCENES.find((c) => c.id === state.solo) ?? {}).title ?? state.solo}</b> in all ${on.length}.
         <button class="link" id="unsolo">Show the whole wall</button></p>`
      : `<p class="solobar">Click any card in a pane to compare just that one.</p>`)
}

$('#panes').addEventListener('click', (e) => {
  if (e.target.id === 'unsolo') {
    state.solo = null
    for (const id of comparing()) solo($('#f_' + id))
    return drawPanes()
  }
  const b = e.target.closest('.pchip'); if (!b || b.disabled) return
  const id = b.dataset.k
  const on = comparing()
  if (on.includes(id)) {
    if (on.length <= 2) return               // two is the least that compares
    state.compare = on.filter((x) => x !== id)
  } else state.compare = [...on, id].slice(0, MAX_PANES)
  paint()
})

$('#view').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.v === 'one') { state.compare = null; state.solo = null } else startCompare()
  drawView(); paint()
})
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.solo) { state.solo = null; layout(); drawPanes() }
})

function drawView() {
  $('#view').innerHTML = [['one', 'One kit'], ['many', 'Compare']]
    .map(([id, label]) => `<button role="radio" data-v="${id}" aria-checked="${(state.compare ? 'many' : 'one') === id}">${label}</button>`).join('')
}

/* ── the stack, as a card ─────────────────────────────────────────────────── */
/* What it IS, not what you could change it into. The choosing happens in the
 * picker, which has room to say what a base is; this says what you have. */
function renderStack() {
  const st = stack(state.on, KITS)
  const own = OWN[showing(st)] ?? {}
  /* Four bands, not a list of kits. "shadcn on Tailwind" hid the two things
     that make a stack a stack: shadcn BRINGS the Radix behaviour package and
     its own tokens, and leans on Tailwind for the engine. All four rows are
     read from what the packages themselves declare. */
  /* TWO OF THE FOUR BANDS ARE YOURS TO CHANGE, so those two are the control.
     Behaviour and tokens are consequences of the other two — a kit brings the
     behaviour it brings — so they stay as read-outs. */
  const OPENS = { Engine: 'engine', Components: 'comps' }
  $('#stackcard').innerHTML = bandsOf(st, KITS).map((b) => {
    const opens = OPENS[b.label]
    const T = opens ? 'button' : 'span'
    return `<${T} class="band"${b.name ? '' : ' data-none'}${opens ? ` data-open="${opens}" aria-expanded="${railAt === opens}"` : ''}>
      <small>${b.label}</small>
      <span><b>${b.name ?? 'none'}</b>${b.via ? `<em>via ${b.via}</em>` : ''}${
        b.over?.length ? `<em>over ${b.over.join(', ')}</em>` : ''}</span>${
        opens ? '<span class="band__go" aria-hidden="true"><!--I:chevron-down--></span>' : ''}</${T}>`
  }).join('')
    + `<p class="card__facts">${own.parts ? `${own.partsTheirs} of ${own.parts} parts ${KITS[showing(st)]?.bands?.components ? 'from the kit' : 'composed from its utilities'} · ` : ''}${
      [...new Set(st.order.map((k) => KITS[k].license).filter(Boolean))].join(' · ')}</p>`

  /* the parts this kit ships nothing for, named where you can still act on it */
  const drawn = own.drawn ?? []
  $('#stacknote').hidden = !drawn.length
  if (drawn.length) {
    $('#stacknote').textContent = `${drawn.length === 1 ? 'One part is' : `${drawn.length} parts are`} drawn from tokens because `
      + `${KITS[showing(st)].name} has no equivalent: ${drawn.join(', ')}.`
  }
}

/* ── THE PICKER, IN THE RAIL ───────────────────────────────────────────────
 * It was a full-screen dialog with three columns: two shelves of cards and a
 * summary of what you had chosen. The summary was the card in the rail printed
 * a second time, and the two shelves never needed to be side by side — you ask
 * what is underneath and what draws the buttons one after the other, not at
 * once.
 *
 * So it opens IN the card, one question at a time, and you never leave the wall
 * you are changing. Everything the dialog said is still said: what each kit is,
 * what it asks of your app, how many of the parts it ships, and for the ones
 * that cannot sit on your base, which base they need and a button that moves
 * it. A narrow column loses nothing but the second column.
 */
let railAt = null                              // 'engine' | 'comps' | null

/* WHAT JUST HAPPENED, in one line under the cards.
 * Three things call this — a shape preset, a colour shuffle, a feel shuffle —
 * and none of them has ever printed anything, because the function they call
 * was never written. Each one did its work and then threw. So a preset moved
 * four sliders and said nothing about which, and a rolled colour reported a
 * contrast verdict to an exception handler. */
function note(html) {
  const el = $('#said'); if (!el) return
  el.innerHTML = html
  el.hidden = !html
}

function drawStackPicker() {
  const st = stack(state.on, KITS)
  const carrier = foundationOf(KITS)
  const bases = ORDER.filter((id) => KITS[id].standalone || KITS[id].layer === 'utility')
  const under = ORDER.filter((id) => KITS[id].layer === 'tokens')

  /* WHAT YOU HAVE TO BE RUNNING, on every row.
     This is a starting point for a design system whatever you build in, and
     five of these nine ask nothing of your app at all. Saying so is the
     difference between a comparison and a shortlist: without it someone on Vue
     could set every knob on Mantine and download a package they cannot use. */
  const runs = (id) => KITS[id].runsIn ?? { framework: null, what: '' }
  /* A kit that demands a framework is closed to everyone not running it,
     whichever one that is — so "something else" means any framework at all. */
  const cannot = (id) => (state.runIn === 'other'
    ? !!runs(id).framework
    : !!(state.runIn && runs(id).framework && runs(id).framework !== state.runIn))

  const parts = (id) => {
    const o = OWN[id] ?? {}
    return o.parts ? `<span class="opt__parts"><b>${o.partsTheirs}</b>/${o.parts}</span>` : ''
  }
  /* Seven kits at three lines of prose each is seven hundred pixels of rail to
     scroll through to change one thing. The sentence describes what you HAVE,
     so it is shown on the one you have; the rest are a name, a count and what
     they ask of your app, which is what you pick on. Choosing one shows you
     its sentence. */
  const row = (id, { on }) => `<button class="opt" data-p="${id}"
    aria-pressed="${!!on}"${cannot(id) ? ' data-cannot' : ''}>
    <span class="opt__top"><b>${KITS[id].name}</b>
      <span class="opt__meta">${parts(id)}</span></span>
    ${on ? `<span class="opt__why">${KITS[id].what}</span>` : ''}
    <span class="opt__run">${runs(id).framework
      ? `<b>${runs(id).framework} only</b>${cannot(id) ? ', not where you are building' : ''}`
      : '<b>any framework</b>'}${on ? ` · ${KITS[id].license ?? ''}` : ''}</span></button>`

  const box = $('#stackpick')
  box.hidden = !railAt
  if (railAt === 'engine') {
    box.innerHTML = `<p class="pickrail__head">Pick an engine <small>how the styles get written, and the scales that come with it</small></p>`
      + bases.map((id) => row(id, { on: st.base === id, why: KITS[id].what })).join('')
      + `<p class="pickrail__head pickrail__head--sub">Tokens under everything <small>optional</small></p>`
      + under.map((id) => row(id, { on: st.order.includes(id), why: KITS[id].what })).join('')
  } else if (railAt === 'comps') {
    /* a kit's own bands say which base it needs: 'own' means it is one */
    const needs = (id) => (KITS[id].bands?.engine === 'own' ? id : KITS[id].bands?.engine ?? carrier)
    const ships = ORDER.filter((id) => KITS[id].bands?.components)
    const fits = ships.filter((id) => needs(id) === st.base)
    const stepped = ships.filter((id) => needs(id) !== st.base)
    box.innerHTML = `<p class="pickrail__head">Components <small>${fits.length
      ? `${fits.length} fit ${KITS[st.base].name}` : `none fit ${KITS[st.base].name}`}</small></p>`
      + fits.map((id) => row(id, { on: st.order.includes(id), why: KITS[id].what })).join('')
      /* the honest fourth option, which is an answer and not an absence */
      + `<button class="opt opt--none" data-clear aria-pressed="${!ships.some((id) => st.order.includes(id))}">
          <span class="opt__top"><b>Nothing yet</b><span class="opt__meta">tokens only</span></span>
          <span class="opt__why">Take the values and add components later. The wall draws every part
            from what the base publishes.</span></button>`
      /* FOLDED, because they are secondary by definition: you are picking
         components for the base you have. Five open rows of dashed cards were
         most of the rail. The summary carries the count; opening it is one
         click, and each row still says what it needs and offers to move you. */
      + (stepped.length ? `<details class="steppedfold"><summary>${stepped.length} more need a different base</summary>${
        stepped.map((id) => `<div class="stepped">
            <span class="stepped__who"><b>${KITS[id].name}</b>
              <em>${needs(id) === id ? 'brings its own base' : `needs ${KITS[needs(id)].name}`}</em></span>
            ${parts(id)}
            <button class="link" data-p="${id}">Switch base</button>
          </div>`).join('')}</details>` : '')
  }

  /* the choices are the frameworks the KITS name, plus the one that means
     "nothing" — never a list of frameworks we happen to have heard of */
  const FRAMEWORKS = [...new Set(Object.keys(KITS).map((k) => runs(k).framework).filter(Boolean))]
  $('#runpick').innerHTML = [[null, 'anything'], ...FRAMEWORKS.map((f) => [f, f]), ['other', 'something else']]
    .map(([v, label]) => `<button type="button" data-run="${v ?? ''}" aria-pressed="${(state.runIn ?? null) === v}">${label}</button>`).join('')
}

    state.on = new Set([...st.under, st.base])

  /* ADDING A LAYER IS CHEAP; MOVING THE FLOOR IS NOT. A component you switch on
     over the same base changes what renders and nothing else, so it happens the
     moment you click. Changing the base can take a value away, and that does
     not happen behind your back. */
  if (stack(next, KITS).base !== stack(state.on, KITS).base) return askSwitch(next)
  state.on = next

/* ── WHAT MOVING THE BASE WOULD ACTUALLY DO ────────────────────────────────
 * A diff, not a warning. Every row is read out of the same three things the
 * rest of the tool reads: what the router can do with your values in the new
 * stack, which parts that stack ships a component for, and which of the
 * variables it writes it never reads back.
 *
 * It is a DIFF and not a description: what the stack you are on already cannot
 * do is not news, so only what CHANGES is counted. Switching from a kit that
 * takes no radius to another that takes no radius costs you nothing, and
 * saying so twice would be the same noise this screen exists to remove.
 */
const hardRoles = (ids) => {
  const out = new Map()
  for (const r of route(state.values, ids, KITS)) {
    for (const id of r.unroutable ?? []) out.set(id, `${KITS[r.kit].name} has no variable for it`)
    for (const c of r.chosen ?? []) out.set(c.role, `${KITS[r.kit].name} takes the nearest of its own set`)
    for (const b of r.needsBuild ?? []) out.set(b.role, `${KITS[r.kit].name} compiles it, so it needs a rebuild`)
  }
  return out
}
const label = (id) => ROLES.find((r) => r.id === id)?.label ?? id
const listOf = (a) => a.length > 3 ? `${a.slice(0, 3).join(', ')} and ${a.length - 3} more` : a.join(', ')

let pendingOn = null
function askSwitch(next) {
  pendingOn = next
  const now = stack(state.on, KITS), to = stack(next, KITS)
  const toName = KITS[to.base].name

  const hardNow = hardRoles(now.order), hardTo = hardRoles(to.order)
  const lost = [...hardTo.keys()].filter((id) => !hardNow.has(id))
  const back = [...hardNow.keys()].filter((id) => !hardTo.has(id))

  const drawnNow = new Set((OWN[showing(now)] ?? {}).drawn ?? [])
  const drawnTo = new Set((OWN[showing(to)] ?? {}).drawn ?? [])
  const loseParts = [...drawnTo].filter((p) => !drawnNow.has(p))
  const gainParts = [...drawnNow].filter((p) => !drawnTo.has(p))

  const unreadOf = (st) => UNREAD.filter((u) => st.order.includes(u.kit))
  const namesOf = (rows) => new Set(rows.flatMap((u) => u.names))
  const wasUnread = namesOf(unreadOf(now))
  const nowUnread = unreadOf(to).flatMap((u) => u.names).filter((n) => !wasUnread.has(n))

  const set = ROLES.filter((r) => state.values[r.id] != null).length
  const rows = [
    { k: 'keep', m: '✓', b: 'Everything you chose by hand', n: 'carries over',
      w: `All ${set} values stay exactly as you set them. A colour, a typeface and a corner are yours, `
        + 'not the kit\'s, so nothing about them is rewritten by moving the floor underneath.' },
  ]
  if (lost.length) rows.push({ k: 'cost', m: '~', b: `${lost.length === 1 ? 'One value' : `${lost.length} values`} stop landing`,
    n: listOf(lost.map(label)),
    w: lost.map((id) => `<b>${label(id)}</b>: ${hardTo.get(id)}`).join('. ') + '. They stay in your download, and the manifest names them.' })
  if (back.length) rows.push({ k: 'keep', m: '✓', b: `${back.length === 1 ? 'One value' : `${back.length} values`} start landing`,
    n: listOf(back.map(label)), w: `${toName} takes ${back.length === 1 ? 'it' : 'them'} where the stack you are on could not.` })
  if (loseParts.length) rows.push({ k: 'cost', m: '~', b: `${loseParts.length} ${loseParts.length === 1 ? 'part is' : 'parts are'} drawn from tokens`,
    n: `${(OWN[showing(to)] ?? {}).partsTheirs} / ${(OWN[showing(to)] ?? {}).parts} parts`,
    w: `${toName} ships no component for ${listOf(loseParts)}, so the preview builds ${loseParts.length === 1 ? 'it' : 'them'} out of its tokens instead.` })
  if (gainParts.length) rows.push({ k: 'keep', m: '✓', b: `${gainParts.length} ${gainParts.length === 1 ? 'part gets' : 'parts get'} a real component`,
    n: listOf(gainParts), w: `${toName} ships ${gainParts.length === 1 ? 'one' : 'these'} where the stack you are on had to draw ${gainParts.length === 1 ? 'it' : 'them'}.` })
  if (nowUnread.length) rows.push({ k: 'note', m: '◆', b: `${nowUnread.length} ${nowUnread.length === 1 ? 'variable stops' : 'variables stop'} being read`,
    n: 'still exported',
    w: `${toName} writes ${nowUnread.length === 1 ? 'it' : 'them'} and never reaches for ${nowUnread.length === 1 ? 'it' : 'them'} again: `
      + `<code>${nowUnread.slice(0, 3).join('</code> <code>')}</code>. Your download still carries ${nowUnread.length === 1 ? 'it' : 'them'}.` })

  $('#switchtitle').textContent = `Move to ${toName}?`
  $('#switchsub').textContent = rows.length === 1
    ? 'Your kit stays exactly as it is. Nothing you set is touched by this.'
    : 'Your kit stays. Only what came from a library gets rebuilt, and this is everything that touches.'
  $('#switchrows').innerHTML = rows.map((r) => `<div class="srow" data-k="${r.k}">
    <span class="srow__m">${r.m}</span>
    <span><span class="srow__b">${r.b}</span><span class="srow__w">${r.w}</span></span>
    <span class="srow__n">${r.n}</span></div>`).join('')
  $('#switchfine').textContent = 'Nothing is written until you say so.'
  $('#switch').showModal()
}

  $('#switch').close()
})
/* KEEP BOTH. The whole reason the diff is bearable: you do not have to choose
