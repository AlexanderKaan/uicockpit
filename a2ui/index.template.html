<style>
/*KITCSS*/

/* The front door, built out of the same kit as the tool it opens. Layout only —
   every surface, control and value below comes from the kit's own recipes and
   tokens, and the scope limit keeps all of it away from .preview. */
*{box-sizing:border-box}
body{margin:0;background:var(--k-bg);color:var(--k-fg);font-size:var(--k-type-body);line-height:1.5}
body,.b-kit{font-family:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif}

@scope (.chrome) to (.preview) {

  /* A maintenance notice is not a popover: something that can be dismissed, or
     that appears after a beat, is something a visitor can miss. It sits at the
     top of the document, in the flow, and stays. */
  .notice{display:flex;gap:var(--k-s-10,.625rem);align-items:flex-start;
          padding:var(--k-s-12) var(--k-s-16);background:var(--k-warning-soft);
          border-bottom:1px solid color-mix(in oklab, var(--k-warning-text) 25%, transparent);
          color:var(--k-warning-soft-fg)}
  .notice__mark{flex:none;color:var(--k-warning-text);margin-block-start:1px}
  .notice p{margin:0;font-size:var(--k-type-small);line-height:1.55;max-inline-size:88ch;text-wrap:pretty}
  .notice b{color:var(--k-fg)}
  .hero,.band{max-inline-size:64rem;margin-inline:auto;padding-inline:var(--k-s-24)}
  .hero{padding-block:var(--k-s-48,3rem) var(--k-s-32,2rem);text-align:center}
  .wordmark{display:inline-flex;align-items:center;gap:var(--k-s-8);margin:0 0 var(--k-s-16);
            font-size:var(--k-type-eyebrow);letter-spacing:var(--k-track-eyebrow);text-transform:uppercase;
            font-weight:var(--k-weight-semibold);color:var(--k-fg-muted)}
  .wordmark svg{color:var(--k-primary)}
  h1{font-size:clamp(2rem,5vw,var(--k-type-display));font-weight:var(--k-weight-display-hero);
     letter-spacing:var(--k-track-display);line-height:1.05;margin:0;text-wrap:balance}
  .standfirst{margin:var(--k-s-16) auto 0;max-inline-size:44ch;color:var(--k-fg-muted);
              font-size:1rem;text-wrap:pretty}
  .standfirst strong{color:var(--k-fg);font-weight:var(--k-weight-medium)}

  .hero__actions{display:flex;gap:var(--k-s-8);justify-content:center;margin:var(--k-s-20,1.25rem) 0 0;flex-wrap:wrap}
  /* the kit's .btn recipe is written for <button>; an <a> keeps the link
     underline the global layer gives every anchor */
  a.btn{text-decoration:none}

  /* THE APP IN ACTION. Not a recording — a recording of a design system goes
     stale the day the tokens change, and this one cannot. */
  .demo{margin-block-start:var(--k-s-32,2rem);text-align:start;overflow:hidden}
  .demo__bar{display:flex;align-items:center;gap:var(--k-s-12);flex-wrap:wrap;
             padding:var(--k-s-10,.625rem) var(--k-s-12);border-bottom:var(--k-divider)}
  .demo__label{font-size:var(--k-type-eyebrow);letter-spacing:var(--k-track-eyebrow);
               text-transform:uppercase;color:var(--k-fg-muted);font-weight:var(--k-weight-semibold)}
  .demo__stacks{margin-inline-start:auto}
  .demo__note{margin:0;padding:var(--k-s-10,.625rem) var(--k-s-14,.875rem);border-top:var(--k-divider);
              font-size:var(--k-type-small);color:var(--k-fg-muted);text-wrap:pretty}
  /* the grey field says "this is rendered output", but it was mostly grey —
     the card is the subject, so the surface hugs it */
  .demo .stage__surface{display:grid;place-items:center;padding:var(--k-s-24) var(--k-s-16);
                        background:var(--k-surface-2);box-shadow:inset 0 0 0 1px var(--k-border)}
  .demo__preview{inline-size:min(28rem,100%)}

  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--k-s-16);align-items:start}
  .orient{padding:var(--k-s-16);display:flex;flex-direction:column;gap:var(--k-s-8)}
  .orient__icon{inline-size:2.25rem;block-size:2.25rem;border-radius:var(--k-radius-md);display:grid;
                place-items:center;background:var(--k-primary-soft);color:var(--k-primary-soft-fg)}
  .orient h3{margin:0;font-size:var(--k-type-h3);font-weight:var(--k-weight-semibold)}
  .orient p{margin:0;color:var(--k-fg-muted);font-size:var(--k-type-small);line-height:1.55;text-wrap:pretty}
  .orient__not{padding-top:var(--k-s-8);border-top:var(--k-divider);color:var(--k-fg-faint) !important}
  .orient__when{margin:0;padding:0;list-style:none;display:grid;gap:var(--k-s-6);
                font-size:var(--k-type-small);color:var(--k-fg-muted);line-height:1.5}
  .orient__when b{color:var(--k-fg);font-weight:var(--k-weight-medium)}

  /* the verdict IS the hero image */
  .verdict-card{margin-block-start:var(--k-s-32,2rem);text-align:start;overflow:hidden}
  .vc__head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--k-s-12);
            padding:var(--k-s-12) var(--k-s-16);border-bottom:var(--k-divider)}
  .vc__name{font-weight:var(--k-weight-semibold)}
  .vc__count{font-size:var(--k-type-small);color:var(--k-fg-muted);font-family:var(--k-font-mono)}
  .vc__list{list-style:none;margin:0;padding:0}
  .vc__list li{display:grid;grid-template-columns:1.25rem 5.5rem 1fr;gap:var(--k-s-10,.625rem);
               align-items:start;padding:var(--k-s-12) var(--k-s-16);border-bottom:var(--k-divider)}
  .vc__list li + li{border-top:0}
  .vc__mark{font-weight:var(--k-weight-bold);line-height:1.4}
  .vc__mark[data-s=gap]{color:var(--k-danger-text)}
  .vc__mark[data-s=review]{color:var(--k-warning-text)}
  .vc__mark[data-s=none]{color:var(--k-success-text)}
  .vc__sc{font-size:var(--k-type-small);font-family:var(--k-font-mono);color:var(--k-fg-faint);
          line-height:1.6;white-space:nowrap}
  .vc__t{display:block;font-weight:var(--k-weight-medium)}
  .vc__d{display:block;color:var(--k-fg-muted);font-size:var(--k-type-small);line-height:1.5;margin-top:3px;text-wrap:pretty}
  .vc__e{margin-top:var(--k-s-8);display:flex;flex-wrap:wrap;gap:var(--k-s-4)}
  .vc__e code{font-family:var(--k-font-mono);font-size:var(--k-type-small);
              background:var(--k-surface-2);border-radius:var(--k-radius-sm);padding:1px var(--k-s-6)}
  .vc__foot{padding:var(--k-s-16);background:var(--k-surface-2)}
  .vc__foot .code{height:5.5rem;background:var(--k-surface);border:var(--k-divider);
                  border-radius:var(--k-radius-md);padding:var(--k-s-10,.625rem) var(--k-s-12);
                  font:var(--k-type-small)/1.6 var(--k-font-mono);color:var(--k-fg);
                  inline-size:100%;resize:vertical;white-space:pre-wrap}
  .vc__examples{margin:var(--k-s-10,.625rem) 0 0;font-size:var(--k-type-small);color:var(--k-fg-muted);
                display:flex;flex-wrap:wrap;align-items:center;gap:var(--k-s-4)}

  .band{padding-block:var(--k-s-40,2.5rem)}
  .band h2{font-size:var(--k-type-h2);font-weight:var(--k-weight-semibold);letter-spacing:var(--k-track-tight);margin:0}
  .lede{margin:var(--k-s-8) 0 var(--k-s-20,1.25rem);color:var(--k-fg-muted);max-inline-size:60ch;text-wrap:pretty}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:var(--k-s-16);align-items:start}
  .split figure{margin:0;overflow:hidden}
  .split figcaption{font-size:var(--k-type-eyebrow);letter-spacing:var(--k-track-eyebrow);text-transform:uppercase;
                    color:var(--k-fg-muted);font-weight:var(--k-weight-semibold);
                    padding:var(--k-s-10,.625rem) var(--k-s-14,.875rem);border-bottom:var(--k-divider)}
  .stage__surface{padding:var(--k-s-20,1.25rem);background:var(--k-surface-sunken)}
  .tree{list-style:none;margin:0;padding:var(--k-s-12) 0;font-family:var(--k-font-mono);font-size:var(--k-type-small)}
  .tree li{display:grid;grid-template-columns:1.5rem 4.5rem 1fr;gap:var(--k-s-8);
           padding:var(--k-s-6) var(--k-s-14,.875rem);align-items:baseline}
  .tree .n{color:var(--k-fg-faint)}
  .tree .r{color:var(--k-primary-text);font-weight:var(--k-weight-medium)}
  .tree .v{color:var(--k-fg-muted);overflow-wrap:anywhere}
  .tree li[data-bad] .v{color:var(--k-danger-text);font-weight:var(--k-weight-medium)}
  .tree__foot{margin:0;padding:var(--k-s-10,.625rem) var(--k-s-14,.875rem);border-top:var(--k-divider);
              font-size:var(--k-type-small);color:var(--k-danger-text);font-family:var(--k-font-mono)}

  .layers{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--k-s-16)}
  .layers li{padding:var(--k-s-16);display:flex;flex-direction:column;gap:var(--k-s-6)}
  .layers__no{inline-size:1.5rem;block-size:1.5rem;border-radius:50%;display:grid;place-items:center;
              background:var(--k-primary-soft);color:var(--k-primary-soft-fg);
              font-size:var(--k-type-small);font-weight:var(--k-weight-bold)}
  .layers h3{margin:0;font-size:var(--k-type-h3);font-weight:var(--k-weight-semibold)}
  .layers p{margin:0;color:var(--k-fg-muted);font-size:var(--k-type-small);line-height:1.55}

  /* .cta is a .card, and the card recipe is a flex COLUMN — without resetting
     the direction the basis below became a height and the button sank to the
     bottom of a 416px box. Composing with a recipe means inheriting it. */
  .cta{display:flex;flex-direction:row;align-items:center;justify-content:space-between;
       gap:var(--k-s-24);padding:var(--k-s-24);flex-wrap:wrap}
  .cta > div{flex:1 1 26rem}
  .cta .btn{flex:none}
  .cta h2{margin:0 0 var(--k-s-4)}
  .cta p{margin:0;color:var(--k-fg-muted);max-inline-size:58ch}

  .receipts{list-style:none;margin:0;padding:0;display:grid;gap:var(--k-s-8)}
  .receipts li{display:grid;grid-template-columns:1rem 1fr;gap:var(--k-s-8);
               font-size:var(--k-type-small);color:var(--k-fg-muted);line-height:1.55}
  .receipts b{color:var(--k-fg);font-weight:var(--k-weight-medium)}
  .fine{margin:var(--k-s-16) 0 0;font-size:var(--k-type-small);color:var(--k-fg-faint);max-inline-size:60ch}
  .band--receipts{padding-block-end:var(--k-s-48,3rem)}

  @media (max-width:820px){
    .split,.layers,.cards3{grid-template-columns:1fr}
    .demo__stacks{margin-inline-start:0;overflow-x:auto;max-inline-size:100%;scrollbar-width:none}
    .vc__list li{grid-template-columns:1.25rem 1fr}
    .vc__sc{grid-column:2;white-space:normal}
  }
}
.preview{margin:0}
/* One name per element, and only the demo animates: two elements sharing a
   view-transition-name makes the browser skip the transition entirely. */
.demo__preview{view-transition-name:demo}
.demo .segctrl__btn--on{view-transition-name:demo-pill}
::view-transition-old(demo),::view-transition-new(demo){
  animation-duration:var(--k-dur,220ms);animation-timing-function:var(--k-ease,ease)}
::view-transition-old(demo){animation-name:a2ui-out}
::view-transition-new(demo){animation-name:a2ui-in}
@keyframes a2ui-out{to{opacity:0;transform:translateY(-4px) scale(.985)}}
@keyframes a2ui-in{from{opacity:0;transform:translateY(6px) scale(.99)}}
@media (prefers-reduced-motion:reduce){
  .demo__preview,.demo .segctrl__btn--on{view-transition-name:none}
}
/*TWCSS*/
</style>
<!--BODY-->
<script type="module">
/*MODULES*/
const CATALOGS = /*CATALOGS*/;
const CERT = /*CERT*/;
const SAMPLE_ZOD = /*ZOD*/;

const $ = (s) => document.querySelector(s)

/* ── the hero: what a vocabulary cannot say ───────────────────────────────── */
const EXAMPLES = {
  basic: { label: "A2UI Basic Catalog · Google", text: JSON.stringify(CATALOGS.basic.catalog), a11y: CATALOGS.basic.a11y },
  service: { label: 'Public-service catalog · ours', text: JSON.stringify(CATALOGS.service.catalog), a11y: null },
  zod: { label: 'A Zod schema', text: SAMPLE_ZOD, a11y: null },
}

function show(label, text, a11y) {
  const vocab = readVocabulary(text)
  const rep = audit(vocab, a11y)
  $('.vc__name').textContent = vocab.kind ? label : 'Could not read this'
  $('.vc__count').textContent = vocab.kind
    ? `${rep.components} components · ${rep.properties} properties · semantics ${rep.semantics}`
    : ''
  if (!vocab.kind) {
    $('.vc__list').innerHTML = `<li><span class="vc__mark" data-s="review">·</span><span class="vc__sc">—</span>
      <span><span class="vc__t">${rep.note}</span></span></li>`
    return
  }
  /* A vocabulary with nothing to report says so — a blank panel would read as a
     failure to run rather than as a pass. */
  const rows = rep.findings.length ? rep.findings : [{
    severity: 'none', sc: '—', title: 'Nothing to report',
    detail: 'Every component can be named, headings exist, names are required, and the side effects are enumerated. That is rarer than it sounds.', evidence: [],
  }]
  $('.vc__list').innerHTML = rows.map((f) => `<li>
    <span class="vc__mark" data-s="${f.severity}">${f.severity === 'gap' ? '✗' : f.severity === 'review' ? '·' : '✓'}</span>
    <span class="vc__sc">${f.sc}</span>
    <span><span class="vc__t">${f.title}</span><span class="vc__d">${f.detail}</span>
      ${f.evidence.length ? `<span class="vc__e">${f.evidence.map((e) => `<code>${e}</code>`).join('')}</span>` : ''}</span>
  </li>`).join('')
}

$('.vc__examples').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return
  const ex = EXAMPLES[btn.dataset.example]
  $('#paste').value = ''
  show(ex.label, ex.text, ex.a11y)
})
let typing
$('#paste').addEventListener('input', (e) => {
  clearTimeout(typing)
  const text = e.target.value
  typing = setTimeout(() => (text.trim() ? show('Yours', text, null) : show(EXAMPLES.basic.label, EXAMPLES.basic.text, EXAMPLES.basic.a11y)), 300)
})

/* ── the app in action ────────────────────────────────────────────────────── */
/* Our own catalog here, not Google's: this is the shot that shows what the
   bindings do, and the critique two sections down is where the Basic Catalog
   belongs. Different jobs, different vocabulary — said, not blurred. */
const SHOWCASE = [
  { version: 'v1.0', createSurface: { surfaceId: 'd', catalogId: CATALOGS.service.catalog.catalogId, dataModel: {
    case: { title: 'Case 2026-04471', sub: 'Dormer window · under review since 12 August', status: 'Under review' },
    facts: [{ label: 'Received', value: '3 August 2026' }, { label: 'Decision due', value: '28 September 2026' },
            { label: 'Procedure', value: 'Regular (8 weeks)' }],
  } } },
  { version: 'v1.0', updateComponents: { surfaceId: 'd', components: [
    { id: 'root', component: 'Card', child: 'body' },
    { id: 'body', component: 'Column', children: ['h', 'status', 'facts', 'cta'] },
    { id: 'h', component: 'Heading', level: 2, text: { path: '/case/title' }, sub: { path: '/case/sub' } },
    { id: 'status', component: 'Badge', tone: 'info', text: { path: '/case/status' } },
    { id: 'facts', component: 'SummaryList', items: { path: '/facts' } },
    { id: 'cta', component: 'Button', label: 'Open the case', variant: 'primary', action: 'open_case' },
  ] } },
]
const STACKS = Object.values(BINDINGS)
const CLS = { kit: 'b-kit', daisyui: 'b-daisy' }
const demo = { i: 0, playing: !matchMedia('(prefers-reduced-motion: reduce)').matches, timer: null }
const demoSurface = applyStream(SHOWCASE.map((m) => JSON.stringify(m))).get('d')
const demoTree = buildTree(demoSurface.components, 'root', { refs: childRefs(CATALOGS.service.catalog), model: demoSurface.model })

function paintDemo() {
  const b = STACKS[demo.i]
  const pv = $('.demo__preview')
  pv.className = 'preview demo__preview ' + (CLS[b.id] ?? 'b-tw')
  pv.innerHTML = walk(demoTree, (n, k, r, ka) => b.h(n, k, r, ka) ?? '', demoSurface.model)
  for (const el of $('.demo__stacks').children) {
    const on = el.dataset.s === b.id
    el.setAttribute('aria-checked', on)
    el.classList.toggle('segctrl__btn--on', on)
  }
}
function goto(i, animate = true) {
  demo.i = (i + STACKS.length) % STACKS.length
  if (!animate || !document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) return paintDemo()
  document.startViewTransition(paintDemo)
}
/* 2.2.2: content that updates itself has to be stoppable, so the control is
   real and the pointer stops it too — nobody reads a card that keeps moving. */
function play(on) {
  demo.playing = on
  clearInterval(demo.timer)
  if (on) demo.timer = setInterval(() => goto(demo.i + 1), 3200)
  const t = $('.demo__toggle')
  t.setAttribute('aria-pressed', String(on))
  t.querySelector('.demo__toggle-t').textContent = on ? 'Pause' : 'Play'
  t.querySelector('.demo__pause').style.display = on ? '' : 'none'
  t.querySelector('.demo__play').style.display = on ? 'none' : ''
}
$('.demo__stacks').innerHTML = STACKS.map((b) =>
  `<button class="segctrl__btn" role="radio" data-s="${b.id}" aria-checked="false" title="${b.note}">${b.label}</button>`).join('')
$('.demo__stacks').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return
  play(false)
  goto(STACKS.findIndex((b) => b.id === btn.dataset.s))
})
$('.demo__toggle').addEventListener('click', () => play(!demo.playing))
$('.demo').addEventListener('pointerenter', () => demo.playing && clearInterval(demo.timer))
$('.demo').addEventListener('pointerleave', () => demo.playing && play(true))
paintDemo()
play(demo.playing)

/* ── seen / said ──────────────────────────────────────────────────────────── */
/* A real answer through the real binding, and the same tree as check() reads it.
   Built from the Basic Catalog on purpose: its title can only be a Text, which
   is exactly what the right-hand column shows. */
const DEMO = [
  { version: 'v1.0', createSurface: { surfaceId: 's', catalogId: CATALOGS.basic.catalog.catalogId, dataModel: { postcode: '3011 AA' } } },
  { version: 'v1.0', updateComponents: { surfaceId: 's', components: [
    { id: 'root', component: 'Card', child: 'body' },
    { id: 'body', component: 'Column', children: ['t1', 't2', 'fld', 'btn'] },
    { id: 't1', component: 'Text', text: 'Case 2026-04471' },
    { id: 't2', component: 'Text', variant: 'caption', text: 'Dormer window · under review since 12 August' },
    { id: 'fld', component: 'TextField', value: { path: '/postcode' }, placeholder: '3011 AA' },
    { id: 'btnTxt', component: 'Text', text: 'Book this slot' },
    { id: 'btn', component: 'Button', child: 'btnTxt', variant: 'primary', action: 'book_slot' },
  ] } },
]
const ROLE = { text: 'text', image: 'image', link: 'link', heading: 'heading' }
function seenAndSaid() {
  const cat = CATALOGS.basic.catalog, a11y = CATALOGS.basic.a11y
  const surface = applyStream(DEMO.map((m) => JSON.stringify(m))).get('s')
  const tree = buildTree(surface.components, 'root', { refs: childRefs(cat), model: surface.model })
  /* .preview--seen, not .preview: the demo above wears .preview too, and a bare
     $('.preview') painted this into the demo — where the autoplay quietly
     overwrote it 3 seconds later, so the pane below just stayed empty. Twice in
     one project now: a class that STYLES is not a class to hook code on. */
  $('.preview--seen').innerHTML = walk(tree, (n, k, r, ka) => BINDINGS.kit.h(n, k, r, ka) ?? '', surface.model)

  const rep = check(tree, { catalog: cat, a11y, binding: { id: 'kit', certified: true } })
  const bad = new Map(rep.findings.filter((f) => f.severity === 'fail').map((f) => [f.id, f]))
  const ann = a11y.components
  const rows = []
  const val = (v) => resolve(v, surface.model, null, FUNCTIONS)
  /* Walked explicitly rather than through walk(): a Text inside a Button IS the
     button's name, and an accessibility tree does not announce it twice. That
     needs to know who the parent is, which a bottom-up render walk does not. */
  ;(function collect(n) {
    const a = ann[n.component]
    if (a && a.role !== 'layout') {
      const role = a.input ? 'field' : a.role === 'control' ? 'button' : ROLE[a.role] ?? a.role
      const name = a.nameFromChild
        ? (function text(x) { return x.text != null ? val(x.text) : (x.kids ?? []).map(text).filter(Boolean).join(' ') })(n)
        : val(n[a.name])
      rows.push({ role, name, bad: bad.get(n.id) })
      if (a.nameFromChild) return               // its children are its name, not siblings of it
    }
    for (const kid of n.kids ?? []) collect(kid)
  })(tree)

  $('.tree').innerHTML = rows.map((row, i) => `<li${row.bad ? ' data-bad' : ''}>
    <span class="n">${i + 1}</span><span class="r">${row.role}</span>
    <span class="v">${row.bad ? '✗ ' + row.bad.message : row.name ? '“' + row.name + '”' : '—'}</span></li>`).join('')
  const gaps = rep.catalogGaps.filter((g) => g.kind === 'structure')
  if (gaps.length) $('.tree').insertAdjacentHTML('afterend',
    `<p class="tree__foot">✗ ${gaps[0].sc} — ${gaps[0].message}</p>`)
}

/* ── receipts: read from the certificate, never typed ─────────────────────── */
function receipts() {
  const proof = describeBinding(CERT)
  const items = [
    [`${CERT.pairsChecked} contrast pairs over ${CERT.combinations} configurations`, proof.partial
      ? `${CERT.certifiedCombinations} clean. The other ${CERT.combinations - CERT.certifiedCombinations} are named in binding.json — a checked control at 1.61:1 in two dark themes, still open.`
      : 'all above the floor.'],
    ['Target size, focus, reflow', 'measured by the archived harness on its own markup, not on what these bindings emit. When this project’s markup was finally measured it was failing; that is fixed, and nothing here re-measures on every change.'],
    ['Six things the check never claims', 'whether the alt text describes the image, whether a heading describes its section, whether an error says how to fix it — returned by name, never counted as passing.'],
  ]
  $('.receipts').innerHTML = items.map(([b, t]) => `<li><span aria-hidden="true">·</span><span><b>${b}</b> — ${t}</span></li>`).join('')
}

show(EXAMPLES.basic.label, EXAMPLES.basic.text, EXAMPLES.basic.a11y)
seenAndSaid()
receipts()
</script>
