<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2UI, rendered and checked</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232b7fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='16' rx='2.5'/%3E%3Cpath d='M3 9h18M8.5 13l2 2-2 2'/%3E%3C/svg%3E">
<style>
/*KITCSS*/

/* ── the page chrome ──────────────────────────────────────────────────────
 * Direction B: the tool is built out of the kit it ships. Everything below is
 * layout — the surfaces, controls, tabs and alerts come from the kit's own
 * recipes, and every value here is a kit token. Nothing hard-codes a colour, a
 * radius or a type size, so editing tokens.css restyles the page as well as the
 * preview. That is the dogfood test, running on every load.
 *
 * The block is inside the same scope limit the kit CSS uses: it cannot reach
 * .preview. What the agent sent is dressed by the BINDING and by nothing else.
 */
*{box-sizing:border-box}
body{margin:0;background:var(--k-bg);color:var(--k-fg);font-size:var(--k-type-body);line-height:1.5}
/* --k-font-body reads 'Inter', sans-serif — it falls straight through to the
   generic family, so a machine without Inter gets Helvetica rather than the
   system face, and the kit ships no font files (no CDN, deliberately). The
   chain the token cannot carry is stated here, once, for the page AND the
   preview so the two never diverge on type. */
body, .b-kit, .b-tw, .b-daisy{
  font-family:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif}

@scope (.chrome) to (.preview) {
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--k-s-24);flex-wrap:wrap;
       padding:var(--k-s-24) var(--k-s-32,2rem) var(--k-s-16);background:var(--k-surface)}
  .wordmark{display:flex;align-items:center;gap:var(--k-s-8);margin:0 0 var(--k-s-6);
            font-size:var(--k-type-eyebrow);letter-spacing:var(--k-track-eyebrow);text-transform:uppercase;
            font-weight:var(--k-weight-semibold);color:var(--k-fg-muted)}
  .wordmark svg{color:var(--k-primary)}
  h1{font-size:var(--k-type-h2);font-weight:var(--k-weight-semibold);letter-spacing:var(--k-track-tight);margin:0}
  .standfirst{margin:var(--k-s-4) 0 0;color:var(--k-fg-muted);max-width:64ch}
  .top__stack{display:flex;flex-direction:column;align-items:flex-end;gap:var(--k-s-8)}
  .eyebrow{font-size:var(--k-type-eyebrow);letter-spacing:var(--k-track-eyebrow);text-transform:uppercase;color:var(--k-fg-faint)}

  .cats{padding:0 var(--k-s-32,2rem);background:var(--k-surface);border-bottom:var(--k-divider)}
  .cats .tab{background:transparent}

  main{display:grid;grid-template-columns:196px minmax(0,1fr) 28px minmax(0,1fr);
       gap:var(--k-s-16);padding:var(--k-s-20,1.25rem) var(--k-s-32,2rem) var(--k-s-16);align-items:start}
  /* aligned with the two pane heads, so it reads as 1 → 2 rather than floating
     halfway down a card whose height the answer decides */
  .flow{display:grid;place-items:center;align-self:start;block-size:var(--k-hit-min,44px);color:var(--k-fg-faint)}
  @media (max-width:1180px){
    main{grid-template-columns:1fr}
    .flow{display:none}
    /* on one column the palette is fifteen rows in front of the thing you came
       for, so the answer and the stream go first and the palette follows */
    .palette{order:3}
  }
  @media (max-width:680px){
    .top,.cats,main,.dogfood{padding-inline:var(--k-s-16)}
    .top__stack{align-items:stretch;inline-size:100%}
    /* four stacks are wider than a phone: scroll them rather than let the page
       scroll sideways */
    .stacks{max-inline-size:100%;overflow-x:auto;scrollbar-width:none}
    .stacks::-webkit-scrollbar{display:none}
    .cats{overflow-x:auto;scrollbar-width:none}
    .code{height:20rem}
    .pane__head{flex-wrap:wrap}
    .pane__head .tabs{margin-left:0;inline-size:100%}
  }

  section.card{padding:0;overflow:hidden;gap:0}

  /* the numbered heads make the direction of the page explicit */
  .pane__head{display:flex;align-items:center;gap:var(--k-s-8);padding:var(--k-s-10,.625rem) var(--k-s-12);
              border-bottom:var(--k-divider);min-height:var(--k-hit-min,44px)}
  .pane__no{inline-size:1.25rem;block-size:1.25rem;border-radius:50%;flex:none;display:grid;place-items:center;
            background:var(--k-primary-soft);color:var(--k-primary-soft-fg);
            font-size:var(--k-type-eyebrow);font-weight:var(--k-weight-bold)}
  .pane__head h2{font-size:var(--k-type-body);font-weight:var(--k-weight-semibold);margin:0}
  .pane__head .tabs{margin-left:auto;border-bottom:0;gap:var(--k-s-2,2px)}
  .pane__head .tab{min-height:1.75rem;font-size:var(--k-type-small);border-bottom-width:2px}

  .palette>h2{font-size:var(--k-type-eyebrow);letter-spacing:var(--k-track-eyebrow);text-transform:uppercase;
              color:var(--k-fg-muted);font-weight:var(--k-weight-semibold);margin:0;
              padding:var(--k-s-12) var(--k-s-14,.875rem);border-bottom:var(--k-divider);
              display:flex;justify-content:space-between;align-items:baseline}
  .count{letter-spacing:0;color:var(--k-primary-text);font-weight:var(--k-weight-semibold)}
  .blocks{list-style:none;margin:0;padding:var(--k-s-6)}
  .blocks li{margin:0}
  .blocks .checkbox{width:100%;padding:var(--k-s-6) var(--k-s-8);border-radius:var(--k-radius-sm)}
  .blocks .checkbox:hover{background:var(--k-state-hover)}
  .blocks input:disabled+.nm{color:var(--k-fg-faint)}
  .hint{font-size:var(--k-type-small);line-height:1.45;color:var(--k-fg-muted);margin:0;
        padding:var(--k-s-10,.625rem) var(--k-s-14,.875rem) var(--k-s-14,.875rem);border-top:var(--k-divider)}

  /* what the agent sent — a quiet sunken sheet, not a black slab: the chrome
     must not out-shout the answer next to it */
  .code{display:block;width:100%;margin:0;padding:var(--k-s-12) var(--k-s-14,.875rem);
        background:var(--k-surface-2);color:var(--k-fg);border:0;border-radius:0;
        font:var(--k-type-small)/1.6 var(--k-font-mono);height:520px;overflow:auto;resize:vertical}
  textarea.code{white-space:pre-wrap;word-break:break-word;tab-size:2}
  .outbar{display:flex;align-items:center;justify-content:space-between;gap:var(--k-s-12);
          padding:var(--k-s-8) var(--k-s-12);border-top:var(--k-divider)}
  .outnote{font-size:var(--k-type-small);color:var(--k-fg-muted)}
  .outbtns{display:flex;gap:var(--k-s-6);flex:none}

  .stage__surface{padding:var(--k-s-24);background:var(--k-surface-sunken);min-height:20rem}
  .verdict{margin-left:auto;font-size:var(--k-type-small);font-weight:var(--k-weight-semibold);
           padding:2px var(--k-s-8);border-radius:var(--k-radius-sm)}
  .verdict[data-v=AA]{background:var(--k-success-soft);color:var(--k-success-text)}
  .verdict[data-v=fail]{background:var(--k-danger-soft);color:var(--k-danger-text)}
  .verdict[data-v=needs-review],.verdict[data-v=unverified],.verdict[data-v=partial]{
           background:var(--k-warning-soft);color:var(--k-warning-text)}

  .report{padding:var(--k-s-12);display:flex;flex-direction:column;gap:var(--k-s-8)}
  .verdict-why{font-size:var(--k-type-small);line-height:1.5;margin-top:2px}
  .findings{font-size:var(--k-type-small);color:var(--k-fg-muted);display:flex;flex-direction:column}
  .findings div{padding:var(--k-s-6) 0;border-top:var(--k-divider)}
  .findings code{background:var(--k-surface-2);padding:1px var(--k-s-4);border-radius:var(--k-radius-sm);
                 font-family:var(--k-font-mono)}
  /* a gap is not a finding about the ANSWER — it is the catalog running out of
     vocabulary, and no renderer or agent can close it. Marked apart on purpose. */
  .findings .gap{color:var(--k-warning-text)}
  .findings .gap code{background:var(--k-warning-soft)}
  .proof{margin:0;font-size:var(--k-type-caption);line-height:1.5;color:var(--k-fg-faint)}

  .dogfood{display:flex;align-items:flex-start;gap:var(--k-s-8);margin:0;
           padding:0 var(--k-s-32,2rem) var(--k-s-32,2rem);max-width:96ch;
           font-size:var(--k-type-small);line-height:1.5;color:var(--k-fg-faint)}
  .dogfood svg{flex:none;margin-top:2px}
}

/* .preview sits OUTSIDE the chrome scope by construction, so its own frame is
   declared here — the one place the page is allowed to touch it. */
.preview{max-width:40rem;margin:0 auto}
.oops{margin:0;white-space:pre-wrap;color:var(--k-danger-text);background:var(--k-danger-soft);
      border:1px solid var(--k-danger);border-radius:var(--k-radius-md);padding:var(--k-s-14,.875rem);
      font:var(--k-type-small)/1.6 var(--k-font-mono)}

/* ── the stack switch, animated ───────────────────────────────────────────
 * Re-skinning the same answer with a different library is the most convincing
 * thing this page does, and it used to happen as a flicker. A view transition
 * gives the answer a real cross-fade, and naming the segmented control's ON
 * button makes the pill SLIDE to the stack you picked — one declaration, and
 * the two moving parts stay in step because the browser owns the timing.
 */
.preview{view-transition-name:answer}
.segctrl__btn--on{view-transition-name:stack-pill}
::view-transition-old(answer),::view-transition-new(answer){
  animation-duration:var(--k-dur,220ms);animation-timing-function:var(--k-ease,ease)}
::view-transition-old(answer){animation-name:a2ui-out}
::view-transition-new(answer){animation-name:a2ui-in}
@keyframes a2ui-out{to{opacity:0;transform:translateY(-4px) scale(.985)}}
@keyframes a2ui-in{from{opacity:0;transform:translateY(6px) scale(.99)}}
@media (prefers-reduced-motion:reduce){
  .preview,.segctrl__btn--on{view-transition-name:none}
}

/*TWCSS*/
</style>
<!--BODY-->
<script type="module">
/*MODULES*/
const CATALOGS = /*CATALOGS*/;
const CERT = /*CERT*/;

const $ = (s) => document.querySelector(s)
/* `edited` holds the stream the visitor typed or pasted. While it is set, the
   palette no longer describes what is on screen and the page says so — the
   alternative, silently regenerating over someone's paste, loses their work. */
const state = { cat: 'basic', stack: 'kit', tab: 'stream', picked: {}, edited: null }
for (const [id, c] of Object.entries(CATALOGS)) state.picked[id] = new Set(c.defaults)

const cur = () => CATALOGS[state.cat]
const names = () => Object.keys(cur().catalog.components)
/* Layout components are not a choice: something has to hold the answer. */
const isLayout = (n) => !!cur().demos[n]?.layout
const sourceOf = (n) => cur().catalog.components[n]?.['x-source'] ?? cur().catalog.title ?? ''

/* The demo answer: one Column of the picked blocks, inside a Card. This is a real
   A2UI surface — flat components, ids, a data model — not a mock. */
function buildStream() {
  const c = cur()
  const picked = names().filter((n) => state.picked[state.cat].has(n) && !isLayout(n) && c.demos[n])
  /* Structure and DATA travel apart, as A2UI intends: the components bind by
     JSON Pointer, the data model arrives in its own message. */
  const dataModel = {}
  for (const n of picked) for (const [k, val] of Object.entries(c.demos[n].data ?? {})) {
    dataModel[k] = (val && typeof val === 'object' && !Array.isArray(val)) ? { ...(dataModel[k] ?? {}), ...val } : val
  }
  const components = [
    { id: 'root', component: 'Card', child: 'body' },
    { id: 'body', component: 'Column', children: picked.map((n) => 'n_' + n) },
    /* A2UI has no inline children: a Button's label, a tab's panel and a modal's
       body are separate top-level components, referred to by id. */
    ...picked.flatMap((n) => [{ id: 'n_' + n, ...structuredClone(c.demos[n].node) }, ...structuredClone(c.demos[n].extra ?? [])]),
  ]
  return [
    { version: 'v1.0', createSurface: { surfaceId: 's', catalogId: c.catalog.catalogId, dataModel } },
    { version: 'v1.0', updateComponents: { surfaceId: 's', components } },
  ]
}

function subsetCatalog() {
  const c = cur(), keep = [...state.picked[state.cat]]
  const needed = keep.length ? [...new Set([...keep, 'Card', 'Column'])] : []
  return { ...c.catalog, components: Object.fromEntries(needed.filter((n) => c.catalog.components[n]).map((n) => [n, c.catalog.components[n]])) }
}

/* A throw used to leave the last good render on screen, so the page looked
   fine and lied — that is how a broken demo passed a browser check earlier
   today. Failures are shown where the answer belongs. */
function draw() {
  try { render() } catch (err) {
    $('.preview').innerHTML = `<pre class="oops">${err.message.replace(/[<&]/g, (c) => ({ '<': '&lt;', '&': '&amp;' }[c]))}</pre>`
    $('.verdict').dataset.v = 'fail'; $('.verdict').textContent = '✗ will not render'
    $('.findings').textContent = ''; $('.proof').textContent = ''
    if (state.edited == null) throw err      // ours to fix; a paste is theirs
  }
}

function render() {
  const stream = state.edited != null ? parseStream(state.edited) : buildStream()
  /* A pasted stream names its catalog. If it is one of ours, follow it rather
     than checking someone's answer against the wrong vocabulary. */
  const declared = stream.find((m) => m.createSurface)?.createSurface?.catalogId
  const match = declared && Object.keys(CATALOGS).find((id) => CATALOGS[id].catalog.catalogId === declared)
  if (match && match !== state.cat) { state.cat = match; syncRadio('.cats', 'c', match, 'tab--on'); palette() }

  const c = cur()
  const surfaces = applyStream(stream.map((m) => JSON.stringify(m)))
  const surface = surfaces.get('s') ?? [...surfaces.values()][0]
  if (!surface) throw new Error('No surface in this stream.\n\nAn A2UI stream opens with a createSurface message; without one there is nothing to render.')
  /* which properties hold child ids is READ FROM THE SCHEMA — Tabs hides one in
     tabs[].child and Modal calls them trigger/content */
  const tree = buildTree(surface.components, 'root', { refs: childRefs(c.catalog), model: surface.model })
  const b = BINDINGS[state.stack]

  /* preview — every stack renders to HTML so they can be compared without a build */
  const html = walk(tree, (n, k, r, ka) => b.h(n, k, r, ka) ?? `<div style="padding:8px;border:1px dashed #d4d4d8;border-radius:8px;color:#71717a;font-size:12px">${n.component} — not in this binding</div>`, surface.model)
  const pv = $('.preview')
  pv.className = 'preview ' + ({ kit: 'b-kit', daisyui: 'b-daisy' }[state.stack] ?? 'b-tw')
  pv.innerHTML = html

  /* verdict — the same check() the CLI runs, on the same tree */
  const hydrated = (function h(n) { const o = { ...n }
    if (n.items) o.resolvedItems = resolve(n.items, surface.model, n.scope ?? null, FUNCTIONS)
    o.kids = (n.kids ?? []).map(h); return o })(tree)
  /* only the kit binding has a certificate; the others render, and say so */
  const proof = b.id === 'kit' ? describeBinding(CERT) : describeBinding(null)
  const rep = check(hydrated, { catalog: c.catalog, a11y: c.a11y, binding: { id: b.id, ...proof } })
  $('.proof').textContent = `${b.label}: ${proof.line}`
  const v = $('.verdict'); v.dataset.v = rep.verdict
  const said = { AA: ['✓ AA', 'success', 'AA — answer clean'],
    fail: ['✗ fails', 'danger', `Fails — ${rep.findings.filter((f) => f.severity === 'fail').length} of them`],
    partial: ['◐ partial', 'warning', 'Partial — the catalog runs out of vocabulary here'],
    'needs-review': ['· needs review', 'warning', 'Needs a person to look'],
    unverified: ['? unverified', 'warning', 'Unverified — this binding has no certificate'] }[rep.verdict]
  v.textContent = said[0]
  /* alert--warning, never alert--warn: the kit says `warn` on a badge and
     `warning` on an alert, and getting that wrong renders with no tone at all. */
  $('.verdict-alert').className = `alert alert--${said[1]} verdict-alert`
  $('.verdict-title').textContent = said[2]
  $('.verdict-why').textContent = `${rep.why}. ${rep.counted.rules} rules ran; ${rep.unchecked.length} things this check never claims.`
  /* the gaps this answer RUNS INTO first, then the rest of the catalog's */
  const used = new Set(rep.gapsUsed)
  const gaps = [...rep.catalogGaps].sort((a, b) => used.has(b) - used.has(a))
    .map((g) => `<div class="gap"><code>${g.sc}</code> ${used.has(g) ? '<b>in this answer</b> — ' : ''}${g.message}</div>`).join('')
  $('.findings').innerHTML = rep.findings.map((f) => `<div><code>${f.sc ?? 'craft'}</code> ${f.message}</div>`).join('') + gaps

  const code = { catalog: JSON.stringify(subsetCatalog(), null, 2),
    binding: emit(b, tree, (t, fn) => walk(t, fn, surface.model)),
    /* the catalog as types you can validate with — generated, so it cannot
       drift from the vocabulary the agent was actually handed */
    schema: emitSchema(subsetCatalog()) }
  const editing = state.tab === 'stream'
  $('.code--edit').hidden = !editing
  $('pre.code').hidden = editing
  /* never write into the box while someone is typing in it */
  /* Shown indented, because the left pane is meant to be READ. On the wire A2UI
     is JSONL — one message per line — and that is what Copy gives you; both
     forms paste back in, and the note says so rather than leaving it a trap. */
  if (editing && state.edited == null) $('.code--edit').value = JSON.stringify(stream, null, 2)
  if (!editing) $('pre.code code').textContent = code[state.tab]
  $('.reset').hidden = state.edited == null
  $('.outnote').textContent = state.edited == null
    ? 'Built from the palette — edit it, or paste a stream of your own. Copy gives you JSONL, the form A2UI sends.'
    : 'Yours. The palette no longer describes what is on the right.'
  $('.count').textContent = `${[...state.picked[state.cat]].filter((n) => !isLayout(n)).length} of ${names().filter((n) => !isLayout(n)).length}`
}

/* The selected treatment comes from the kit's own recipe (`--on`), not from a
   rule of ours keyed on aria — same reason the page uses .card and .alert: if
   the recipe changes, this changes with it. aria carries the meaning either way. */
function syncRadio(sel, key, val, onClass) {
  for (const el of $(sel).children) {
    const on = el.dataset[key] === val
    el.setAttribute('aria-checked', on)
    el.classList.toggle(onClass, on)
  }
}

/* palette — redrawn on every catalog switch, because the blocks ARE the catalog */
function palette() {
  $('.blocks').innerHTML = names().map((n) => `<li><label class="checkbox" title="${sourceOf(n)}">
    <input type="checkbox" value="${n}" ${state.picked[state.cat].has(n) ? 'checked' : ''}${isLayout(n) ? ' disabled' : ''}>
    <span class="nm">${n}</span></label></li>`).join('')
  $('.hint').textContent = cur().note
}
$('.blocks').addEventListener('change', (e) => {
  e.target.checked ? state.picked[state.cat].add(e.target.value) : state.picked[state.cat].delete(e.target.value)
  state.edited = null; draw()          // the palette is back in charge, and says so
})
/* catalogs */
$('.cats').innerHTML = Object.entries(CATALOGS).map(([id, c]) =>
  `<button class="tab${id === state.cat ? ' tab--on' : ''}" role="radio" data-c="${id}" aria-checked="${id === state.cat}">${c.label}</button>`).join('')
$('.cats').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return
  state.cat = btn.dataset.c; state.edited = null
  syncRadio('.cats', 'c', state.cat, 'tab--on'); palette(); draw()
})
/* stacks */
$('.stacks').innerHTML = Object.values(BINDINGS).map((b) =>
  `<button class="segctrl__btn${b.id === state.stack ? ' segctrl__btn--on' : ''}" role="radio" data-s="${b.id}" aria-checked="${b.id === state.stack}" title="${b.note}">${b.label}</button>`).join('')
/* Re-skinning the same answer is the most convincing thing here and it used to
   be a flicker. The browser owns the timing, so the answer's cross-fade and the
   segmented control's sliding pill cannot drift apart. Anything that is not a
   deliberate stack switch — typing, ticking a component — still renders at once;
   an animation on every keystroke would be a tax, not a feature. */
const reduced = matchMedia('(prefers-reduced-motion: reduce)')
$('.stacks').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn || btn.dataset.s === state.stack) return
  const swap = () => { state.stack = btn.dataset.s; syncRadio('.stacks', 's', state.stack, 'segctrl__btn--on'); draw() }
  if (reduced.matches || !document.startViewTransition) return swap()
  document.startViewTransition(swap)
})
/* tabs — a roving tabindex and arrow keys, because role="tab" is a promise
   about keyboard behaviour and we would be selling a check we failed */
/* `.tabs` is the kit's RECIPE, and the catalog nav wears it too — so a bare
   $('.tabs') grabbed the wrong element the moment the chrome started using kit
   classes, and the artefact tabs silently stopped switching. A class that
   styles is not a class to hook JavaScript on; the container is addressed by
   where it lives. */
const tabs = () => [...$('.out .tabs').children]
function selectTab(btn, focus) {
  state.tab = btn.dataset.tab
  for (const el of tabs()) {
    const on = el === btn
    el.setAttribute('aria-selected', on)
    el.classList.toggle('tab--on', on)
    el.tabIndex = on ? 0 : -1
  }
  if (focus) btn.focus()
  draw()
}
$('.out .tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (btn) selectTab(btn, false)
})
$('.out .tabs').addEventListener('keydown', (e) => {
  const step = { ArrowRight: 1, ArrowLeft: -1, Home: 'first', End: 'last' }[e.key]
  if (!step) return
  e.preventDefault()
  const all = tabs(), i = all.indexOf(document.activeElement)
  selectTab(step === 'first' ? all[0] : step === 'last' ? all.at(-1) : all[(i + step + all.length) % all.length], true)
})
$('.copy').addEventListener('click', async () => {
  await navigator.clipboard.writeText(state.tab === 'stream'
    ? parseStream($('.code--edit').value).map((m) => JSON.stringify(m)).join('\n')
    : $('pre.code code').textContent)
  $('.copy').textContent = 'Copied'; setTimeout(() => ($('.copy').textContent = 'Copy'), 1400)
})
/* the stream is the input, not an output: typing in it re-renders the answer */
let typing
$('.code--edit').addEventListener('input', (e) => {
  state.edited = e.target.value
  clearTimeout(typing)
  typing = setTimeout(draw, 250)   // long enough that half-typed JSON does not flash an error
})
$('.reset').addEventListener('click', () => { state.edited = null; draw(); $('.code--edit').focus() })
palette(); draw()
</script>
